<!doctype html>
<html lang="de">
<head>
<title>B&amp;B Lager</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B&amp;B Lager">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#17684f">
<script>
// Direkt aus dem Dropbox-Ordner geöffnet (file://): dort hätte die App einen eigenen, getrennten Speicher
// und keinen Offline-Betrieb, also zur Online-Version weiterleiten. Ohne Netz übernimmt deren Offline-Speicher.
if (location.protocol === 'file:') location.replace('https://bundb-app.github.io/App/' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Lagerliste wie ein Regaletikett – kräftige Kondensschrift für Bestände, ruhige Flächen, Akzent Flaschengrün */
:root{
  --bg:#edf0f1; --surface:#ffffff; --sunk:#e4e9eb; --ink:#152029; --muted:#5a6873; --line:#d3dadf;
  --accent:#17684f; --accent-ink:#ffffff; --accent-soft:#dcece5;
  --warn:#9a5a12; --warn-soft:#f6e8d3; --bad:#b0281f; --bad-soft:#f7dedb; --good:#17684f;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172027; --sunk:#121a20; --ink:#e4eaee; --muted:#93a2ad; --line:#2a3741;
  --accent:#4cc39a; --accent-ink:#04261a; --accent-soft:#18352b;
  --warn:#e3a457; --warn-soft:#3a2b17; --bad:#f07a70; --bad-soft:#3b1d1b; --good:#4cc39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172027; --sunk:#121a20; --ink:#e4eaee; --muted:#93a2ad; --line:#2a3741;
  --accent:#4cc39a; --accent-ink:#04261a; --accent-soft:#18352b;
  --warn:#e3a457; --warn-soft:#3a2b17; --bad:#f07a70; --bad-soft:#3b1d1b; --good:#4cc39a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font:700 26px/1 var(--f-display);letter-spacing:.01em;white-space:nowrap}
.brand small{font:500 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer}
nav.tabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);display:inline-block;margin-left:5px;min-width:18px;padding:2px 5px;border-radius:9px;background:var(--warn);color:var(--surface);font:600 11px/1.2 var(--f-body);text-align:center}
select.need{border-color:var(--warn)}
.split{display:grid;gap:14px}
@media (min-width:1000px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.split>details{position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}.split>details iframe{height:75vh!important}}
.split .line .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.split .line .map{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split .line .map .res{grid-column:1/-1;padding:0}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 11px;font:500 12px var(--f-body);cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--good)} .sync[data-s="busy"] i{background:var(--warn);animation:pulse 1s infinite}
.sync[data-s="err"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync[data-s="busy"] i{animation:none}}
main{padding-block:20px 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.05} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 13px;font:500 14px var(--f-body);cursor:pointer;text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:38px;min-width:0;width:100%}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stats{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:700 30px/1.1 var(--f-display)}
.pill{display:inline-block;font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ok{background:var(--accent-soft);color:var(--good)}
/* Bestandsliste */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{border-top:1px solid var(--line)} .item:first-child{border-top:0}
.item>button.head{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.item>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .qty{font:700 26px/1 var(--f-display);text-align:right;min-width:3ch}
.item .qty small{font:500 12px var(--f-body);color:var(--muted);margin-left:4px}
.item.low{box-shadow:inset 4px 0 0 var(--warn)} .item.neg{box-shadow:inset 4px 0 0 var(--bad)}
.detail{padding:4px 14px 16px;display:grid;gap:14px;background:var(--sunk);border-top:1px dashed var(--line)}
.mv{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.mv:first-child{border-top:0}
.plus{color:var(--good)} .minus{color:var(--bad)}
/* Beleg-Prüfung */
.line{display:grid;gap:8px 10px;grid-template-columns:28px minmax(0,1fr);padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line.off{opacity:.45}
.line .fields{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}
.line .map{display:grid;gap:8px;grid-template-columns:minmax(0,2.2fr) minmax(0,.8fr) minmax(0,1fr);align-items:end}
.res{font:700 20px/1 var(--f-display);padding-bottom:9px}
.inbox{display:grid;gap:0}
.inbox .file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.inbox .file:first-child{border-top:0}
.tag{font:600 10px/1 var(--f-mono);padding:4px 5px;border-radius:4px;background:var(--sunk);color:var(--muted);text-transform:uppercase}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:6px;font-size:14px}
/* Personal */
.item.amp-red{box-shadow:inset 4px 0 0 var(--bad)} .item.amp-yellow{box-shadow:inset 4px 0 0 var(--warn)} .item.amp-green{box-shadow:inset 4px 0 0 var(--good)}
.need-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.stat.need.bad b{color:var(--bad)} .stat.need.warn b{color:var(--warn)} .stat.need.ok b{color:var(--good)}
.asg-head{padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.asg{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.asg-head+.asg{border-top:0}
.asg.off>.row:first-child b{text-decoration:line-through;color:var(--muted)}
.st-sel{width:auto;flex:none;min-height:0;padding:4px 22px 4px 10px;border:0;border-radius:99px;font:600 12px/1.4 var(--f-body);cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.st-angefragt{background-color:var(--warn-soft);color:var(--warn)} .st-bestaetigt{background-color:var(--accent-soft);color:var(--good)} .st-abgesagt{background-color:var(--bad-soft);color:var(--bad)}
.pcat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.daychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.daychips button{flex:none;display:grid;grid-template-columns:auto auto;align-items:center;column-gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:600 14px var(--f-body);cursor:pointer}
.daychips button small{grid-column:2;font-weight:400;font-size:12px;color:var(--muted)}
.daychips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.dot.amp-red{background:var(--bad)} .dot.amp-yellow{background:var(--warn)} .dot.amp-green{background:var(--good)}
.pday{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;margin:0;display:grid;gap:10px;min-width:0}
.pday legend{font:600 13px var(--f-body);padding:0 6px}
.prole{display:grid;grid-template-columns:minmax(58px,1fr) 44px 78px 78px;gap:5px;align-items:center}
.prole input{padding:6px 4px;font-size:14px;text-align:center}
.prole input::-webkit-calendar-picker-indicator{display:none}
.pday{padding:10px 8px 12px}
.prole-n{font-size:13px;font-weight:500;overflow-wrap:break-word;hyphens:auto;min-width:0}
.prole-h{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:-4px}
button.stat.need{all:unset;box-sizing:border-box;display:grid;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
button.stat.need b{font:700 24px/1.1 var(--f-display)}
button.stat.need[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
button.stat.need:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile-more{position:absolute;right:10px;top:8px;color:var(--muted);font-size:12px}
.tm{text-align:center;font-variant-numeric:tabular-nums}
button.stat.need .eyebrow{padding-right:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.tile-p{padding-top:10px;border-top:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font:500 14px var(--f-body);padding:5px 12px 5px 9px;margin-left:-2px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.back span{font:700 20px/1 var(--f-display);margin-top:-2px}
.back:hover{color:var(--ink);border-color:var(--muted)}
.ovw{display:grid;gap:10px;background:var(--accent-soft);border-radius:14px;padding:12px}
.ovw .tile-list{box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.plan-h{margin-top:14px;padding-top:18px;border-top:2px solid var(--line)}
.ist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px;gap:8px;align-items:end}
.ist .res{text-align:right}
.asg-edit summary{list-style:none} .asg-edit summary::-webkit-details-marker{display:none}
.asg-edit[open]{flex-basis:100%}
.shift{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px}
.module .tag.warn{background:var(--warn-soft);color:var(--warn)}
/* Startseite: Auswahl der Bereiche */
/* Jeder Bereich hat sein Hauptmenü: #tabs im Lager, #ptabs im Personal, auf der Startseite keins */
body[data-area="home"] nav.tabs, body[data-area="personal"] #tabs, body:not([data-area="personal"]) #ptabs, body[data-area="personal"] .fab-lager{display:none}
body[data-area="home"] main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body[data-area="home"] .sync{margin-left:auto}
.brand{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.module{display:grid;gap:10px;align-content:start;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 20px;cursor:pointer;font:inherit;min-height:170px}
.module:hover{border-color:var(--accent)}
.module:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.module b{font:700 40px/1 var(--f-display);letter-spacing:.01em}
.module .tag{justify-self:start;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.module .tag.soon{background:var(--sunk);color:var(--muted)}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%} th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
th{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}
td.r,th.r{text-align:right}
pre.raw{white-space:pre-wrap;font:12px/1.45 var(--f-mono);background:var(--sunk);padding:10px;border-radius:8px;max-height:280px;overflow:auto}
ol.steps,ul.steps{padding-left:20px;margin:0;display:grid;gap:6px}
.guide-link{display:flex;align-items:center;justify-content:space-between;gap:12px;color:inherit;text-decoration:none}
.guide-link>span[aria-hidden]{font:700 26px/1 var(--f-display);color:var(--muted)}
.guide-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.guide-num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 18px/1 var(--f-display)}
code{font:13px var(--f-mono);background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}

/* Schnellbuchungs-Leiste wie die Kacheln: links Lager, rechts Platz für Personal */
.fabs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:12;
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.fab-lager{margin-right:auto}
.fab-personal{margin-left:auto}
body[data-area="lager"] .fab-personal{display:none}
.fab small{display:none;font:600 10px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
body[data-area="home"] .fab small{display:block;margin-top:3px}
.fab-t{white-space:nowrap;text-align:left}
.fab{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:13px 18px;font:600 15px var(--f-body);cursor:pointer;box-shadow:0 6px 18px rgb(0 0 0 / .22)}
.fab b{font:700 22px/1 var(--f-display)}
.qb-back{position:fixed;inset:0;z-index:30;background:rgb(10 16 20 / .45);display:flex;align-items:center;justify-content:center;padding:16px}
.qb{background:var(--surface);color:var(--ink);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid;gap:14px;
  padding:18px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));box-shadow:0 20px 50px rgb(0 0 0 / .3)}
.qb-list{display:grid;gap:6px;max-height:220px;overflow:auto}
.qb-art{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.qb-art:focus-visible{outline:2px solid var(--accent)}
.qb-art[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px}
.stepper button{font:700 26px/1 var(--f-display);border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;cursor:pointer;min-height:52px}
.stepper input{text-align:center;font:700 28px/1 var(--f-display);min-height:52px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:500 14px var(--f-body);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg.big{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.big button{padding:10px;font-size:15px}
.seg.big button[data-qdir="-1"][aria-pressed="true"]{color:var(--bad)}
.seg.big button[data-qdir="1"][aria-pressed="true"]{color:var(--good)}
.toast button{margin-left:12px;background:none;border:0;color:inherit;font:600 14px var(--f-body);text-decoration:underline;cursor:pointer}

<script>
/* ===================== PARSER-START (reine Funktionen, ohne DOM) ===================== */
const UNIT_WORDS = ['stk','stück','st','fl','flasche','flaschen','kiste','kisten','ki','ka','kasten','kt','karton','pck','pack','packung','pk','kg','g','l','ltr','liter','sack','tray','glas','tasse','dose','dosen','fass','eimer','btl','beutel','rolle','satz','set','paar','ve'];
const SUMMARY_RX = /\b(summe|zwischensumme|gesamtbetrag|gesamtsumme|rechnungsbetrag|netto|brutto|mwst|ust\b|umsatzsteuer|übertrag|uebertrag|skonto|zahlbar|endbetrag|zu zahlen)\b/i;

function parseNum(t){
  if(t==null) return NaN;
  t = String(t).trim().replace(/€|eur$/i,'').replace(/^\+/,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) return parseFloat(t.replace(/\./g,'').replace(',','.'));
  if(/^-?\d{1,3}(,\d{3})+\.\d+$/.test(t)) return parseFloat(t.replace(/,/g,''));
  if(/^-?\d+,\d+$/.test(t)) return parseFloat(t.replace(',','.'));
  if(/^-?\d+\.\d{1,2}$/.test(t)) return parseFloat(t);
  if(/^-?\d+$/.test(t)) return parseInt(t,10);
  return NaN;
}
const isCodeTok = t => /^[A-Z0-9]+[-\/][A-Z0-9\-\/]+$/.test(t);
const isWord = t => /[a-zA-ZäöüÄÖÜß]{2,}/.test(t) && !/\d/.test(t) && !isCodeTok(t);
const isCode = t => /\d/.test(t) && /^[A-Za-z0-9][A-Za-z0-9\-\/\.]{2,}$/.test(t) && isNaN(parseNum(t));

function normText(s){
  return String(s||'').toLowerCase().replace(/ß/g,'ss').replace(/[^a-z0-9äöü,\.x ]+/g,' ').replace(/\s+/g,' ').trim();
}
/* Gebindefaktor aus Text wie "Kiste 20x0,5l" oder "24 x 0,33" */
function guessFactor(desc){
  const m = String(desc).match(/(\d{1,3})\s*[x×]\s*\d/i);
  return m ? parseInt(m[1],10) : 1;
}
/* Artikelname ohne Gebinde: "Elbtaler Pils Kiste 20x0,5l" -> "Elbtaler Pils 0,5l" */
function cleanName(desc){
  return String(desc).replace(/\b(kiste|kisten|kasten|karton|ka|kt|tray|gebinde|pack|packung)\b/ig,' ')
    .replace(/\b\d{1,3}\s*[x×]\s*/i,'').replace(/\s+/g,' ').trim();
}

/* Eine Textzeile -> Position oder null */
function parseItemLine(line){
  if(!line || SUMMARY_RX.test(line)) return null;
  const toks = line.replace(/\s+€/g,'€').split(/\s+/).filter(Boolean);
  const nums = [];
  toks.forEach((t,i)=>{ const v=parseNum(t); if(!isNaN(v)) nums.push({i,v,dec:/[,.]\d{2}$/.test(t.replace(/€$/,''))}); });
  if(nums.length<2 || !toks.some(isWord)) return null;
  let best=null;
  outer: for(let k=nums.length-1;k>=2;k--){
    const T=nums[k]; if(!(T.v>0)) continue;
    for(let j=k-1;j>=1;j--){
      const P=nums[j]; if(!(P.v>0)) continue;
      for(let i=j-1;i>=0;i--){
        const Q=nums[i]; if(!(Q.v>0) || Q.v>100000) continue;
        const prod=Q.v*P.v, tol=Math.max(0.02, T.v*0.006);
        if(Math.abs(prod-T.v)<=tol){ best={Q,P,T}; break outer; }
      }
    }
  }
  if(!best){
    // Menge nicht lesbar (z. B. Foto): aus Gesamt / Einzelpreis zurückrechnen
    const dec = nums.filter(n=>n.dec && n.v>0);
    if(dec.length<2) return null;
    const T=dec[dec.length-1], Pp=dec[dec.length-2], q=T.v/Pp.v, rq=Math.round(q);
    if(rq<1 || Math.abs(q-rq)>0.01) return null;
    best={Q:{i:-1,v:rq},P:Pp,T,calc:true};
  }
  const used = new Set([best.Q.i,best.P.i,best.T.i]);
  // führende Pos-/Artikelnummern
  let art='', firstWord = toks.findIndex(isWord);
  const lead = toks.slice(0, Math.max(0,firstWord)).map((t,i)=>({t,i})).filter(o=>!used.has(o.i));
  lead.forEach(o=>used.add(o.i));
  const codes = lead.filter(o=>o.t.length>=3);
  if(codes.length) art = codes[codes.length-1].t;
  // Einheit direkt nach der Menge
  let unit='';
  const isUnit = t => t && UNIT_WORDS.includes(t.toLowerCase().replace(/\.$/,''));
  let ui = best.Q.i>=0 ? best.Q.i+1 : -1;
  if(best.Q.i<0){ for(let x=best.P.i-1;x>=Math.max(0,best.P.i-3);x--){ if(isUnit(toks[x])){ ui=x; break; } } }
  if(ui>=0 && isUnit(toks[ui])){ unit=toks[ui].replace(/\.$/,''); used.add(ui); }
  const desc = toks.filter((t,i)=>!used.has(i) && i<best.T.i && !/^[%€]$/.test(t) && !/^\d+([,.]\d+)?\s*%$/.test(t) && !(isNaN(parseNum(t))===false && i>best.P.i))
    .filter(t=>!(t.toUpperCase()==='EUR') && /[A-Za-z0-9äöüÄÖÜß]/.test(t)).join(' ').trim();
  if(!desc || !/[a-zA-ZäöüÄÖÜ]{2,}/.test(desc)) return null;
  return {art, desc, qty:best.Q.v, unit, price:best.P.v, total:best.T.v, calc:!!best.calc};
}

function parseHeader(lines, ownName){
  const text = lines.join('\n');
  let number='', date='', party='';
  const nm = text.match(/(?:rechnungs?[\s-]*(?:nr|nummer|no)\.?|beleg[\s-]*(?:nummer|nr)\.?|lieferschein[\s-]*(?:nr|nummer)\.?|invoice\s*(?:no|number)\.?)\s*[:#]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,})/i);
  if(nm) number = nm[1].replace(/[.,]$/,'');
  const dl = lines.find(l=>/rechnungsdatum|datum/i.test(l) && /\d{1,2}\.\d{1,2}\.\d{2,4}/.test(l)) || text;
  const dm = dl.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})\b/);
  if(dm){ let y=dm[3]; if(y.length===2) y='20'+y; date = `${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`; }
  const own = normText(ownName||'B&B');
  let ownIdx=-99;
  for(const [idx,raw] of lines.slice(0,14).entries()){
    if(own && normText(raw).includes(own)){ ownIdx=idx; continue; }
    if(ownIdx>0 && idx>ownIdx && idx<=ownIdx+3) continue;   // Empfänger-Adressblock (eigene Firma als Empfänger)
    const l = raw.replace(/\s*(rechnungs|rechnung\b|lieferdatum|datum|kunden|seite).*$/i,'').trim();
    if(!l || l.length<3) continue;
    if(own && normText(l).includes(own)) continue;
    if(/·|\bust|steuer|iban|\b\d{5}\b|straße|str\.|tel\.|@|www\./i.test(l)) continue;
    if(/^(rechnung|lieferschein|pos|art)|bezeichnung|einzelpreis|menge/i.test(l)) continue;
    if(!/[a-zA-ZäöüÄÖÜ]{3,}/.test(l)) continue;
    party = l; break;
  }
  return {number, date, party};
}

function parseTextDoc(lines, ownName){
  const items = [];
  for(const l of lines){ const it=parseItemLine(l); if(it) items.push(it); }
  return {...parseHeader(lines, ownName), items};
}

const UNIT_CODES = {C62:'Stk',H87:'Stk',EA:'Stk',XPP:'Stk',CS:'Kiste',XCS:'Kiste',CR:'Kiste',XCR:'Kiste',CT:'Karton',XCT:'Karton',KGM:'kg',GRM:'g',LTR:'l',PK:'Pck',XPK:'Pck',BO:'Fl',XBO:'Fl',XBX:'Karton',SA:'Sack',XSA:'Sack'};

/* XRechnung / ZUGFeRD (CII und UBL). Erwartet ein XML-Document. */
function parseXmlDoc(doc){
  const q=(el,name)=>el? el.getElementsByTagNameNS('*',name)[0]||null : null;
  const qt=(el,...path)=>{ let e=el; for(const p of path){ e=q(e,p); if(!e) return ''; } return (e.textContent||'').trim(); };
  const root = doc.documentElement; const ln = root.localName;
  let out = {number:'',date:'',party:'',buyer:'',items:[]};
  const fmtDate = s => { s=(s||'').trim(); if(/^\d{8}$/.test(s)) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`; return s.slice(0,10); };
  if(ln==='CrossIndustryInvoice'){
    out.number = qt(root,'ExchangedDocument','ID');
    out.date = fmtDate(qt(root,'ExchangedDocument','IssueDateTime','DateTimeString'));
    out.party = qt(root,'SellerTradeParty','Name');
    out.buyer = qt(root,'BuyerTradeParty','Name');
    for(const li of root.getElementsByTagNameNS('*','IncludedSupplyChainTradeLineItem')){
      const bq = q(li,'BilledQuantity');
      const qty = parseFloat(bq?.textContent||'0');
      const price = parseFloat(qt(li,'NetPriceProductTradePrice','ChargeAmount')||'0');
      const total = parseFloat(qt(li,'LineTotalAmount')||String(qty*price));
      out.items.push({art:qt(li,'SpecifiedTradeProduct','SellerAssignedID'), desc:qt(li,'SpecifiedTradeProduct','Name'), qty, unit:UNIT_CODES[bq?.getAttribute('unitCode')]||bq?.getAttribute('unitCode')||'', price, total});
    }
  } else if(ln==='Invoice' || ln==='CreditNote'){
    const kids = [...root.children];
    out.number = (kids.find(e=>e.localName==='ID')?.textContent||'').trim();
    out.date = fmtDate((kids.find(e=>e.localName==='IssueDate')?.textContent||''));
    const sup = q(root,'AccountingSupplierParty');
    out.party = qt(sup,'PartyName','Name') || qt(sup,'RegistrationName');
    out.buyer = qt(q(root,'AccountingCustomerParty'),'RegistrationName');
    const tag = ln==='Invoice'?'InvoiceLine':'CreditNoteLine';
    for(const li of root.getElementsByTagNameNS('*',tag)){
      const qe = q(li, ln==='Invoice'?'InvoicedQuantity':'CreditedQuantity');
      const qty=parseFloat(qe?.textContent||'0');
      const price=parseFloat(qt(li,'Price','PriceAmount')||'0');
      const total=parseFloat(qt(li,'LineExtensionAmount')||String(qty*price));
      out.items.push({art:qt(li,'SellersItemIdentification','ID'), desc:qt(li,'Item','Name'), qty, unit:UNIT_CODES[qe?.getAttribute('unitCode')]||qe?.getAttribute('unitCode')||'', price, total});
    }
  } else return null;
  return out;
}

/* CSV mit Kopfzeile */
function parseCsv(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0];
  const delim = [';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=c; }
    else if(c==='"') inQ=true;
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; if(row.some(x=>x.trim())) rows.push(row); row=[]; }
    else cell+=c;
  }
  row.push(cell); if(row.some(x=>x.trim())) rows.push(row);
  if(rows.length<2) return null;
  const H = rows[0].map(h=>normText(h));
  const find = (...rx)=>{ for(const r of rx){ const i=H.findIndex(h=>r.test(h)); if(i>=0) return i; } return -1; };
  const c = {
    art: find(/artikel ?nr|artikelnummer|art\.? ?nr|^sku|^ean|^nr$/),
    desc: find(/bezeichnung|beschreibung|^artikel$|produkt|^name|^text/),
    qty: find(/^menge|anzahl|^qty|stückzahl/),
    unit: find(/^einheit|^me$|^unit/),
    price: find(/einzelpreis|^preis|^ep$|stückpreis|^vk/),
    total: find(/^gesamt|summe|betrag|^gp$/),
    party: find(/lieferant|^kunde|^firma|händler/),
    number: find(/beleg|rechnungs|^re ?nr|lieferschein/),
    date: find(/datum|^date/),
  };
  if(c.desc<0 || c.qty<0) return null;
  const items=[]; let party='',number='',date='';
  for(const r of rows.slice(1)){
    const g = k => c[k]>=0 ? (r[c[k]]||'').trim() : '';
    const qty=parseNum(g('qty')); if(!g('desc') || isNaN(qty)) continue;
    let price=parseNum(g('price')), total=parseNum(g('total'));
    if(isNaN(price) && !isNaN(total) && qty) price=total/qty;
    if(isNaN(total) && !isNaN(price)) total=price*qty;
    items.push({art:g('art'), desc:g('desc'), qty, unit:g('unit'), price:isNaN(price)?0:price, total:isNaN(total)?0:total});
    party = party || g('party'); number = number || g('number'); date = date || g('date');
  }
  const dm = date.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if(dm){ let y=dm[3]; if(y.length===2) y='20'+y; date=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`; }
  return {party, number, date, items};
}

/* Ähnlichkeit zweier Bezeichnungen (0..1) */
function similarity(a,b){
  const stop = new Set(['kiste','kasten','karton','fl','flasche','stk','x','und','mit','der','die','das']);
  const ta = new Set(normText(cleanName(a)).split(' ').filter(t=>t && !stop.has(t)));
  const tb = new Set(normText(cleanName(b)).split(' ').filter(t=>t && !stop.has(t)));
  if(!ta.size||!tb.size) return 0;
  let inter=0; ta.forEach(t=>{ if(tb.has(t)) inter++; });
  return inter / Math.max(ta.size, tb.size);
}
/* ===================== PARSER-END ===================== */

/* ===================== Zustand ===================== */
const APP_URL='https://bundb-app.github.io/App/', REPO_URL='https://github.com/BundB-App/App';
const LS_DATA='bb-lager-data-v1', LS_CFG='bb-lager-cfg-v1';
const COLLS=['articles','movements','docs','rules'];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const now = () => Date.now();
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function emptyState(){ return {articles:{},movements:{},docs:{},rules:{},meta:{v:1}}; }
let S = Object.assign(emptyState(), lsGet(LS_DATA)||{});
COLLS.forEach(c=>{ if(!S[c]) S[c]={}; });
/* Standardordner. Früher lag der Ordner direkt in der Dropbox; die App findet beide Orte selbst (findBase). */
const BASE_DEFAULT='/Apps/BundB App', BASE_KNOWN=['/Apps/BundB App','/BundB App'];
/* App key der Dropbox-App „B&B Lager“. Nicht geheim (PKCE, kein App secret); identifiziert nur das Programm.
   Jede Person meldet sich beim Verbinden mit ihrem eigenen Dropbox-Konto an. */
const APP_KEY='93rr96fr7l814zc';
let CFG = Object.assign({appKey:'', base:BASE_DEFAULT, ownName:'B&B', refresh:'', access:'', accessExp:0, verifier:'', authUrl:'', lastSync:0, autoBook:false}, lsGet(LS_CFG)||{});
if(!CFG.appKey) CFG.appKey = APP_KEY;

/* Personal: eigene Datei personal.json mit eigenem Zustand PS. Nicht in lager.json, denn ältere Geräte
   übernehmen beim Merge nur COLLS und würden neue Sammlungen dort verwerfen.
   events sind allgemein gehalten, die spätere Material-Reservierung nutzt dieselben Events. */
const LS_PDATA='bb-personal-data-v1';
const PCOLLS=['persons','events','assignments'];
function emptyPState(){ return {persons:{},events:{},assignments:{},meta:{v:1}}; }
let PS = Object.assign(emptyPState(), lsGet(LS_PDATA)||{});
PCOLLS.forEach(c=>{ if(!PS[c]) PS[c]={}; });
const store = coll => PCOLLS.includes(coll) ? PS : S;

function put(coll, obj){ obj.updatedAt = now(); store(coll)[coll][obj.id]=obj; return obj; }
function del(coll, id){ const o=store(coll)[coll][id]; if(o){ o.deleted=true; o.updatedAt=now(); } }
const live = coll => Object.values(store(coll)[coll]).filter(o=>!o.deleted);
function persist(){ lsSet(LS_DATA, S); lsSet(LS_PDATA, PS); scheduleSync(); }
function saveCfg(){ lsSet(LS_CFG, CFG); }

function merge(a,b,colls=COLLS,empty=emptyState){
  const out = empty();
  for(const c of colls){
    const A=a[c]||{}, B=b[c]||{};
    for(const id of new Set([...Object.keys(A),...Object.keys(B)])){
      const x=A[id], y=B[id];
      out[c][id] = !x ? y : !y ? x : ((y.updatedAt||0) > (x.updatedAt||0) ? y : x);
    }
  }
  return out;
}
function dropBefore(st, t, colls=COLLS){ for(const c of colls){ for(const id of Object.keys(st[c]||{})){ if((st[c][id].updatedAt||0) <= t) delete st[c][id]; } } }
function stockMap(){
  const m={}; for(const mv of live('movements')) m[mv.articleId]=(m[mv.articleId]||0)+Number(mv.qty||0);
  return m;
}
const fmt = (n,d=2) => (Math.round(n*1000)/1000).toLocaleString('de-DE',{maximumFractionDigits:d});
const eur = n => Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const dDE = s => s? s.split('-').reverse().join('.') : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===================== Dropbox ===================== */
function hdrJson(o){ return JSON.stringify(o).replace(/[\u007f-￿]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4)); }
function b64url(buf){ let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
const DBX = {
  get connected(){ return !!(CFG.appKey && CFG.refresh); },
  async startAuth(){
    // Offenen Versuch weiterverwenden: iOS lädt die App beim Wechsel zu Dropbox oft neu, ein neuer Schlüssel passt dann nicht mehr zum kopierten Code
    if(CFG.verifier && CFG.authUrl && CFG.authUrl.includes('client_id='+encodeURIComponent(CFG.appKey)+'&')) return CFG.authUrl;
    CFG.verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    let method='plain', challenge=CFG.verifier;
    if(crypto.subtle){ try{ challenge=b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(CFG.verifier))); method='S256'; }catch(e){} }
    CFG.authUrl = `https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(CFG.appKey)}&response_type=code&token_access_type=offline&code_challenge=${challenge}&code_challenge_method=${method}`;
    saveCfg(); return CFG.authUrl;
  },
  async finishAuth(code){
    const r = await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({code:code.trim(),grant_type:'authorization_code',code_verifier:CFG.verifier,client_id:CFG.appKey})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){
      const msg = j.error_description||j.error||'';
      if(/verifier/i.test(msg)){ CFG.verifier=''; CFG.authUrl=''; saveCfg();
        throw new Error('Der Code gehört zu einem älteren Verbindungsversuch. Bitte „Verbinden“ tippen, die Freigabe neu öffnen und den neuen Code einfügen.'); }
      if(/code/i.test(msg)) throw new Error('Code abgelaufen oder schon benutzt. Bitte „Dropbox-Freigabe öffnen“ erneut tippen und den neuen Code einfügen.');
      throw new Error(msg||'Anmeldung fehlgeschlagen');
    }
    CFG.refresh=j.refresh_token; CFG.access=j.access_token; CFG.accessExp=now()+j.expires_in*1000; CFG.verifier=''; CFG.authUrl=''; saveCfg();
  },
  async token(){
    if(CFG.access && now()<CFG.accessExp-60000) return CFG.access;
    const r = await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'refresh_token',refresh_token:CFG.refresh,client_id:CFG.appKey})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error('Dropbox-Anmeldung abgelaufen. Bitte in den Einstellungen neu verbinden.');
    CFG.access=j.access_token; CFG.accessExp=now()+j.expires_in*1000; saveCfg(); return CFG.access;
  },
  async api(ep, body){
    const r = await fetch('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{Authorization:'Bearer '+await this.token(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const t = await r.text(); let j={}; try{ j=JSON.parse(t); }catch(e){}
    if(!r.ok){ const e=new Error(j.error_summary||t||('HTTP '+r.status)); e.status=r.status; e.summary=j.error_summary||''; throw e; }
    return j;
  },
  async download(path){
    const r = await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await this.token(),'Dropbox-API-Arg':hdrJson({path})}});
    if(r.status===409){ const t=await r.text(); if(/not_found/.test(t)) return null; throw new Error(t); }
    if(!r.ok) throw new Error('Download fehlgeschlagen ('+r.status+')');
    return await r.blob();
  },
  async upload(path, data, mode='overwrite'){
    const r = await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await this.token(),'Content-Type':'application/octet-stream','Dropbox-API-Arg':hdrJson({path,mode,autorename:mode!=='overwrite',mute:true})},body:data});
    if(!r.ok) throw new Error('Upload fehlgeschlagen ('+r.status+'): '+(await r.text()).slice(0,140));
    return await r.json();
  },
  async list(path){
    try{
      let j = await this.api('files/list_folder',{path}); let e=j.entries;
      while(j.has_more){ j=await this.api('files/list_folder/continue',{cursor:j.cursor}); e=e.concat(j.entries); }
      return e;
    }catch(err){ if(/not_found/.test(err.summary||err.message)) return []; throw err; }
  },
  move(from,to){ return this.api('files/move_v2',{from_path:from,to_path:to,autorename:true}); },
  folder(path){ return this.api('files/create_folder_v2',{path,autorename:false}).catch(()=>{}); }
};
const P = sub => (CFG.base.replace(/\/+$/,'') + '/' + sub).replace(/\/+/g,'/');

let syncState={s:'off',msg:''}, syncing=false, syncAgain=false, syncTimer=null;
function setSync(s,msg=''){ syncState={s,msg}; const el=$('#sync'); el.dataset.s=s;
  el.querySelector('span').textContent = s==='ok' ? 'Synchron' : s==='busy' ? 'Sync …' : s==='err' ? (navigator.onLine===false ? 'Offline' : 'Sync-Fehler') : 'Nicht verbunden';
  el.title = msg || (CFG.lastSync ? 'Zuletzt: '+new Date(CFG.lastSync).toLocaleString('de-DE') : 'Dropbox nicht verbunden'); }
function scheduleSync(){ if(!DBX.connected) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync, 1200); }
async function sync(){
  if(!DBX.connected){ setSync('off'); return; }
  if(syncing){ syncAgain=true; return; }
  syncing=true; setSync('busy');
  try{
    const before = JSON.stringify(S), pBefore = JSON.stringify(PS);
    let blob = await DBX.download(P('lager.json'));
    if(!blob && !CFG.allowNew) blob = await findBase();
    let resetAt = (S.meta&&S.meta.resetAt)||0;
    if(blob){
      const remote = JSON.parse(await blob.text());
      const rr = (remote.meta&&remote.meta.resetAt)||0, lr = resetAt;
      // Neustart: alles, was vor dem Neustart entstanden ist, verwerfen (auf beiden Seiten)
      if(rr>lr) dropBefore(S, rr); else if(lr>rr) dropBefore(remote, lr);
      resetAt = Math.max(rr, lr);
      S = merge(S, remote);
    }
    else if(CFG.lastSync && !CFG.allowNew){
      throw new Error(`lager.json wurde weder in „${CFG.base}“ noch in „${BASE_KNOWN.join('“ / „')}“ gefunden. Wurde der Ordner umbenannt oder verschoben? Bitte unter Einstellungen den Ordner anpassen.`);
    }
    CFG.allowNew=false;
    S.meta = {v:1, savedAt:now(), by:navigator.platform||'', resetAt};
    await DBX.upload(P('lager.json'), JSON.stringify(S));
    lsSet(LS_DATA,S);
    await syncPersonal(); lsSet(LS_PDATA,PS);
    CFG.lastSync=now(); saveCfg(); setSync('ok');
    if(JSON.stringify({...S,meta:0}) !== JSON.stringify({...JSON.parse(before),meta:0})
      || JSON.stringify({...PS,meta:0}) !== JSON.stringify({...JSON.parse(pBefore),meta:0})) softRender();
  }catch(e){ setSync('err', e.message); }
  syncing=false;
  if(syncAgain){ syncAgain=false; sync(); }
}

/* personal.json: gleicher Ablauf wie lager.json (Neustart-Marke, Merge pro Datensatz).
   Hochladen nur bei Änderungen; fehlt die Datei, entsteht sie erst, wenn es etwas zu speichern gibt. */
async function syncPersonal(){
  const blob = await DBX.download(P('personal.json'));
  const remote = blob ? JSON.parse(await blob.text()) : null;
  let resetAt = (PS.meta&&PS.meta.resetAt)||0;
  const rr = remote ? (remote.meta&&remote.meta.resetAt)||0 : 0;
  if(remote){
    if(rr>resetAt) dropBefore(PS, rr, PCOLLS); else if(resetAt>rr) dropBefore(remote, resetAt, PCOLLS);
    resetAt = Math.max(rr, resetAt);
    PS = merge(PS, remote, PCOLLS, emptyPState);
  }
  const changed = !remote ? PCOLLS.some(c=>Object.keys(PS[c]).length)
    : resetAt!==rr || PCOLLS.some(c=>{ const R=remote[c]||{};
        return Object.keys(PS[c]).length!==Object.keys(R).length || Object.values(PS[c]).some(o=>!R[o.id] || R[o.id].updatedAt!==o.updatedAt); });
  PS.meta = {...(remote&&remote.meta||{}), v:1, resetAt};
  if(!changed) return;
  PS.meta = {v:1, savedAt:now(), by:navigator.platform||'', resetAt};
  await DBX.upload(P('personal.json'), JSON.stringify(PS));
}

/* Ordner verschoben (z. B. von „BundB App“ nach „Apps/BundB App“): an den bekannten Orten nach lager.json suchen
   und den Ordner auf diesem Gerät umstellen. Liefert die gefundene lager.json oder null. */
async function findBase(){
  for(const b of BASE_KNOWN){
    if(b.toLowerCase()===CFG.base.toLowerCase()) continue;
    const blob = await DBX.download((b+'/lager.json').replace(/\/+/g,'/'));
    if(blob){
      const old=CFG.base; CFG.base=b; saveCfg(); QUEUE=[]; inboxCache={in:null,out:null,err:''};
      toast(`Ordner gefunden: „${b.replace(/^\//,'')}“ (vorher „${old.replace(/^\//,'')}“). Auf diesem Gerät umgestellt.`);
      return blob;
    }
  }
  return null;
}

/* ===================== Hilfen UI ===================== */
const $ = s => document.querySelector(s);
let toastT;
function toast(msg, action){ const t=$('#toast'); t.textContent=msg;
  if(action){ const b=document.createElement('button'); b.textContent=action.label; b.onclick=()=>{ t.hidden=true; action.fn(); }; t.appendChild(b); }
  t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, action?7000:3200); }
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error(/tesseract/.test(src)?'Die Texterkennung konnte nicht geladen werden (Internetverbindung prüfen).':'Der PDF-Leser konnte nicht geladen werden (Internetverbindung prüfen).')); document.head.appendChild(s); }); }
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_W='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

/* ===================== Beleg einlesen ===================== */
async function pdfLines(page){
  const tc = await page.getTextContent(); const rows=[];
  for(const it of tc.items){ if(!it.str || !it.str.trim()) continue;
    const y=it.transform[5], x=it.transform[4];
    let r = rows.find(r=>Math.abs(r.y-y)<=2.5); if(!r){ r={y,items:[]}; rows.push(r); }
    r.items.push({x,s:it.str.trim()}); }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' '));
}
async function ocr(source, progress){
  progress('Texterkennung wird geladen …');
  await loadScript(TESS);
  const worker = await Tesseract.createWorker('deu', 1, {logger:m=>{ if(m.status==='recognizing text') progress(`Texterkennung ${Math.round(m.progress*100)} %`); }});
  const { data } = await worker.recognize(source);
  await worker.terminate();
  return data.text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
}
async function readDocument(file, progress){
  const name = file.name||'beleg'; const lower=name.toLowerCase();
  const res = {source:'', raw:[], number:'', date:'', party:'', items:[]};
  const xmlFrom = txt => {
    const tryParse = t => { const d=new DOMParser().parseFromString(t,'application/xml'); return d.getElementsByTagName('parsererror').length ? null : d; };
    const d = tryParse(txt) || tryParse(txt.replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[0-9a-f]+);)/gi,'&amp;'));
    return d ? parseXmlDoc(d) : null; };
  if(lower.endsWith('.xml') || file.type.includes('xml')){
    const txt = await file.text(); const r = xmlFrom(txt);
    if(!r) throw new Error('Die XML-Datei ist keine XRechnung/ZUGFeRD-Rechnung.');
    return {...res, ...r, source:'E-Rechnung (XML)', raw:[txt.slice(0,4000)]};
  }
  if(lower.endsWith('.csv') || file.type==='text/csv'){
    const txt = await file.text(); const r = parseCsv(txt);
    if(!r) throw new Error('CSV erkannt, aber keine Spalten „Bezeichnung“ und „Menge“ gefunden.');
    return {...res, ...r, source:'CSV', raw:txt.split(/\r?\n/).slice(0,40)};
  }
  if(lower.endsWith('.pdf') || file.type==='application/pdf'){
    progress('PDF wird gelesen …');
    await loadScript(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_W;
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    // 1) eingebettete E-Rechnung (ZUGFeRD / Factur-X)
    try{
      const att = await pdf.getAttachments();
      if(att){ for(const k of Object.keys(att)){ const a=att[k]; if(/\.xml$/i.test(a.filename||k)){
        const r = xmlFrom(new TextDecoder('utf-8').decode(a.content));
        if(r && r.items.length) return {...res, ...r, source:'ZUGFeRD (im PDF eingebettet)', raw:[`Eingebettete Datei: ${a.filename}`]}; } } }
    }catch(e){}
    // 2) Textebene
    let lines=[];
    for(let p=1;p<=pdf.numPages;p++){ lines = lines.concat(await pdfLines(await pdf.getPage(p))); }
    if(lines.join('').replace(/\s/g,'').length > 40){
      return {...res, ...parseTextDoc(lines, CFG.ownName), source:'PDF-Text', raw:lines};
    }
    // 3) Scan -> OCR
    lines=[];
    for(let p=1;p<=Math.min(pdf.numPages,4);p++){
      const page=await pdf.getPage(p); const vp=page.getViewport({scale:2.2});
      const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      lines = lines.concat(await ocr(cv, progress));
    }
    return {...res, ...parseTextDoc(lines, CFG.ownName), source:'PDF-Scan (Texterkennung)', raw:lines};
  }
  if(file.type.startsWith('image/') || /\.(jpe?g|png|heic|webp)$/.test(lower)){
    const lines = await ocr(file, progress);
    return {...res, ...parseTextDoc(lines, CFG.ownName), source:'Foto (Texterkennung)', raw:lines};
  }
  throw new Error('Dateityp wird nicht unterstützt. Möglich: PDF, Foto, XML, CSV.');
}

/* Regeln: gelernte Zuordnung Rechnungstext -> Artikel + Faktor */
function ruleKeys(line, party){ const k=[]; if(line.art) k.push('a:'+normText(party)+'|'+normText(line.art)); k.push('t:'+normText(line.desc)); return k; }
function suggest(line, party){
  for(const k of ruleKeys(line,party)){ const r=S.rules[k]; if(r && !r.deleted && S.articles[r.articleId] && !S.articles[r.articleId].deleted) return {articleId:r.articleId, factor:r.factor, how:'Regel'}; }
  const f = guessFactor(line.desc);
  let best=null, bs=0;
  for(const a of live('articles')){ const s=similarity(line.desc,a.name); if(s>bs){bs=s;best=a;} }
  if(best && bs>=0.8) return {articleId:best.id, factor: (line.unit && /fl|stk|glas/i.test(line.unit)) ? 1 : f, how:'ähnlich'};
  return {articleId:'', factor:f, how:''};
}

let IMP = null;   // aktueller Beleg in Prüfung
let busyMsg = '';
let dir = 'in';
let inboxCache = {in:null,out:null,err:''};
/* Warteschlange: automatisch eingelesene Belege aus Eingang/_Neu und Ausgang/_Neu */
let QUEUE = [];          // {path,name,dir,status:'wait'|'reading'|'ready'|'manual',msg,imp}
let queueRunning = false;

function blankLine(){ return {art:'',desc:'',qty:0,unit:'',price:0,total:0,on:true,articleId:'',factor:1,how:''}; }

async function buildImp(file, direction, dbxPath, progress){
  try{
    const r = await readDocument(file, progress||(()=>{}));
    const party = r.party || '';
    const items = r.items.map(it=>{ const s=suggest(it, party); return {...it, on:true, articleId:s.articleId||'new', factor:s.factor, how:it.calc ? (s.how?s.how+' · ':'')+'Menge berechnet' : s.how}; });
    const imp = {dir:direction, fileName:file.name, file, dbxPath, source:r.source, raw:r.raw, number:r.number||'', date:r.date||today(), party, items, manual:false, reason:''};
    if(!items.length){ imp.manual=true; imp.reason='Es wurden keine Positionen erkannt.'; imp.items=[blankLine(),blankLine(),blankLine()]; }
    return imp;
  }catch(e){
    return {dir:direction, fileName:file.name, file, dbxPath, source:'nicht lesbar', raw:[], number:'', date:today(), party:'', manual:true, reason:e.message,
      items:[blankLine(),blankLine(),blankLine()]};
  }
}
async function importFile(file, direction, dbxPath){
  busyMsg='Wird gelesen …'; render();
  IMP = await buildImp(file, direction, dbxPath, m=>{ busyMsg=m; const el=$('#busy'); if(el) el.textContent=m; });
  busyMsg=''; render();
}

function duplicateDoc(imp=IMP){
  if(!imp || !imp.number) return null;
  return live('docs').find(d=>normText(d.number)===normText(imp.number) && normText(d.party)===normText(imp.party) && d.dir===imp.dir);
}

async function archiveFile(imp){
  if(!DBX.connected) return '';
  const folder = (imp.dir==='in'?'Eingang':'Ausgang') + '/' + (imp.date||today()).slice(0,4);
  if(imp.dbxPath){ const r = await DBX.move(imp.dbxPath, P(folder+'/'+imp.fileName)); return r.metadata.path_display; }
  const r = await DBX.upload(P(folder+'/'+imp.fileName), imp.file, 'add'); return r.path_display;
}

async function bookImport(imp=IMP, silent=false){
  const chosen = imp.items.filter(l=>l.on && l.articleId!=='skip' && (Number(l.qty)||0)!==0);
  if(chosen.some(l=>!l.articleId)){ toast('Bitte jeder Position einen Lagerartikel zuordnen oder sie abwählen.'); return false; }
  if(chosen.some(l=>l.articleId==='new' && !l.desc.trim())){ toast('Für einen neuen Artikel fehlt die Bezeichnung.'); return false; }
  const lines = chosen;
  if(!lines.length){ toast('Keine Position zum Buchen ausgewählt.'); return false; }
  const doc = put('docs',{id:uid(), dir:imp.dir, party:imp.party, number:imp.number, date:imp.date, source:imp.manual?'manuell zugeordnet':imp.source, file:'', lines:lines.length});
  const sign = imp.dir==='in' ? 1 : -1;
  for(const l of lines){
    let aid = l.articleId;
    const f = Number(l.factor)||1;
    if(aid==='new'){
      const nm = cleanName(l.desc) || l.desc;
      const existing = live('articles').find(a=>normText(a.name)===normText(nm));
      if(existing) aid = existing.id;
      else aid = put('articles',{id:uid(), name:nm, unit: f!==1 ? 'Fl' : (l.unit||'Stk'), category:'', min:0, lastPrice:0}).id;
    }
    const qty = Number(l.qty)*f*sign;
    put('movements',{id:uid(), articleId:aid, qty, type:imp.dir, date:imp.date, docId:doc.id, note:l.desc||S.articles[aid].name, price:Number(l.price)||0});
    if(imp.dir==='in' && l.price){ const a=S.articles[aid]; a.lastPrice = Number(l.price)/f; put('articles',a); }
    if(l.desc.trim()) for(const k of ruleKeys(l, imp.party)) put('rules',{id:k, articleId:aid, factor:f, sample:l.desc, party:imp.party});
  }
  persist();
  try{ doc.file = await archiveFile(imp); if(doc.file){ put('docs',doc); persist(); } }
  catch(e){ toast('Gebucht. Ablage in Dropbox fehlgeschlagen: '+e.message); }
  if(!silent) toast(`${lines.length} Positionen gebucht`);
  finishQueueItem(imp);
  return true;
}

function finishQueueItem(imp){
  if(imp.dbxPath) QUEUE = QUEUE.filter(q=>q.path!==imp.dbxPath);
  if(imp===IMP){ IMP=null; openNextReady(); }
  render();
}
function openNextReady(){
  const next = QUEUE.find(q=>q.status==='ready'||q.status==='manual');
  // Auf der Startseite und im Personal-Bereich nicht ungefragt in die Belege springen
  if(next && areaOf(view)==='lager'){ IMP = next.imp; view='belege'; }
}

/* Beim Start und bei Rückkehr zur App: _Neu-Ordner prüfen und alles einlesen */
async function scanInbox(openFirst){
  if(!DBX.connected) return;
  await loadInbox();
  const files = [...(inboxCache.in||[]).map(f=>({f,dir:'in'})), ...(inboxCache.out||[]).map(f=>({f,dir:'out'}))];
  const paths = new Set(files.map(x=>x.f.path_lower));
  QUEUE = QUEUE.filter(q=>paths.has(q.path) || (IMP && IMP.dbxPath===q.path));
  let added=0;
  for(const {f,dir:d} of files){ if(!QUEUE.some(q=>q.path===f.path_lower)){ QUEUE.push({path:f.path_lower, name:f.name, dir:d, status:'wait', msg:'', imp:null}); added++; } }
  if(added){ render(); }
  await runQueue(openFirst);
}
async function runQueue(openFirst){
  if(queueRunning) return; queueRunning=true;
  let booked=0;
  for(const q of QUEUE){
    if(q.status!=='wait') continue;
    q.status='reading'; q.msg='wird gelesen …'; renderQueueOnly();
    try{
      const blob = await DBX.download(q.path);
      if(!blob) throw new Error('Datei nicht mehr vorhanden.');
      const ext = q.name.split('.').pop().toLowerCase();
      const type = {pdf:'application/pdf',xml:'application/xml',csv:'text/csv',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic'}[ext]||blob.type;
      q.imp = await buildImp(new File([blob], q.name, {type}), q.dir, q.path, m=>{ q.msg=m; renderQueueOnly(); });
    }catch(e){
      q.imp = {dir:q.dir, fileName:q.name, file:null, dbxPath:q.path, source:'nicht lesbar', raw:[], number:'', date:today(), party:'', manual:true, reason:e.message, items:[blankLine(),blankLine(),blankLine()]};
    }
    q.status = q.imp.manual ? 'manual' : 'ready';
    q.msg = q.imp.manual ? 'manuell zuordnen' : `${q.imp.items.length} Positionen erkannt`;
    // Automatisch buchen, wenn alles über gelernte Regeln bekannt ist
    if(CFG.autoBook && !q.imp.manual && q.imp.items.length && q.imp.items.every(l=>/Regel/.test(l.how)) && !duplicateDoc(q.imp)){
      const ok = await bookImport(q.imp, true); if(ok){ booked++; continue; }
    }
    renderQueueOnly();
  }
  queueRunning=false;
  if(booked) toast(`${booked} Beleg${booked>1?'e':''} automatisch gebucht`);
  const open = QUEUE.filter(q=>q.status==='ready'||q.status==='manual').length;
  if(openFirst && open && !IMP && !busyMsg && !isTyping()){ openNextReady(); }
  render();
}
function isTyping(){ const a=document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName); }
function renderQueueOnly(){
  const n = QUEUE.filter(q=>q.status!=='wait'&&q.status!=='reading').length;
  const b = document.querySelector('#tabs [data-go="belege"]');
  if(b) b.dataset.badge = QUEUE.length ? String(QUEUE.length) : '';
  if(view==='belege' && !IMP && !busyMsg && !isTyping()) $('#view').innerHTML = vBelege();
}

async function loadInbox(){
  if(!DBX.connected) return;
  try{
    const [a,b] = await Promise.all([DBX.list(P('Eingang/_Neu')), DBX.list(P('Ausgang/_Neu'))]);
    const ok = e => e['.tag']==='file' && /\.(pdf|xml|csv|jpe?g|png|heic|webp)$/i.test(e.name);
    inboxCache = {in:a.filter(ok), out:b.filter(ok), err:''};
  }catch(e){ inboxCache = {in:[],out:[],err:e.message}; }
}


/* ===================== Schnellbuchung ===================== */
const QB_REASONS = { '-1':['Bruch','Schwund','Eigenverbrauch','Event-Entnahme','Sonstiges'], '1':['Rückgabe','Nachlieferung','Korrektur','Sonstiges'] };
let QB = null;

/* ===================== Bestand aus Excel / CSV ===================== */
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let XL = null;   // {rows:[{name,cat,unit,qty,min,price,match}], file, date}
async function readTable(file){
  const lower=file.name.toLowerCase();
  if(/\.(xlsx|xlsm|xls|ods)$/.test(lower)){
    await loadScript(XLSX_URL);
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''}).map(r=>r.map(c=>String(c??'').trim()));
  }
  const text=(await file.text()).replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]; const delim=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{ const out=[]; let cell='',q=false; for(let i=0;i<l.length;i++){ const c=l[i];
    if(q){ if(c==='"'){ if(l[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; } else if(c==='"') q=true; else if(c===delim){ out.push(cell.trim()); cell=''; } else cell+=c; }
    out.push(cell.trim()); return out; });
}
function parseStockTable(rows){
  let hi=-1, H=[];
  for(let i=0;i<Math.min(rows.length,15);i++){ const h=rows[i].map(normText); if(h.some(x=>/artikel|bezeichnung|^name|produkt/.test(x)) && h.some(x=>/bestand|menge|anzahl|stück|stueck|^ist/.test(x))){ hi=i; H=h; break; } }
  if(hi<0) return null;
  const find=(rx,not)=>H.findIndex(h=>rx.test(h) && !(not&&not.test(h)));
  const c={ min:find(/mindest|^min/), name:find(/artikel|bezeichnung|^name|produkt/,/nr|nummer/), cat:find(/kategorie|gruppe|warengruppe/),
    unit:find(/einheit|^me$/), price:find(/ek|einkauf|preis/) };
  c.qty = H.findIndex((h,i)=>/bestand|menge|anzahl|stück|stueck|^ist/.test(h) && i!==c.min);
  const out=[];
  for(const r of rows.slice(hi+1)){
    const name=(r[c.name]||'').trim(); if(!name) continue;
    const qty=parseNum(r[c.qty]);
    out.push({name, cat:c.cat>=0?r[c.cat]:'', unit:c.unit>=0?r[c.unit]:'', qty:isNaN(qty)?null:qty,
      min:c.min>=0?parseNum(r[c.min]):NaN, price:c.price>=0?parseNum(r[c.price]):NaN});
  }
  return out;
}
async function loadXl(file){
  try{
    const rows=await readTable(file); const items=parseStockTable(rows);
    if(!items||!items.length){ toast('Keine Spalten „Artikel“ und „Bestand“ gefunden. Vorlage verwenden.'); return; }
    items.forEach(it=>{ const a=live('articles').find(x=>normText(x.name)===normText(it.name)); it.match=a?a.id:''; it.on = it.qty!==null; });
    XL={rows:items, file:file.name}; render();
  }catch(e){ toast(e.message); }
}
function bookXl(){
  const date=$('#xlDate')?.value||today(); const st=stockMap(); let nNew=0,nMv=0;
  for(const it of XL.rows){ if(!it.on) continue;
    let a = it.match ? S.articles[it.match] : live('articles').find(x=>normText(x.name)===normText(it.name));
    if(!a){ a=put('articles',{id:uid(), name:it.name, unit:it.unit||'Stk', category:it.cat||'', min:isNaN(it.min)?0:it.min, lastPrice:isNaN(it.price)?0:it.price}); nNew++; }
    else { if(it.unit) a.unit=it.unit; if(it.cat) a.category=it.cat; if(!isNaN(it.min)) a.min=it.min; if(!isNaN(it.price)) a.lastPrice=it.price; put('articles',a); }
    const diff = Math.round(((it.qty||0)-(st[a.id]||0))*1000)/1000;
    if(diff!==0){ put('movements',{id:uid(), articleId:a.id, qty:diff, type:'inv', date, note:'Anfangsbestand (Import)'}); nMv++; }
  }
  persist(); XL=null; view='bestand'; render(); toast(`Bestand übernommen: ${nNew} neue Artikel, ${nMv} Buchungen`);
}

  const st=stockMap(); const on=XL.rows.filter(r=>r.on).length;

  const sum = IMP.items.filter(l=>l.on).reduce((s,l)=>s+(Number(l.total)||0),0);
  return `<div class="stack">
    <div class="row spread"><div><div class="eyebrow">${esc(IMP.source)} · ${esc(IMP.fileName)}</div><h1>Beleg prüfen</h1></div>

    ${dup?`<div class="note">Dieser Beleg (${esc(dup.number)}) wurde am ${dDE(dup.date)} schon gebucht. Doppelt buchen verfälscht den Bestand.</div>`:''}
    <div class="panel grid">
      <label class="f">${IMP.dir==='in'?'Lieferant':'Kunde / Veranstaltung'}<input data-h="party" value="${esc(IMP.party)}"></label>
      <label class="f">Belegnummer<input data-h="number" value="${esc(IMP.number)}"></label>
      <label class="f">Datum<input type="date" data-h="date" value="${esc(IMP.date)}"></label>
    </div>
    <div class="${IMP.manual?'split':''}">
    ${IMP.manual?previewHtml():''}
    <div class="panel">
      <div class="row spread"><h2>${IMP.items.length} Positionen</h2><span class="muted small">Summe ausgewählt: <b class="num">${eur(sum)}</b> netto</span></div>
      ${lines || '<div class="empty">Keine Positionen erkannt.</div>'}
      <div class="row" style="padding-top:10px"><button class="btn sm" data-act="addLine">+ Zeile ergänzen</button></div>
    </div>
    </div>
    <p class="small muted" style="margin:0">Die Zuordnung wird gespeichert. Beim nächsten Beleg mit gleichem Text oder gleicher Artikelnummer schlägt die App denselben Lagerartikel und Faktor vor.</p>
    <div class="row"><button class="btn primary" data-act="book">${IMP.dir==='in'?'Wareneingang buchen':'Warenausgang buchen'}</button>
      ${IMP.dbxPath?`<button class="btn" data-act="laterImp">Später</button>
      <button class="btn danger" data-act="archiveImp" data-confirm="Ohne Buchung ablegen?">Ohne Buchung ablegen</button>`:`<button class="btn" data-act="cancelImp">Verwerfen</button>`}</div>
    ${IMP.manual?'':previewHtml()}
    ${IMP.raw&&IMP.raw.length?`<details><summary class="small muted">Erkannter Rohtext</summary><pre class="raw">${esc(IMP.raw.join('\n'))}</pre></details>`:''}
  </div>`;
}

/* Anleitung zum Einrichten auf iPhone und Mac (unter Einstellungen) */
function vAnleitung(){
  const ext = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
  const step = (n, title, body) => `<div class="panel guide-step"><div class="guide-num">${n}</div><div class="stack" style="gap:8px"><h3>${title}</h3>${body}</div></div>`;
  const folder = esc(CFG.base.replace(/^\//,'').replace(/\//g,' › '));
  return `<div class="stack">
    <div><a href="#" data-go="setup" class="back"><span aria-hidden="true">‹</span> Einstellungen</a></div>
    <div><div class="eyebrow">Anleitung</div><h1>App auf iPhone und Mac einrichten</h1>
      <p class="muted" style="margin:6px 0 0">Einmalig ca. 5 Minuten pro Gerät. Danach startet B&amp;B wie eine normale App vom Home-Bildschirm.</p></div>
    <div class="panel stack" style="gap:8px"><h3>Das brauchst du</h3>
      <ul class="steps">
        <li>Ein iPhone mit aktuellem iOS (ab 16.4) und <b>Safari</b> oder <b>Chrome</b>. Bei älterem iOS geht es nur mit Safari.</li>
        <li>Ein <b>Dropbox-Konto</b>, in dem der Ordner <b>${folder}</b> liegt (eigener Ordner oder mit dir geteilt).</li>
        <li>Optional die ${ext('https://apps.apple.com/app/dropbox/id327630330','Dropbox-App aus dem App Store')}, damit die Anmeldung schneller geht.</li>
      </ul></div>
    ${step(1,'B&amp;B im Browser öffnen',`
      <p style="margin:0">Auf dem iPhone in <b>Safari</b> oder <b>Chrome</b> diese Adresse öffnen:</p>
      <div class="row" style="gap:8px"><code id="guideurl">${esc(APP_URL)}</code><button class="btn sm" data-act="copyText" data-target="guideurl">Kopieren</button>
        ${navigator.share?'<button class="btn sm" data-act="shareUrl">Link senden …</button>':''}</div>
      <p class="small muted" style="margin:0">Tipp: Am Mac mit „Link senden …“ per AirDrop oder Nachricht direkt aufs iPhone schicken.</p>`)}
    ${step(2,'Zum Home-Bildschirm hinzufügen',`
      <ol class="steps">
        <li><b>Safari:</b> unten auf das <b>Teilen-Symbol</b> tippen (Quadrat mit Pfeil nach oben). Bei manchen iOS-Versionen erst auf <b>•••</b> tippen.<br>
          <b>Chrome:</b> rechts in der Adressleiste auf das <b>Teilen-Symbol</b> tippen.</li>
        <li>Nach unten scrollen und <b>Zum Home-Bildschirm</b> wählen.</li>
        <li>Prüfen, dass <b>Als Web-App öffnen</b> eingeschaltet ist (falls angezeigt), dann <b>Hinzufügen</b> tippen.</li>
      </ol>
      <p class="small muted" style="margin:0">Auf dem Home-Bildschirm erscheint jetzt das Symbol „B&amp;B Lager“.</p>`)}
    ${step(3,'App vom Home-Bildschirm starten',`
      <p style="margin:0">Ab jetzt die App <b>immer über das Symbol</b> öffnen, nicht über den Browser-Tab. Die installierte App hat ihren eigenen Speicher und ihre eigene Dropbox-Verbindung.</p>
      <p class="small muted" style="margin:0">Am besten pro Gerät bei <b>einer</b> Variante bleiben. Jede Installation (Safari, Chrome, Browser-Tab) muss sich sonst einzeln mit Dropbox verbinden.</p>`)}
    ${step(4,'Mit Dropbox verbinden',`
      <ol class="steps">
        <li>In der App <b>Lager</b> öffnen, unten auf <b>Einstellungen</b> tippen.</li>
        <li><b>Verbinden</b> tippen, dann <b>Dropbox-Freigabe öffnen</b>. Es öffnet sich die Dropbox-Anmeldung.</li>
        <li>Bei Dropbox anmelden. Bei der Warnung „Bevor Sie diese App verknüpfen …“ auf <b>Weiter</b> tippen.</li>
        <li>Auf <b>Zulassen</b> tippen. Dropbox zeigt einen <b>Zugriffscode</b>. Den Code kopieren (lange drücken → Kopieren).</li>
        <li>Das Dropbox-Fenster schließen (<b>Fertig</b> oben links) bzw. zurück zur B&amp;B-App wechseln.</li>
        <li>Den Code in das Feld <b>Code aus Dropbox einfügen</b> einsetzen und <b>Code bestätigen</b> tippen.</li>
      </ol>
      <p class="small muted" style="margin:0">Der Code gilt nur wenige Minuten und nur einmal. Bei einer Fehlermeldung einfach nochmal bei „Verbinden“ beginnen.</p>`)}
    ${step(5,'Fertig, kurz prüfen',`
      <p style="margin:0">Oben rechts steht jetzt <span class="pill ok">Synchron</span>. Bestand und Buchungen der anderen Geräte erscheinen nach wenigen Sekunden.</p>
      <p class="small muted" style="margin:0">Die Daten liegen als <code>lager.json</code> im Ordner <b>Dropbox › ${folder}</b>. Neue Rechnungen kommen nach <b>Eingang › _Neu</b> bzw. <b>Ausgang › _Neu</b>.</p>`)}
    <div class="panel stack" style="gap:8px"><h3>Gut zu wissen</h3>
      <ul class="steps">
        <li><b>Offline:</b> Buchungen gehen auch ohne Netz. Oben steht dann „Offline“. Sobald wieder Netz da ist, wird automatisch synchronisiert.</li>
        <li><b>Updates:</b> Neue Versionen kommen beim nächsten Öffnen mit Netz. Wirkt etwas veraltet, die App ganz schließen (vom unteren Rand hochwischen, App nach oben wegwischen) und neu öffnen.</li>
        <li><b>Ordner verschoben:</b> Liegt der Ordner als <code>Apps/BundB App</code> oder direkt als <code>BundB App</code> in der Dropbox, stellt sich die App selbst um. Bei einem anderen Ort unter Einstellungen den Ordner eintragen und „Ordner übernehmen“ tippen.</li>
        <li><b>Sync-Fehler:</b> Auf die Statusanzeige oben rechts tippen. Hilft das nicht, unter Einstellungen <b>Trennen</b> und Schritt 4–5 wiederholen.</li>
        <li><b>Mitarbeiter:</b> Alle, mit denen der Ordner geteilt ist, arbeiten auf denselben Daten. Jede Person verbindet die App mit ihrem eigenen Dropbox-Konto.</li>
        <li><b>Zugriff entziehen:</b> Jederzeit unter ${ext('https://www.dropbox.com/account/connected_apps','Dropbox › Verknüpfte Apps')} möglich.</li>
      </ul></div>
    <div class="panel stack" style="gap:8px"><h3>Und am Mac?</h3>
      <p style="margin:0">${ext(APP_URL,'Die App-Adresse')} in Safari oder Chrome öffnen, als eigene App installieren und dann Schritt 4–5 genauso machen.</p>
      <ul class="steps">
        <li><b>Safari:</b> Menü <b>Ablage › Zum Dock hinzufügen</b>.</li>
        <li><b>Chrome:</b> rechts in der Adressleiste auf das <b>Installieren-Symbol</b> klicken (Bildschirm mit Pfeil) oder Menü <b>⋮ › Streamen, speichern und teilen › Seite als App installieren …</b> Die App liegt danach unter Programme › Chrome-Apps; ins Dock per Rechtsklick › Optionen › Im Dock behalten.</li>
      </ul>
      <p class="small muted" style="margin:0">Die Datei <code>index.html</code> im Dropbox-Ordner ist nur eine Sicherungskopie. Öffnet man sie, leitet sie auf die Online-Version weiter.</p></div>
  </div>`;
}
