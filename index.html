<script>
// Direkt aus dem Dropbox-Ordner geöffnet (file://): dort hätte die App einen eigenen, getrennten Speicher
// und keinen Offline-Betrieb, also zur Online-Version weiterleiten. Ohne Netz übernimmt deren Offline-Speicher.
if (location.protocol === 'file:') location.replace('https://bundb-app.github.io/App/' + location.hash);
// Darstellung (Hell/Dunkel) pro Gerät vor dem ersten Zeichnen setzen, damit nichts aufblitzt
try { const t = JSON.parse(localStorage.getItem('bb-lager-cfg-v1') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Lagerliste wie ein Regaletikett – kräftige Kondensschrift für Bestände, ruhige Flächen, Akzent Flaschengrün */
:root{
  --bg:#edf0f1; --surface:#ffffff; --sunk:#e4e9eb; --ink:#152029; --muted:#5a6873; --line:#d3dadf;
  --accent:#17684f; --accent-ink:#ffffff; --accent-soft:#dcece5;
  --warn:#9a5a12; --warn-soft:#f6e8d3; --bad:#b0281f; --bad-soft:#f7dedb; --good:#17684f; --info:#1d5fbf; --info-soft:#dde8f8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172027; --sunk:#121a20; --ink:#e4eaee; --muted:#93a2ad; --line:#2a3741;
  --accent:#4cc39a; --accent-ink:#04261a; --accent-soft:#18352b;
  --warn:#e3a457; --warn-soft:#3a2b17; --bad:#f07a70; --bad-soft:#3b1d1b; --good:#4cc39a; --info:#78acff; --info-soft:#1b2a44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172027; --sunk:#121a20; --ink:#e4eaee; --muted:#93a2ad; --line:#2a3741;
  --accent:#4cc39a; --accent-ink:#04261a; --accent-soft:#18352b;
  --warn:#e3a457; --warn-soft:#3a2b17; --bad:#f07a70; --bad-soft:#3b1d1b; --good:#4cc39a; --info:#78acff; --info-soft:#1b2a44; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font:700 26px/1 var(--f-display);letter-spacing:.01em;white-space:nowrap}
.brand small{font:500 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer}
nav.tabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);display:inline-block;margin-left:5px;min-width:18px;padding:2px 5px;border-radius:9px;background:var(--warn);color:var(--surface);font:600 11px/1.2 var(--f-body);text-align:center}
select.need{border-color:var(--warn)}
.split{display:grid;gap:14px}
@media (min-width:1000px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.split>details{position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}.split>details iframe{height:75vh!important}}
.split .line .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.split .line .map{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split .line .map .res{grid-column:1/-1;padding:0}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 11px;font:500 12px var(--f-body);cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--good)} .sync[data-s="busy"] i{background:var(--warn);animation:pulse 1s infinite}
.sync[data-s="err"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync[data-s="busy"] i{animation:none}}
main{padding-block:20px 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.05} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 13px;font:500 14px var(--f-body);cursor:pointer;text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:38px;min-width:0;width:100%}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stats{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:700 30px/1.1 var(--f-display)}
.pill{display:inline-block;font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ok{background:var(--accent-soft);color:var(--good)}
/* Bestandsliste */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{border-top:1px solid var(--line)} .item:first-child{border-top:0}
.item>button.head{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.item>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .qty{font:700 26px/1 var(--f-display);text-align:right;min-width:3ch}
.item .qty small{font:500 12px var(--f-body);color:var(--muted);margin-left:4px}
.item.low{box-shadow:inset 4px 0 0 var(--warn)} .item.neg{box-shadow:inset 4px 0 0 var(--bad)}
.detail{padding:4px 14px 16px;display:grid;gap:14px;background:var(--sunk);border-top:1px dashed var(--line)}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.grp>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'';flex:0 0 auto;width:7px;height:7px;margin:0 4px 0 2px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(45deg)}
.inv-d:empty{display:none} .inv-d{margin-top:3px}
.item-card{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.item-card:focus-visible{outline:2px solid var(--accent)}
.ek-lines{display:grid}
.ek-line{display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(70px,auto) auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ek-line:first-child{border-top:0}
.ek-line .ek-desc{grid-column:1/-1;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ek-line.need{box-shadow:inset 3px 0 0 var(--warn);padding-left:10px}
.ek-buy{display:grid}
.t-short{display:none}
.save-bar .btn{white-space:nowrap}
.stats.one{grid-template-columns:minmax(0,220px)}
.pill.k-ware{background:var(--accent-soft);color:var(--good)} .pill.k-leistung{background:var(--info-soft);color:var(--info)}
.item .pills{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
/* Bestandszeile in festen Spalten: Name | Typ | Menge (rechtsbündig) | Einheit (linksbündig) */
.item.art>button.head{grid-template-columns:minmax(0,1fr) 92px 72px 78px;gap:10px}
.item.art .unit{font:500 13px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){ .item.art>button.head{grid-template-columns:minmax(0,1fr) 70px 46px 58px;gap:6px;padding:10px 10px 10px 12px} .item.art .qty{font-size:22px} .item.art .pill{font-size:10px;padding:3px 5px} }
.rv-row{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(70px,auto) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rv-row:first-child{border-top:0}
.rv-row.bad{box-shadow:inset 4px 0 0 var(--bad);padding-left:10px}
.rv-alert{grid-column:1/-1;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:8px 10px;font-weight:600}
.rv-alert.big{font-size:16px;padding:12px 14px}
.rv-warn{grid-column:1/-1;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px}
.item-card.bad{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
@media (max-width:560px){ .rv-row{grid-template-columns:84px minmax(0,1fr) auto} .rv-row .ek-bname{grid-column:1/-1} }
.pk-row{display:grid;grid-template-columns:auto minmax(0,1fr) 84px minmax(60px,auto) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pk-row:first-child{border-top:0}
.pk-row input[type=checkbox]{width:24px;height:24px}
.pk-row.on .ek-bname{text-decoration:line-through;color:var(--muted)}
.pk-row .ek-bqty{text-align:right;font-weight:700}
.pg-row{display:grid;grid-template-columns:minmax(0,1fr) 80px auto auto;gap:6px 8px;align-items:center}
.ok-note{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:560px){ .pk-row{grid-template-columns:auto 84px minmax(0,1fr) auto} .pk-row .ek-bname{grid-column:2/-1;grid-row:1} .pk-row input[type=checkbox]{grid-row:1/3;align-self:start;margin-top:2px}
  .pg-row{grid-template-columns:minmax(0,1fr) 70px auto} .pg-row > span:first-child,.pg-row > input[list]{grid-column:1/-1} .pg-row .small{display:none} }
.ek-sec{margin:8px 0 0;font:700 20px/1.1 var(--f-display);letter-spacing:.02em}
hr.ek-sep{border:0;border-top:3px solid var(--ink);opacity:.55;margin:14px 0 2px}
.ek-brow{display:grid;grid-template-columns:minmax(0,1fr) auto 84px minmax(60px,auto) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ek-brow:first-child{border-top:0}
.ek-brow .ek-bname{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.ek-brow .ek-bqty{text-align:right;font-weight:700}
@media (max-width:560px){ .ek-brow{grid-template-columns:96px minmax(0,1fr) auto} .ek-brow .ek-bname,.ek-brow .ek-bneed{grid-column:1/-1} .ek-brow .ek-bneed:empty{display:none} }
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){ .ek-line{grid-template-columns:minmax(0,1fr) 80px auto} .ek-line .ek-art{grid-column:1/-1} .ek-line .ek-unit{grid-column:auto} }
details.grp>summary .grp-h{flex:1;font:700 18px/1.1 var(--f-display);letter-spacing:.02em}
details.grp[open]>summary{border-bottom:1px solid var(--line)}
details.grp .list{border:0;border-radius:0}
details.grp .tbl{padding:0 10px 6px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
textarea{font:inherit;width:100%;box-sizing:border-box;resize:vertical}
.mv{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.mv:first-child{border-top:0}
.plus{color:var(--good)} .minus{color:var(--bad)}
/* Beleg-Prüfung */
.line{display:grid;gap:8px 10px;grid-template-columns:28px minmax(0,1fr);padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line.off{opacity:.45}
.line .fields{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}
.line .map{display:grid;gap:8px;grid-template-columns:minmax(0,2.2fr) minmax(0,.8fr) minmax(0,1fr);align-items:end}
.res{font:700 20px/1 var(--f-display);padding-bottom:9px}
.inbox{display:grid;gap:0}
.inbox .file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.inbox .file:first-child{border-top:0}
.tag{font:600 10px/1 var(--f-mono);padding:4px 5px;border-radius:4px;background:var(--sunk);color:var(--muted);text-transform:uppercase}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:6px;font-size:14px}
/* Personal */
.item.amp-red{box-shadow:inset 4px 0 0 var(--bad)} .item.amp-yellow{box-shadow:inset 4px 0 0 var(--warn)} .item.amp-green{box-shadow:inset 4px 0 0 var(--good)}
.need-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.stat.need.bad b{color:var(--bad)} .stat.need.warn b{color:var(--warn)} .stat.need.ok b{color:var(--good)} .stat.need.over b{color:var(--info)}
.asg-head{padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.asg{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.asg-head+.asg{border-top:0}
.asg.off>.row:first-child b{text-decoration:line-through;color:var(--muted)}
.st-sel{width:auto;flex:none;min-height:0;padding:4px 22px 4px 10px;border:0;border-radius:99px;font:600 12px/1.4 var(--f-body);cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.st-angefragt{background-color:var(--warn-soft);color:var(--warn)} .st-bestaetigt{background-color:var(--accent-soft);color:var(--good)} .st-abgesagt{background-color:var(--bad-soft);color:var(--bad)}
.pcat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.daychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.daychips button{flex:none;display:grid;grid-template-columns:auto auto;align-items:center;column-gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:600 14px var(--f-body);cursor:pointer}
.daychips button small{grid-column:2;font-weight:400;font-size:12px;color:var(--muted)}
.daychips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.dot.amp-red{background:var(--bad)} .dot.amp-yellow{background:var(--warn)} .dot.amp-green{background:var(--good)}
.pday{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;margin:0;display:grid;gap:10px;min-width:0}
.pday legend{font:600 13px var(--f-body);padding:0 6px}
.prole{display:grid;grid-template-columns:minmax(52px,1fr) 42px 74px 74px 22px;gap:5px;align-items:center}
.prole input{padding:6px 4px;font-size:14px;text-align:center}
.prole input::-webkit-calendar-picker-indicator{display:none}
.pday{padding:10px 8px 12px}
.prole-n{font-size:13px;font-weight:500;overflow-wrap:break-word;hyphens:auto;min-width:0}
.prole-h{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:-4px}
button.stat.need{all:unset;box-sizing:border-box;display:grid;align-content:start;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
button.stat.need b{font:700 24px/1.1 var(--f-display)}
button.stat.need[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
button.stat.need:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile-more{position:absolute;right:10px;top:8px;color:var(--muted);font-size:12px}
.tm{text-align:center;font-variant-numeric:tabular-nums}
button.stat.need .eyebrow{padding-right:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.tile-p{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.tile-p .ist{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 72px}
.tile-names{display:grid;gap:1px;margin-top:4px;font-size:13px;line-height:1.3;color:var(--ink);font-weight:500}
.tile-names span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asg-date{font:500 14px var(--f-body);color:var(--muted)}
.pd-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px;min-height:0}
.pd-add button{font-size:13px;padding:4px 10px}
.day-row{flex-wrap:nowrap;align-items:stretch;min-width:0}
.day-row .daychips{flex:1;min-width:0}

<script>
/* ===================== PARSER-START (reine Funktionen, ohne DOM) ===================== */
const UNIT_WORDS = ['stk','stück','st','fl','flasche','flaschen','kiste','kisten','ki','ka','kasten','kästen','kaesten','kt','karton','kartons',
  'pauschale','pauschalen','stunde','stunden','std','meter','packungen','rollen','sets','säcke','trays','fässer','gläser','pck','pack','packung','pk','kg','g','l','ltr','liter','sack','tray','glas','tasse','dose','dosen','fass','eimer','btl','beutel','rolle','satz','set','paar','ve'];
const SUMMARY_RX = /\b(summe|zwischensumme|gesamtbetrag|gesamtsumme|rechnungsbetrag|netto|brutto|mwst|ust\b|umsatzsteuer|übertrag|uebertrag|skonto|zahlbar|endbetrag|zu zahlen)\b/i;

function parseNum(t){
  if(t==null) return NaN;
  t = String(t).trim().replace(/€|eur$/i,'').replace(/^\+/,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) return parseFloat(t.replace(/\./g,'').replace(',','.'));
  if(/^-?\d{1,3}(,\d{3})+\.\d+$/.test(t)) return parseFloat(t.replace(/,/g,''));
  if(/^-?\d+,\d+$/.test(t)) return parseFloat(t.replace(',','.'));
  if(/^-?\d+\.\d{1,2}$/.test(t)) return parseFloat(t);
  if(/^-?\d+$/.test(t)) return parseInt(t,10);
  return NaN;
}
const isCodeTok = t => /^[A-Z0-9]+[-\/][A-Z0-9\-\/]+$/.test(t);
const isWord = t => /[a-zA-ZäöüÄÖÜß]{2,}/.test(t) && !/\d/.test(t) && !isCodeTok(t);
const isCode = t => /\d/.test(t) && /^[A-Za-z0-9][A-Za-z0-9\-\/\.]{2,}$/.test(t) && isNaN(parseNum(t));

function normText(s){
  return String(s||'').toLowerCase().replace(/ß/g,'ss').replace(/[^a-z0-9äöü,\.x ]+/g,' ').replace(/\s+/g,' ').trim();
}
/* Gebindefaktor aus Text wie "Kiste 20x0,5l" oder "24 x 0,33" */
function guessFactor(desc){
  const m = String(desc).match(/(\d{1,3})\s*[x×]\s*\d/i);
  return m ? parseInt(m[1],10) : 1;
}
/* Getränke-Gebinde „Bionade Holunder 12 x 0,33l“ -> {n:12, single:'Bionade Holunder 0,33l'}, sonst null.
   Nur mit Volumenangabe (l/ml/cl), damit Maße wie „Faltzelt 3x3m“ nicht als Gebinde gelten. */
function packOf(name){
  const m = String(name||'').match(/^(.*?)\s*\b(\d{1,3})\s*[x×]\s*(\d+(?:[,.]\d+)?\s*(?:ml|cl|l)l?\b.*)$/i);
  if(!m) return null;
  return {n:parseInt(m[2],10), single:(m[1]+' '+m[3]).replace(/\s+/g,' ').trim()};
}
/* Artikelname ohne Gebinde: "Elbtaler Pils Kiste 20x0,5l" -> "Elbtaler Pils 0,5l" */
function cleanName(desc){
  return String(desc).replace(/\b(kiste|kisten|kasten|karton|ka|kt|tray|gebinde|pack|packung)\b/ig,' ')
    .replace(/\b\d{1,3}\s*[x×]\s*/i,'').replace(/\s+/g,' ').trim();
}

/* Eine Textzeile -> Position oder null */
/* Fußzeilen mit Bankdaten/Steuernummer sind nie Positionen (sonst wird „Tel. … IBAN DE65 8509 …“ als Menge × Preis gelesen) */
const FOOTER_RX = /\b(iban|bic|ust-?id|steuernummer|steuer-nr|amtsgericht|handelsregister)\b|\btel\.?\s*:/i;
function parseItemLine(line){
  if(!line || SUMMARY_RX.test(line) || FOOTER_RX.test(line)) return null;
  const toks = line.replace(/\s+€/g,'€').split(/\s+/).filter(Boolean);
  const nums = [];
  toks.forEach((t,i)=>{ const v=parseNum(t); if(!isNaN(v)) nums.push({i,v,dec:/[,.]\d{2}$/.test(t.replace(/€$/,''))}); });
  if(nums.length<2 || !toks.some(isWord)) return null;
  let best=null;
  outer: for(let k=nums.length-1;k>=2;k--){
    const T=nums[k]; if(!(T.v>0)) continue;
    for(let j=k-1;j>=1;j--){
      const P=nums[j]; if(!(P.v>0)) continue;
      for(let i=j-1;i>=0;i--){
        const Q=nums[i]; if(!(Q.v>0) || Q.v>100000) continue;
        const prod=Q.v*P.v, tol=Math.max(0.02, T.v*0.006);
        if(Math.abs(prod-T.v)<=tol){ best={Q,P,T}; break outer; }
      }
    }
  }
  if(!best){
    // Menge nicht lesbar (z. B. Foto): aus Gesamt / Einzelpreis zurückrechnen
    const dec = nums.filter(n=>n.dec && n.v>0);
    if(dec.length<2) return null;
    const T=dec[dec.length-1], Pp=dec[dec.length-2], q=T.v/Pp.v, rq=Math.round(q);
    if(rq<1 || Math.abs(q-rq)>0.01) return null;
    best={Q:{i:-1,v:rq},P:Pp,T,calc:true};
  }
  const used = new Set([best.Q.i,best.P.i,best.T.i]);
  // führende Pos-/Artikelnummern
  let art='', firstWord = toks.findIndex(isWord);
  const lead = toks.slice(0, Math.max(0,firstWord)).map((t,i)=>({t,i})).filter(o=>!used.has(o.i));
  lead.forEach(o=>used.add(o.i));
  const codes = lead.filter(o=>o.t.length>=3);
  if(codes.length) art = codes[codes.length-1].t;
  // Einheit direkt nach der Menge
  let unit='';
  const isUnit = t => t && UNIT_WORDS.includes(t.toLowerCase().replace(/\.$/,''));
  let ui = best.Q.i>=0 ? best.Q.i+1 : -1;
  if(best.Q.i<0){ for(let x=best.P.i-1;x>=Math.max(0,best.P.i-3);x--){ if(isUnit(toks[x])){ ui=x; break; } } }
  if(ui>=0 && isUnit(toks[ui])){ unit=toks[ui].replace(/\.$/,''); used.add(ui); }
  const desc = toks.filter((t,i)=>!used.has(i) && i<best.T.i && !/^[%€]$/.test(t) && !/^\d+([,.]\d+)?\s*%$/.test(t) && !(isNaN(parseNum(t))===false && i>best.P.i))
    .filter(t=>!(t.toUpperCase()==='EUR') && /[A-Za-z0-9äöüÄÖÜß]/.test(t)).join(' ').trim();
  if(!desc || !/[a-zA-ZäöüÄÖÜ]{2,}/.test(desc)) return null;
  return {art, desc, qty:best.Q.v, unit, price:best.P.v, total:best.T.v, calc:!!best.calc};
}

function parseHeader(lines, ownName){
  const text = lines.join('\n');
  let number='', date='', party='';
  const nm = text.match(/(?:rechnungs?[\s-]*(?:nr|nummer|no)\.?|angebots?[\s-]*(?:nr|nummer)\.?|beleg[\s-]*(?:nummer|nr)\.?|lieferschein[\s-]*(?:nr|nummer)\.?|invoice\s*(?:no|number)\.?)\s*[:#]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,})/i);
  if(nm) number = nm[1].replace(/[.,]$/,'');
  const dl = lines.find(l=>/rechnungsdatum|datum/i.test(l) && /\d{1,2}\.\d{1,2}\.\d{2,4}/.test(l)) || text;
  const dm = dl.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})\b/);
  if(dm){ let y=dm[3]; if(y.length===2) y='20'+y; date = `${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`; }
  const own = normText(ownName||'B&B');
  let ownIdx=-99;
  for(const [idx,raw] of lines.slice(0,14).entries()){
    if(own && normText(raw).includes(own)){ ownIdx=idx; continue; }
    if(ownIdx>0 && idx>ownIdx && idx<=ownIdx+3) continue;   // Empfänger-Adressblock (eigene Firma als Empfänger)
    const l = raw.replace(/\s*(rechnungs|rechnung\b|lieferdatum|datum|kunden|seite).*$/i,'').trim();
    if(!l || l.length<3) continue;
    if(own && normText(l).includes(own)) continue;
    if(/·|\bust|steuer|iban|\b\d{5}\b|straße|str\.|tel\.|@|www\./i.test(l)) continue;
    if(/^(rechnung|lieferschein|pos|art)|bezeichnung|einzelpreis|menge/i.test(l)) continue;
    if(!/[a-zA-ZäöüÄÖÜ]{3,}/.test(l)) continue;
    party = l; break;
  }
  return {number, date, party};
}

/* Angebot: Titel der Veranstaltung („"Karneval Auftakt" 14.11.2026“) und Veranstaltungsdatum (Liefer-/Leistungsdatum) */
function parseOffer(lines){
  let title='', eventDate='', from='', to='';
  const toIso = m => { let y=m[3]; if(y.length===2) y='20'+y; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; };
  for(const l of lines){
    if(!eventDate){ const m = l.match(/(?:liefer|leistungs|veranstaltungs|event)[^:\n]{0,20}datum\s*:?\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})/i); if(m) eventDate = toIso(m.slice(0)); }
    if(!title){ const m = l.match(/^\s*[„"“”']([^"“”„']{3,80})[“"”']/); if(m) title = m[1].trim(); }
  }
  if(!eventDate){ for(const l of lines){ const m = l.match(/^\s*[„"“]([^"“”]+)[“"”]\s+(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if(m){ eventDate = toIso([0,m[2],m[3],m[4]]); break; } } }
  // Mietzeitraum: 13.11. - 15.11.2026 (erstes Datum oft ohne Jahr)
  for(const l of lines){ const m = l.match(/miet(?:zeitraum|dauer|zeit)\s*:?\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})?\s*(?:-|–|bis)\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})/i);
    if(m){ to = toIso([0,m[4],m[5],m[6]]); from = toIso([0,m[1],m[2],m[3]||m[6]]); if(from>to) from = toIso([0,m[1],m[2],String(Number(m[6].length===2?'20'+m[6]:m[6])-1)]); break; } }
  return {title, eventDate, from, to};
}

const UNIT_CODES = {C62:'Stk',H87:'Stk',EA:'Stk',XPP:'Stk',CS:'Kiste',XCS:'Kiste',CR:'Kiste',XCR:'Kiste',CT:'Karton',XCT:'Karton',KGM:'kg',GRM:'g',LTR:'l',PK:'Pck',XPK:'Pck',BO:'Fl',XBO:'Fl',XBX:'Karton',SA:'Sack',XSA:'Sack'};

/* XRechnung / ZUGFeRD (CII und UBL). Erwartet ein XML-Document. */
function parseXmlDoc(doc){
  const q=(el,name)=>el? el.getElementsByTagNameNS('*',name)[0]||null : null;
  const qt=(el,...path)=>{ let e=el; for(const p of path){ e=q(e,p); if(!e) return ''; } return (e.textContent||'').trim(); };
  const root = doc.documentElement; const ln = root.localName;
  let out = {number:'',date:'',party:'',buyer:'',items:[]};
  const fmtDate = s => { s=(s||'').trim(); if(/^\d{8}$/.test(s)) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`; return s.slice(0,10); };
  if(ln==='CrossIndustryInvoice'){
    out.number = qt(root,'ExchangedDocument','ID');
    out.date = fmtDate(qt(root,'ExchangedDocument','IssueDateTime','DateTimeString'));
    out.party = qt(root,'SellerTradeParty','Name');
    out.buyer = qt(root,'BuyerTradeParty','Name');
    for(const li of root.getElementsByTagNameNS('*','IncludedSupplyChainTradeLineItem')){
      const bq = q(li,'BilledQuantity');
      const qty = parseFloat(bq?.textContent||'0');
      const price = parseFloat(qt(li,'NetPriceProductTradePrice','ChargeAmount')||'0');
      const total = parseFloat(qt(li,'LineTotalAmount')||String(qty*price));
      out.items.push({art:qt(li,'SpecifiedTradeProduct','SellerAssignedID'), desc:qt(li,'SpecifiedTradeProduct','Name'), qty, unit:UNIT_CODES[bq?.getAttribute('unitCode')]||bq?.getAttribute('unitCode')||'', price, total});
    }
  } else if(ln==='Invoice' || ln==='CreditNote'){
    const kids = [...root.children];
    out.number = (kids.find(e=>e.localName==='ID')?.textContent||'').trim();
    out.date = fmtDate((kids.find(e=>e.localName==='IssueDate')?.textContent||''));
    const sup = q(root,'AccountingSupplierParty');
    out.party = qt(sup,'PartyName','Name') || qt(sup,'RegistrationName');
    out.buyer = qt(q(root,'AccountingCustomerParty'),'RegistrationName');
    const tag = ln==='Invoice'?'InvoiceLine':'CreditNoteLine';
    for(const li of root.getElementsByTagNameNS('*',tag)){
      const qe = q(li, ln==='Invoice'?'InvoicedQuantity':'CreditedQuantity');
      const qty=parseFloat(qe?.textContent||'0');
      const price=parseFloat(qt(li,'Price','PriceAmount')||'0');
      const total=parseFloat(qt(li,'LineExtensionAmount')||String(qty*price));
      out.items.push({art:qt(li,'SellersItemIdentification','ID'), desc:qt(li,'Item','Name'), qty, unit:UNIT_CODES[qe?.getAttribute('unitCode')]||qe?.getAttribute('unitCode')||'', price, total});
    }
  } else return null;
  return out;
}

/* CSV mit Kopfzeile */
function parseCsv(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0];
  const delim = [';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=c; }
    else if(c==='"') inQ=true;
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; if(row.some(x=>x.trim())) rows.push(row); row=[]; }
    else cell+=c;
  }
  row.push(cell); if(row.some(x=>x.trim())) rows.push(row);
  if(rows.length<2) return null;
  const H = rows[0].map(h=>normText(h));
  const find = (...rx)=>{ for(const r of rx){ const i=H.findIndex(h=>r.test(h)); if(i>=0) return i; } return -1; };
  const c = {
    art: find(/artikel ?nr|artikelnummer|art\.? ?nr|^sku|^ean|^nr$/),
    desc: find(/bezeichnung|beschreibung|^artikel$|produkt|^name|^text/),
    qty: find(/^menge|anzahl|^qty|stückzahl/),
    unit: find(/^einheit|^me$|^unit/),
    price: find(/einzelpreis|^preis|^ep$|stückpreis|^vk/),
    total: find(/^gesamt|summe|betrag|^gp$/),
    party: find(/lieferant|^kunde|^firma|händler/),
    number: find(/beleg|rechnungs|angebot|^re ?nr|lieferschein/),
    date: find(/datum|^date/),
  };
  if(c.desc<0 || c.qty<0) return null;
  const items=[]; let party='',number='',date='';
  for(const r of rows.slice(1)){
    const g = k => c[k]>=0 ? (r[c[k]]||'').trim() : '';
    const qty=parseNum(g('qty')); if(!g('desc') || isNaN(qty)) continue;
    let price=parseNum(g('price')), total=parseNum(g('total'));
    if(isNaN(price) && !isNaN(total) && qty) price=total/qty;
    if(isNaN(total) && !isNaN(price)) total=price*qty;
    items.push({art:g('art'), desc:g('desc'), qty, unit:g('unit'), price:isNaN(price)?0:price, total:isNaN(total)?0:total});
    party = party || g('party'); number = number || g('number'); date = date || g('date');
  }
  const dm = date.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if(dm){ let y=dm[3]; if(y.length===2) y='20'+y; date=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`; }
  return {party, number, date, items};
}

/* Ähnlichkeit zweier Bezeichnungen (0..1) */
function similarity(a,b){
  const stop = new Set(['kiste','kasten','karton','fl','flasche','stk','x','und','mit','der','die','das']);
  const ta = new Set(normText(cleanName(a)).split(' ').filter(t=>t && !stop.has(t)));
  const tb = new Set(normText(cleanName(b)).split(' ').filter(t=>t && !stop.has(t)));
  if(!ta.size||!tb.size) return 0;
  let inter=0; ta.forEach(t=>{ if(tb.has(t)) inter++; });
  return inter / Math.max(ta.size, tb.size);
}

const KINDS = {ware:'Ware', leistung:'Leistung'};

function kindFrom(s){ const t=normText(s); return /miet|leist|dienst/.test(t) ? 'leistung' : /ware|artikel|produkt/.test(t) ? 'ware' : ''; }

function packLink(a){
  const p = packOf(a.name); if(!p || kindOf(a)!=='ware') return null;

/* Abgang von Einzelflaschen: reicht der Bestand nicht, werden Kästen angebrochen (Kasten −1, Flaschen +n).
   Gibt die Anbruch-Buchungen zurück; die Entnahme selbst bucht der Aufrufer. */
function openPacks(single, need, extra={}, st=stockMap()){
  const out=[]; let have = st[single.id]||0;
  if(kindOf(single)!=='ware' || have>=need) return out;
  for(const {pack, n} of packsFor(single)){
    let avail = Math.floor(st[pack.id]||0);
    while(have<need && avail>0){
      const g=uid();
      out.push(put('movements',{id:uid(), articleId:pack.id, qty:-1, type:'manual', reason:'Kasten angebrochen', date:extra.date||today(), docId:extra.docId, note:`→ ${n} ${uL(single,n)||'×'} ${single.name}`, open:g}));
      out.push(put('movements',{id:uid(), articleId:single.id, qty:n, type:'manual', reason:'Kasten angebrochen', date:extra.date||today(), docId:extra.docId, note:`aus ${pack.name}`, open:g}));
      st[pack.id]=(st[pack.id]||0)-1; st[single.id]=(st[single.id]||0)+n; have+=n; avail--;
    }
  }
  return out;
}

    }catch(err){ if(/not_found/.test(err.summary||err.message)) return []; throw err; }
  },
  move(from,to){ return this.api('files/move_v2',{from_path:from,to_path:to,autorename:true}); },
  folder(path){ return this.api('files/create_folder_v2',{path,autorename:false}).catch(()=>{}); }
};
const P = sub => (CFG.base.replace(/\/+$/,'') + '/' + sub).replace(/\/+/g,'/');

let syncState={s:'off',msg:''}, syncing=false, syncAgain=false, syncTimer=null;
function setSync(s,msg=''){ syncState={s,msg}; const el=$('#sync'); el.dataset.s=s;
  el.querySelector('span').textContent = s==='ok' ? 'Synchron' : s==='busy' ? 'Sync …' : s==='err' ? (navigator.onLine===false ? 'Offline' : 'Sync-Fehler') : 'Nicht verbunden';
  el.title = msg || (CFG.lastSync ? 'Zuletzt: '+new Date(CFG.lastSync).toLocaleString('de-DE') : 'Dropbox nicht verbunden'); }
function scheduleSync(){ if(!DBX.connected) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync, 1200); }
/* Zwei Geräte gleichzeitig: Hochgeladen wird nur, wenn die Datei in Dropbox seit dem Holen unverändert ist (rev).
   Hat inzwischen ein anderes Gerät gespeichert, meldet Dropbox einen Konflikt: neu holen, zusammenführen, nochmal.
   Hochgeladen wird nur bei echten Änderungen, sonst würden sich zwei offene Geräte gegenseitig ständig anstoßen. */
let SEEN = {lager:'', personal:'', einkauf:''};   // zuletzt bekannte Versionsnummern in Dropbox
const differs = (L, R, colls) => colls.some(c=>{ const A=L[c]||{}, B=R[c]||{};
  return Object.keys(A).length!==Object.keys(B).length || Object.values(A).some(o=>!B[o.id] || B[o.id].updatedAt!==o.updatedAt); });
const writeMode = blob => blob ? (blob.rev ? {'.tag':'update', update:blob.rev} : 'overwrite') : {'.tag':'add'};
async function sync(){
  if(!DBX.connected){ setSync('off'); return; }
  if(syncing){ syncAgain=true; return; }
  syncing=true; setSync('busy');
  try{
    const before = JSON.stringify(S), pBefore = JSON.stringify(PS), eBefore = JSON.stringify(ES), watch = watched();
    await syncLager();
    lsSet(LS_DATA,S);
    await syncPersonal(); lsSet(LS_PDATA,PS);
    await syncEinkauf(); lsSet(LS_EDATA,ES);
    if(rvAutoReturn()){ lsSet(LS_DATA,S); lsSet(LS_EDATA,ES); }
    CFG.lastSync=now(); saveCfg(); setSync('ok');
    warnForeign(watch);
    if(JSON.stringify({...S,meta:0}) !== JSON.stringify({...JSON.parse(before),meta:0})
      || JSON.stringify({...PS,meta:0}) !== JSON.stringify({...JSON.parse(pBefore),meta:0})
      || JSON.stringify({...ES,meta:0}) !== JSON.stringify({...JSON.parse(eBefore),meta:0})) softRender();
  }catch(e){ setSync('err', e.message); }
  syncing=false;
  if(syncAgain){ syncAgain=false; sync(); }
}
async function syncLager(){
  for(let tries=0;; tries++){
    let blob = await DBX.download(P('lager.json'));
    if(!blob && !CFG.allowNew) blob = await findBase();
    let resetAt = (S.meta&&S.meta.resetAt)||0, remote = null;
    if(blob){
      remote = JSON.parse(await blob.text());
      const rr = (remote.meta&&remote.meta.resetAt)||0, lr = resetAt;
      // Neustart: alles, was vor dem Neustart entstanden ist, verwerfen (auf beiden Seiten)
      if(rr>lr) dropBefore(S, rr); else if(lr>rr) dropBefore(remote, lr);
      resetAt = Math.max(rr, lr);
      S = merge(S, remote);
      if(blob.rev) SEEN.lager = blob.rev;
    }
    else if(CFG.lastSync && !CFG.allowNew){
      throw new Error(`lager.json wurde weder in „${CFG.base}“ noch in „${BASE_KNOWN.join('“ / „')}“ gefunden. Wurde der Ordner umbenannt oder verschoben? Bitte unter Einstellungen den Ordner anpassen.`);
    }
    if(remote && resetAt===((remote.meta&&remote.meta.resetAt)||0) && !differs(S, remote, COLLS)){ S.meta = {...remote.meta}; CFG.allowNew=false; return; }
    S.meta = {v:1, savedAt:now(), by:navigator.platform||'', resetAt};
    try{ const m = await DBX.upload(P('lager.json'), JSON.stringify(S), writeMode(blob)); SEEN.lager = m.rev||''; CFG.allowNew=false; return; }
    catch(e){ if(e.conflict && tries<4) continue; throw e; }
  }
}
/* personal.json: gleicher Ablauf wie lager.json. Fehlt die Datei, entsteht sie erst, wenn es etwas zu speichern gibt. */
async function syncPersonal(){
  for(let tries=0;; tries++){
    const blob = await DBX.download(P('personal.json'));
    const remote = blob ? JSON.parse(await blob.text()) : null;
    let resetAt = (PS.meta&&PS.meta.resetAt)||0;
    const rr = remote ? (remote.meta&&remote.meta.resetAt)||0 : 0;
    if(remote){
      if(rr>resetAt) dropBefore(PS, rr, PCOLLS); else if(resetAt>rr) dropBefore(remote, resetAt, PCOLLS);
      resetAt = Math.max(rr, resetAt);
      PS = merge(PS, remote, PCOLLS, emptyPState);
      if(blob.rev) SEEN.personal = blob.rev;
    }
    const changed = !remote ? PCOLLS.some(c=>Object.keys(PS[c]).length) : resetAt!==rr || differs(PS, remote, PCOLLS);
    PS.meta = {...(remote&&remote.meta||{}), v:1, resetAt};
    if(!changed) return;
    PS.meta = {v:1, savedAt:now(), by:navigator.platform||'', resetAt};
    try{ const m = await DBX.upload(P('personal.json'), JSON.stringify(PS), writeMode(blob)); SEEN.personal = m.rev||''; return; }
    catch(e){ if(e.conflict && tries<4) continue; throw e; }
  }
}
/* einkauf.json: gleicher Ablauf wie personal.json */
async function syncEinkauf(){
  for(let tries=0;; tries++){
    const blob = await DBX.download(P('einkauf.json'));
    const remote = blob ? JSON.parse(await blob.text()) : null;
    if(remote){ ES = merge(ES, remote, ECOLLS, emptyEState); if(blob.rev) SEEN.einkauf = blob.rev; }
    const changed = !remote ? ECOLLS.some(c=>Object.keys(ES[c]).length) : differs(ES, remote, ECOLLS);
    ES.meta = {...(remote&&remote.meta||{}), v:1};
    if(!changed) return;
    ES.meta = {v:1, savedAt:now(), by:navigator.platform||''};
    try{ const m = await DBX.upload(P('einkauf.json'), JSON.stringify(ES), writeMode(blob)); SEEN.einkauf = m.rev||''; return; }
    catch(e){ if(e.conflict && tries<4) continue; throw e; }
  }
}

/* Solange die App offen ist: alle 25 s nur die Versionsnummern abfragen und bei Änderung synchronisieren */
async function pollRemote(){
  if(!DBX.connected || syncing || document.visibilityState!=='visible' || navigator.onLine===false) return;
  const revOf = f => DBX.api('files/get_metadata',{path:P(f)}).then(m=>m.rev||'', e=>/not_found/.test(e.summary||e.message) ? '' : null);
  const [a,b,c] = await Promise.all([revOf('lager.json'), revOf('personal.json'), revOf('einkauf.json')]);
  let changed = false;
  if(c!==null && c!==SEEN.einkauf){ SEEN.einkauf=c; changed=true; }
  if(a!==null && a!==SEEN.lager){ SEEN.lager=a; changed=true; }
  if(b!==null && b!==SEEN.personal){ SEEN.personal=b; changed=true; }
  if(changed) sync();
}

/* Warnung, wenn ein gerade geöffneter Eintrag auf einem anderen Gerät geändert wurde */
function watched(){
  const w = [];
  if(pEditEvent && pEventId) w.push(['events', pEventId, 'Event']);
  if(pEditPerson && pEditPerson!=='new') w.push(['persons', pEditPerson, 'Person']);
  if(openArt && view==='bestand') w.push(['articles', openArt, 'Artikel']);
  return w.map(([c,id,l])=>({c, id, l, t:(store(c)[c][id]||{}).updatedAt}));
}
function warnForeign(list){
  for(const w of list){
    const r = store(w.c)[w.c][w.id];
    if(!r || r.updatedAt===w.t || !r.by || r.by===DEVICE) continue;
    toast(r.deleted ? `Achtung: ${w.l} „${r.name}“ wurde gerade auf einem anderen Gerät gelöscht.`
      : `Achtung: ${w.l} „${r.name}“ wurde gerade auf einem anderen Gerät geändert.${w.c==='articles'?'':' Beim Speichern wird nachgefragt.'}`);
  }
}
/* Beim Speichern: wurde der Eintrag seit dem Öffnen von einem anderen Gerät geändert? */
function foreignChangeOk(rec, stamp, what){
  if(!rec || rec.updatedAt===stamp || !rec.by || rec.by===DEVICE) return true;
  return confirm(`${what} wurde inzwischen auf einem anderen Gerät ${rec.deleted?'gelöscht':'geändert'}. Trotzdem speichern? Deine Eingaben ersetzen dann die andere Änderung.`);

/* Ordner verschoben (z. B. von „BundB App“ nach „Apps/BundB App“): an den bekannten Orten nach lager.json suchen
   und den Ordner auf diesem Gerät umstellen. Liefert die gefundene lager.json oder null. */
async function findBase(){
  for(const b of BASE_KNOWN){
    if(b.toLowerCase()===CFG.base.toLowerCase()) continue;
    const blob = await DBX.download((b+'/lager.json').replace(/\/+/g,'/'));
    if(blob){
      const old=CFG.base; CFG.base=b; saveCfg(); QUEUE=[]; inboxCache={in:null,out:null,err:''};
      toast(`Ordner gefunden: „${b.replace(/^\//,'')}“ (vorher „${old.replace(/^\//,'')}“). Auf diesem Gerät umgestellt.`);
      return blob;
    }
  }
  return null;
}

/* ===================== Hilfen UI ===================== */
const $ = s => document.querySelector(s);
let toastT;
function toast(msg, action){ const t=$('#toast'); t.textContent=msg;
  if(action){ const b=document.createElement('button'); b.textContent=action.label; b.onclick=()=>{ t.hidden=true; action.fn(); }; t.appendChild(b); }
  t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, action?7000:3200); }
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error(/jspdf/.test(src)?'Der PDF-Ersteller konnte nicht geladen werden (Internetverbindung prüfen).':/tesseract/.test(src)?'Die Texterkennung konnte nicht geladen werden (Internetverbindung prüfen).':'Der PDF-Leser konnte nicht geladen werden (Internetverbindung prüfen).')); document.head.appendChild(s); }); }
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_W='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

/* ===================== Beleg einlesen ===================== */
async function pdfLines(page){
  const tc = await page.getTextContent(); const rows=[];
  for(const it of tc.items){ if(!it.str || !it.str.trim()) continue;
    const y=it.transform[5], x=it.transform[4];
    let r = rows.find(r=>Math.abs(r.y-y)<=2.5); if(!r){ r={y,items:[]}; rows.push(r); }
    r.items.push({x,s:it.str.trim()}); }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' '));
}
async function ocr(source, progress){
  progress('Texterkennung wird geladen …');
  await loadScript(TESS);
  const worker = await Tesseract.createWorker('deu', 1, {logger:m=>{ if(m.status==='recognizing text') progress(`Texterkennung ${Math.round(m.progress*100)} %`); }});
  const { data } = await worker.recognize(source);
  await worker.terminate();
  return data.text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
}
async function readDocument(file, progress){
  const name = file.name||'beleg'; const lower=name.toLowerCase();
  const res = {source:'', raw:[], number:'', date:'', party:'', items:[]};
  const xmlFrom = txt => {
    const tryParse = t => { const d=new DOMParser().parseFromString(t,'application/xml'); return d.getElementsByTagName('parsererror').length ? null : d; };
    const d = tryParse(txt) || tryParse(txt.replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[0-9a-f]+);)/gi,'&amp;'));
    return d ? parseXmlDoc(d) : null; };
  if(lower.endsWith('.xml') || file.type.includes('xml')){
    const txt = await file.text(); const r = xmlFrom(txt);
    if(!r) throw new Error('Die XML-Datei ist keine XRechnung/ZUGFeRD-Rechnung.');
    return {...res, ...r, source:'E-Rechnung (XML)', raw:[txt.slice(0,4000)]};
  }
  if(lower.endsWith('.csv') || file.type==='text/csv'){
    const txt = await file.text(); const r = parseCsv(txt);
    if(!r) throw new Error('CSV erkannt, aber keine Spalten „Bezeichnung“ und „Menge“ gefunden.');
    return {...res, ...r, source:'CSV', raw:txt.split(/\r?\n/).slice(0,40)};
  }
  if(lower.endsWith('.pdf') || file.type==='application/pdf'){
    progress('PDF wird gelesen …');
    await loadScript(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_W;
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    // 1) eingebettete E-Rechnung (ZUGFeRD / Factur-X)
    try{
      const att = await pdf.getAttachments();
      if(att){ for(const k of Object.keys(att)){ const a=att[k]; if(/\.xml$/i.test(a.filename||k)){
        const r = xmlFrom(new TextDecoder('utf-8').decode(a.content));
        if(r && r.items.length) return {...res, ...r, source:'ZUGFeRD (im PDF eingebettet)', raw:[`Eingebettete Datei: ${a.filename}`]}; } } }
    }catch(e){}
    // 2) Textebene
    let lines=[];
    for(let p=1;p<=pdf.numPages;p++){ lines = lines.concat(await pdfLines(await pdf.getPage(p))); }
    if(lines.join('').replace(/\s/g,'').length > 40){
      return {...res, ...parseTextDoc(lines, CFG.ownName), source:'PDF-Text', raw:lines};
    }
    // 3) Scan -> OCR
    lines=[];
    for(let p=1;p<=Math.min(pdf.numPages,4);p++){
      const page=await pdf.getPage(p); const vp=page.getViewport({scale:2.2});
      const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      lines = lines.concat(await ocr(cv, progress));
    }
    return {...res, ...parseTextDoc(lines, CFG.ownName), source:'PDF-Scan (Texterkennung)', raw:lines};
  }
  if(file.type.startsWith('image/') || /\.(jpe?g|png|heic|webp)$/.test(lower)){
    const lines = await ocr(file, progress);
    return {...res, ...parseTextDoc(lines, CFG.ownName), source:'Foto (Texterkennung)', raw:lines};
  }
  throw new Error('Dateityp wird nicht unterstützt. Möglich: PDF, Foto, XML, CSV.');
}

/* Regeln: gelernte Zuordnung Rechnungstext -> Artikel + Faktor */
function ruleKeys(line, party){ const k=[]; if(line.art) k.push('a:'+normText(party)+'|'+normText(line.art)); k.push('t:'+normText(line.desc)); return k; }
function suggest(line, party){
  for(const k of ruleKeys(line,party)){ const r=S.rules[k]; if(r && !r.deleted && S.articles[r.articleId] && !S.articles[r.articleId].deleted) return {articleId:r.articleId, factor:r.factor, how:'Regel'}; }
  // Ausgangsrechnungen kommen aus demselben Programm wie der Artikelexport: gleicher Name hat Vorrang
  const arts = live('articles');
  const ex = arts.find(a=>sameName(a, line.desc));
  if(ex) return {articleId:ex.id, factor:1, how:'exakt'};
  // Ähnlich, aber nie Gebinde mit Einzelflasche verwechseln („… 12 x 1l“ ≠ „… 1l“).
  // Faktor bleibt 1: Maße und Gebinde im Namen werden nicht verrechnet (Kasten bucht auf den Kasten-Artikel).
  const pk = (packOf(line.desc)||{n:0}).n;
  let best=null, bs=0;
  for(const a of arts){ if((packOf(a.name)||{n:0}).n!==pk) continue; const s=similarity(line.desc,a.name); if(s>bs){bs=s;best=a;} }
  if(best && bs>=0.8) return {articleId:best.id, factor:1, how:'ähnlich'};
  return {articleId:'', factor:1, how:''};
}
/* Ausgangsrechnung: Leistungen (auch vermietete Geräte) sind kein Lagerabgang und werden abgewählt (einschalten bleibt möglich) */
function applyKind(l, direction){
  const a = S.articles[l.articleId];
  const ns = direction==='out' && !!a && !a.deleted && kindOf(a)!=='ware';
  if(ns !== !!l.noStock) l.on = !ns;
  l.noStock = ns;
}

function blankLine(){ return {art:'',desc:'',qty:0,unit:'',price:0,total:0,on:true,articleId:'',factor:1,how:''}; }

async function buildImp(file, direction, dbxPath, progress){
  try{
    const r = await readDocument(file, progress||(()=>{}));
    const party = r.party || '';
    const items = r.items.map(it=>{ const s=suggest(it, party); const l={...it, on:true, articleId:s.articleId||'new', factor:s.factor, how:it.calc ? (s.how?s.how+' · ':'')+'Menge berechnet' : s.how}; applyKind(l, direction); return l; });
    const imp = {dir:direction, fileName:file.name, file, dbxPath, source:r.source, raw:r.raw, number:r.number||'', date:r.date||today(), party, items, manual:false, reason:''};
    if(!items.length){ imp.manual=true; imp.reason='Es wurden keine Positionen erkannt.'; imp.items=[blankLine(),blankLine(),blankLine()]; }
    return imp;
  }catch(e){
    return {dir:direction, fileName:file.name, file, dbxPath, source:'nicht lesbar', raw:[], number:'', date:today(), party:'', manual:true, reason:e.message,
      items:[blankLine(),blankLine(),blankLine()]};
  }
}

function duplicateDoc(imp=IMP){

async function archiveFile(imp){
  if(!DBX.connected) return '';
  const folder = (imp.dir==='in'?'Eingang':'Ausgang') + '/' + (imp.date||today()).slice(0,4);
  if(imp.dbxPath){ const r = await DBX.move(imp.dbxPath, P(folder+'/'+imp.fileName)); return r.metadata.path_display; }
  const r = await DBX.upload(P(folder+'/'+imp.fileName), imp.file, 'add'); return r.path_display;
}

async function bookImport(imp=IMP, silent=false){
  const chosen = imp.items.filter(l=>l.on && l.articleId!=='skip' && (Number(l.qty)||0)!==0);
  if(chosen.some(l=>!l.articleId)){ toast('Bitte jeder Position einen Lagerartikel zuordnen oder sie abwählen.'); return false; }
  if(chosen.some(l=>l.articleId==='new' && !l.desc.trim())){ toast('Für einen neuen Artikel fehlt die Bezeichnung.'); return false; }
  const lines = chosen;
  // Rechnung nur aus Leistungen: ohne Lagerbuchung abschließen und ablegen
  const svcOnly = !lines.length && imp.items.some(l=>l.noStock);
  if(!lines.length && !svcOnly){ toast('Keine Position zum Buchen ausgewählt.'); return false; }
  const doc = put('docs',{id:uid(), dir:imp.dir, party:imp.party, number:imp.number, date:imp.date, source:imp.manual?'manuell zugeordnet':imp.source, file:'', lines:lines.length});
  const sign = imp.dir==='in' ? 1 : -1;
  const st = stockMap(); let opened = 0;
  for(const l of lines){
    let aid = l.articleId;
    const f = Number(l.factor)||1;
    if(aid==='new'){
      const nm = l.desc.trim();
      const existing = live('articles').find(a=>sameName(a, nm));
      if(existing) aid = existing.id;
      else aid = put('articles',{id:uid(), name:nm, unit:l.unit||'', unitPl:'', desc:'', kind:'ware', category:'', min:0, lastPrice:0}).id;
    }
    const qty = Math.round(Number(l.qty)*f*sign*1000)/1000;
    if(qty<0) opened += openPacks(S.articles[aid], -qty, {date:imp.date, docId:doc.id}, st).length/2;
    put('movements',{id:uid(), articleId:aid, qty, type:imp.dir, date:imp.date, docId:doc.id, note:l.desc||S.articles[aid].name, price:Number(l.price)||0});
    st[aid] = (st[aid]||0) + qty;
    if(imp.dir==='in' && l.price){ const a=S.articles[aid]; a.lastPrice = Number(l.price)/f; put('articles',a); }
    if(l.desc.trim()) for(const k of ruleKeys(l, imp.party)) put('rules',{id:k, articleId:aid, factor:f, sample:l.desc, party:imp.party});
  }
  persist();
  try{ doc.file = await archiveFile(imp); if(doc.file){ put('docs',doc); persist(); } }
  catch(e){ toast('Gebucht. Ablage in Dropbox fehlgeschlagen: '+e.message); }
  if(!silent) toast(svcOnly ? 'Beleg abgeschlossen, kein Lagerabgang (nur Leistungen)' : `${lines.length} Positionen gebucht${opened?` · ${opened} Kasten angebrochen`:''}`);
  finishQueueItem(imp);
  return true;
}

function finishQueueItem(imp){
  if(imp.dbxPath) QUEUE = QUEUE.filter(q=>q.path!==imp.dbxPath);
  if(imp===IMP){ IMP=null; openNextReady(); }
  render();

/* Beim Start und bei Rückkehr zur App: _Neu-Ordner prüfen und alles einlesen */
/* Belege (Eingangs-/Ausgangsrechnungen) sind seit v52 abgeschaltet: das Lager wird über Einkauf („Aus Lager entnehmen“)
   und Inventur geführt. Code bleibt für später, BELEGE_AKTIV schaltet ihn wieder ein. */
const BELEGE_AKTIV = false;
async function scanInbox(openFirst){
  if(!DBX.connected || !BELEGE_AKTIV) return;
  await loadInbox();
  const files = [...(inboxCache.in||[]).map(f=>({f,dir:'in'})), ...(inboxCache.out||[]).map(f=>({f,dir:'out'}))];
  const paths = new Set(files.map(x=>x.f.path_lower));
  QUEUE = QUEUE.filter(q=>paths.has(q.path) || (IMP && IMP.dbxPath===q.path));
  let added=0;
  for(const {f,dir:d} of files){ if(!QUEUE.some(q=>q.path===f.path_lower)){ QUEUE.push({path:f.path_lower, name:f.name, dir:d, status:'wait', msg:'', imp:null}); added++; } }
  if(added){ render(); }
  await runQueue(openFirst);
}
async function runQueue(openFirst){
  if(queueRunning) return; queueRunning=true;
  let booked=0;
  for(const q of QUEUE){
    if(q.status!=='wait') continue;
    q.status='reading'; q.msg='wird gelesen …'; renderQueueOnly();
    try{
      const blob = await DBX.download(q.path);
      if(!blob) throw new Error('Datei nicht mehr vorhanden.');
      const ext = q.name.split('.').pop().toLowerCase();
      const type = {pdf:'application/pdf',xml:'application/xml',csv:'text/csv',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic'}[ext]||blob.type;
      q.imp = await buildImp(new File([blob], q.name, {type}), q.dir, q.path, m=>{ q.msg=m; renderQueueOnly(); });
    }catch(e){
      q.imp = {dir:q.dir, fileName:q.name, file:null, dbxPath:q.path, source:'nicht lesbar', raw:[], number:'', date:today(), party:'', manual:true, reason:e.message, items:[blankLine(),blankLine(),blankLine()]};
    }
    q.status = q.imp.manual ? 'manual' : 'ready';
    q.msg = q.imp.manual ? 'manuell zuordnen' : `${q.imp.items.length} Positionen erkannt`;
    // Automatisch buchen, wenn alles über gelernte Regeln bekannt ist
    if(CFG.autoBook && !q.imp.manual && q.imp.items.length && q.imp.items.every(l=>/Regel|exakt/.test(l.how)) && !duplicateDoc(q.imp)){
      const ok = await bookImport(q.imp, true); if(ok){ booked++; continue; }
    }
    renderQueueOnly();
  }
  queueRunning=false;
  if(booked) toast(`${booked} Beleg${booked>1?'e':''} automatisch gebucht`);
  const open = QUEUE.filter(q=>q.status==='ready'||q.status==='manual').length;
  if(openFirst && open && !IMP && !busyMsg && !isTyping()){ openNextReady(); }
  render();
}
function isTyping(){ const a=document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName); }
function renderQueueOnly(){
  const n = QUEUE.filter(q=>q.status!=='wait'&&q.status!=='reading').length;
  const b = document.querySelector('#tabs [data-go="belege"]');
  if(b) b.dataset.badge = QUEUE.length ? String(QUEUE.length) : '';

}

const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let XL = null;   // {rows:[{name,cat,unit,qty,min,price,match}], file, date}
async function readTable(file){
  const lower=file.name.toLowerCase();
  if(/\.(xlsx|xlsm|xls|ods)$/.test(lower)){
    await loadScript(XLSX_URL);
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''}).map(r=>r.map(c=>String(c??'').trim()));
  }
  const text=(await file.text()).replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]; const delim=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{ const out=[]; let cell='',q=false; for(let i=0;i<l.length;i++){ const c=l[i];
    if(q){ if(c==='"'){ if(l[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; } else if(c==='"') q=true; else if(c===delim){ out.push(cell.trim()); cell=''; } else cell+=c; }
    out.push(cell.trim()); return out; });
}
function parseStockTable(rows){
  let hi=-1, H=[];
  for(let i=0;i<Math.min(rows.length,15);i++){ const h=rows[i].map(normText); if(h.some(x=>/artikel|bezeichnung|^name|produkt/.test(x)) && h.some(x=>/bestand|menge|anzahl|stück|stueck|^ist/.test(x))){ hi=i; H=h; break; } }
  if(hi<0) return null;
  const find=(rx,not)=>H.findIndex(h=>rx.test(h) && !(not&&not.test(h)));
  const c={ min:find(/mindest|^min/),
    name:[find(/bezeichnung/,/zusätz|zusatz/), find(/^artikel$|^artikelname|^name|produkt/), find(/artikel/,/nr|nummer|gruppe|typ|art$/)].find(i=>i>=0) ?? -1,
    cat:find(/kategorie|gruppe/), kind:find(/artikeltyp|^typ|^art$/),
    unitPl:find(/mehrzahl|plural/), unit:find(/einheit|^me$/,/mehrzahl|plural/),
    desc:find(/beschreibung|zusätz|zusatz|^notiz|^info/), alias:find(/rechnungsprogramm|zweitname|alias|alter name/),
    price:find(/^ek|einkauf|preis/) };
  c.qty = H.findIndex((h,i)=>/bestand|menge|anzahl|stück|stueck|^ist/.test(h) && i!==c.min);
  const g=(r,k)=>c[k]>=0 ? String(r[c[k]]??'').trim() : '';
  const out=[];
  for(const r of rows.slice(hi+1)){
    const name=g(r,'name'); if(!name) continue;
    const raw=g(r,'qty'); const qty=parseNum(raw);
    out.push({name, cat:g(r,'cat'), unit:g(r,'unit'), unitPl:g(r,'unitPl'), desc:c.desc>=0 ? String(r[c.desc]??'').replace(/\r\n?/g,'\n').trim() : '',
      kind:kindFrom(g(r,'kind')), alias:g(r,'alias'),
      // leerer Bestand gilt als 0; Gleitkomma-Reste (12.200000000000001) auf 3 Stellen
      qty: raw==='' ? 0 : isNaN(qty) ? null : Math.round(qty*1000)/1000, empty: raw==='',
      min:c.min>=0?parseNum(r[c.min]):NaN, price:c.price>=0?parseNum(r[c.price]):NaN});
  }
  return out;
}

  try{

    items.forEach(it=>{ const a=findArticle(it); it.match=a?a.id:''; it.on = it.qty!==null; });

      min:isNaN(it.min)?0:it.min, lastPrice:isNaN(it.price)?0:it.price}); nNew++; }
    else {
      // Wiederholter Import: nur gefüllte Zellen überschreiben, damit in der App nachgetragene Einheiten bleiben.
      const before=JSON.stringify(a);
      for(const k of ['unit','unitPl','desc','alias']) if(it[k]) a[k]=it[k];
      if(it.cat) a.category=it.cat;
      if(it.kind) a.kind=it.kind;
      if(!isNaN(it.min)) a.min=it.min; if(!isNaN(it.price)) a.lastPrice=it.price;
      if(JSON.stringify(a)!==before){ put('articles',a); nUpd++; }
    }
    const diff = Math.round(((it.qty||0)-(st[a.id]||0))*1000)/1000;
    if(diff!==0){ put('movements',{id:uid(), articleId:a.id, qty:diff, type:'inv', date, note:it.match?'Bestand aus Excel':'Anfangsbestand (Import)'}); nMv++; }

}

/* ===================== Einkauf ===================== */
/* Veranstaltung (Name, Datum) mit Bedarf aus einem Angebot oder von Hand. Bedarf gegen das Lager rechnen,
   Fehlmenge als Einkaufsliste (PDF). Bucht nichts aus. Jede Veranstaltung hat ihre eigene Liste (Wunsch Thomas).
   Ware wird gerechnet; Leistungen (Geräte, Arbeit, Pauschalen) nur als Hinweis, wenn der Lagerbestand nicht reicht.
   Kasten und Flasche: Bedarf und Bestand in Flaschen zusammengerechnet, eingekauft wird in ganzen Kästen. */
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let ekLastMsg = '', ekId = null, ekAdding = false, ekScanMsg = '', ekScanning = false, ekPdfOut = null;
/* ekLines: Bedarfspositionen; mit list:'set' (Einkaufsmenge von Hand geändert) oder list:'add' (Zusatzposition) gehören sie zur Einkaufsliste */
const ekAllOf = id => live('ekLines').filter(l=>l.eventId===id);
const ekListOf = id => ekAllOf(id).filter(l=>l.list).sort((a,b)=>(a.pos||0)-(b.pos||0)||(a.updatedAt||0)-(b.updatedAt||0));
const ekLinesOf = id => live('ekLines').filter(l=>l.eventId===id && !l.list).sort((a,b)=>(a.pos||0)-(b.pos||0)||(a.updatedAt||0)-(b.updatedAt||0));
const ekSure = l => l.articleId==='skip' || (!!l.articleId && !!S.articles[l.articleId] && !S.articles[l.articleId].deleted && l.how!=='ähnlich');
const ekOpenCount = id => ekLinesOf(id).filter(l=>!ekSure(l)).length;
const EK_SKIP_UNITS = /^(pauschale|pauschalen|stunde|stunden|std)$/i;

/* Positionen eines Angebots zuordnen: Regel → exakter Name → ähnlich (zu bestätigen) → offen.
   Unbekannte Pauschalen/Stunden werden gleich als „nicht berücksichtigt“ vorgeschlagen. */
function ekLineFrom(it, party, eventId, pos){
  const sg = suggest(it, party);
  let articleId = sg.articleId||'', how = sg.how||'';
  if(!articleId && EK_SKIP_UNITS.test(it.unit||'')){ articleId='skip'; how='Pauschale'; }
  return {id:uid(), eventId, desc:it.desc, qty:Number(it.qty)||0, unit:it.unit||'', articleId, how, src:'angebot', pos};
}

function ekTake(id, quiet){
  const e = ES.ekEvents[id]; if(!e || e.took) return;
  const c = ekCalc(id); let n = 0; const res = {};
  for(const r of c.rows){
    for(const t of r.take||[]){ const a=S.articles[t.id];
      put('movements',{id:uid(), articleId:t.id, qty:-t.qty, type:'manual', reason:'Entnahme Veranstaltung', date:today(), note:e.name, ekId:id}); n++; }
    if(r.res>0) res[r.famId] = r.res;
  }
  e.took = {at:now(), res}; put('ekEvents', e); persist();
  if(!quiet) toast(n || Object.keys(res).length ? `Aus Lager entnommen: ${n} Buchungen${Object.keys(res).length?`, ${Object.keys(res).length} Geräte reserviert`:''}` : 'Nichts im Lager, nichts entnommen.');
}
function ekUntake(id){
  const e = ES.ekEvents[id]; if(!e) return;
  ekTookMv(id).forEach(m=>del('movements', m.id));
  e.took = null; put('ekEvents', e); persist(); toast('Entnahme zurückgenommen, Lagerbestand wieder da.');
}
/* Stimmt die gebuchte Entnahme noch mit dem Bedarf überein? (Bedarf nach dem Entnehmen geändert) */
function ekTakeDiff(id, c){
  const want = {}; c.rows.forEach(r=>(r.take||[]).forEach(t=>want[t.id]=(want[t.id]||0)+t.qty));
  const have = {}; ekTookMv(id).forEach(m=>have[m.articleId]=(have[m.articleId]||0)-Number(m.qty||0));
  const keys = new Set([...Object.keys(want), ...Object.keys(have)]);
  return [...keys].some(k=>Math.abs((want[k]||0)-(have[k]||0))>1e-9);
}
/* Einkaufsmenge einer berechneten Zeile von Hand setzen (0 = von der Liste nehmen) */
function ekSetBuy(id, artId, qty){
  let l = ekListOf(id).find(x=>x.list==='set' && x.articleId===artId);
  if(!l) l = {id:uid(), eventId:id, list:'set', articleId:artId, desc:'', unit:'', how:'manuell', src:'liste', pos:0};
  l.qty = qty; put('ekLines', l); persist();
}
/* Zuordnung von Hand merken (gleiche Regeln wie bei Belegen: Text → Lagerartikel, Faktor 1) */
function ekLearn(l){
  if(!l.desc || !l.articleId || l.articleId==='skip' || !S.articles[l.articleId]) return;
  const k='t:'+normText(l.desc); put('rules',{id:k, articleId:l.articleId, factor:1, sample:l.desc, party:(ES.ekEvents[l.eventId]||{}).party||''});
}
/* „Aus Lager entnehmen“ (Wunsch Thomas): Ware wird für die Veranstaltung echt ausgebucht (movements mit ekId),
   Leistungen (Geräte) werden nur für Veranstaltungen am selben Tag reserviert (e.took.res), sie kommen zurück.
   Die eigene Entnahme zählt für die eigene Liste weiter als Lagerbestand, für alle anderen ist sie weg. */
const ekTookMv = id => live('movements').filter(m=>m.ekId===id);
function ekResOthers(id){ return rvOthers(id).taken; }   // Leistungen: was andere Veranstaltungen im Zeitraum entnommen haben
function ekCalc(id){
  const st = stockMap(); const fam = new Map();
  for(const m of ekTookMv(id)) st[m.articleId] = (st[m.articleId]||0) - Number(m.qty||0);
  const resO = ekResOthers(id), ownRv = rvOwned();
  for(const l of ekLinesOf(id)){
    if(!ekSure(l) || l.articleId==='skip') continue;
    const a = S.articles[l.articleId]; const q = Number(l.qty)||0; if(!(q>0)) continue;
    // Leistungen stehen mit auf der Liste (Wunsch Thomas), außer Pauschalen und Stunden (Arbeit, Transport …)
    if(kindOf(a)==='leistung' && EK_SKIP_UNITS.test(l.unit||'')) continue;
    const pl = kindOf(a)==='ware' ? packLink(a) : null;
    const key = pl ? pl.single.id : a.id;
    if(!fam.has(key)) fam.set(key, {need:0, pref:null, packLines:0, singleLines:0});
    const f = fam.get(key);
    if(pl){ f.need += q*pl.n; f.pref = f.pref || a; f.packLines++; } else { f.need += q; f.singleLines++; }
  }
  const rows = [];
  for(const [key, f] of fam){
    const single = S.articles[key];
    const packs = kindOf(single)==='ware' ? packsFor(single) : [];
    const svcRow = kindOf(single)==='leistung';
    const avail = svcRow ? Math.max(0, (ownRv[single.id]||0) - (resO[single.id]||0))
      : Math.max(0, st[single.id]||0) + packs.reduce((s,p)=>s+Math.max(0, st[p.pack.id]||0)*p.n, 0);
    const missing = Math.round((f.need - avail)*1000)/1000;
    // Entnahme planen: erst ganze Kästen, dann Einzelflaschen, notfalls einen weiteren Kasten anbrechen
    const take = [];
    if(!svcRow){
      let rem = f.need; const order = f.pref ? [...packs].sort((x,y)=>(y.pack.id===f.pref.id)-(x.pack.id===f.pref.id)) : packs;
      const left = {};
      for(const p of order){ const have=Math.floor(Math.max(0, st[p.pack.id]||0)); const k=Math.min(have, Math.floor(rem/p.n + 1e-9)); left[p.pack.id]=have-k; if(k){ take.push({id:p.pack.id, qty:k}); rem = Math.round((rem-k*p.n)*1000)/1000; } }
      const sg = Math.min(Math.max(0, st[single.id]||0), rem); if(sg>0){ take.push({id:single.id, qty:Math.round(sg*1000)/1000}); rem = Math.round((rem-sg)*1000)/1000; }
      for(const p of order){ while(rem>0 && left[p.pack.id]>0){ left[p.pack.id]--; rem=Math.max(0, rem-p.n); const t=take.find(x=>x.id===p.pack.id); if(t) t.qty++; else take.push({id:p.pack.id, qty:1}); } }
    }
    const res = 0;   // Leistungen werden nur unter Reservierungen entnommen
    const pk = f.pref ? packs.find(p=>p.pack.id===f.pref.id) || packs[0] : packs[0];
    let buy=0, buyArt=single;
    if(missing>0){ if(pk){ buy = Math.ceil(missing/pk.n - 1e-9); buyArt = pk.pack; } else buy = Math.ceil(missing - 1e-9); }
    // Bedarf so anzeigen, wie er im Angebot stand (nur Kästen → in Kästen)
    const inPacks = pk && f.packLines && !f.singleLines && Math.abs(f.need/pk.n - Math.round(f.need/pk.n))<1e-9;
    const needArt = inPacks ? pk.pack : single, needQty = inPacks ? f.need/pk.n : f.need;
    const art = buy ? buyArt : (inPacks ? pk.pack : single);
    rows.push({art, cat: (f.pref||single).category||'ohne Gruppe', need: needQty, needText: `${fmt(needQty,3)} ${uL(needArt, needQty)}`.trim(),
      buy, calc: buy, unit: buy ? uL(art, buy) : '', avail, svc: svcRow, take, res, famId: single.id, famIds: [single.id, ...packs.map(p=>p.pack.id)]});
  }
  // Von Hand: Menge geändert (set) oder Position ergänzt (add)
  for(const l of ekListOf(id)){
    if(l.list==='set'){ const r = rows.find(x=>x.art.id===l.articleId); if(!r) continue;
      r.buy = Math.max(0, Number(l.qty)||0); r.setId = l.id; r.unit = uL(r.art, r.buy) || r.unit; }
    else if(l.list==='add'){ const a = S.articles[l.articleId]; const q = Number(l.qty)||0;
      rows.push({art: a || {id:'', name: l.name||''}, cat: 'Zusätzlich', need:0, needText:'', buy:q, unit: l.unit || (a ? uL(a,q) : ''), addId:l.id, line:l}); }
  }
  // Waren zuerst, darunter Leistungen (Wunsch Thomas); Zusatzpositionen je Abschnitt am Ende
  rows.forEach(r=>{ r.sec = r.svc || (r.addId && S.articles[r.line.articleId] && kindOf(S.articles[r.line.articleId])==='leistung') ? 'leistung' : 'ware'; });
  rows.sort((x,y)=>(x.sec==='leistung')-(y.sec==='leistung')||(x.cat==='Zusätzlich')-(y.cat==='Zusätzlich')||x.cat.localeCompare(y.cat,'de')||(x.addId ? (x.line.pos||0)-(y.line.pos||0) : x.art.name.localeCompare(y.art.name,'de')));
  return {rows, buyRows: rows.filter(r=>r.buy>0 && (r.art.name||'').trim()), removed: rows.filter(r=>r.setId && !r.buy && r.calc), open: ekOpenCount(id)};
}

/* Angebote aus Dropbox „Angebote/“ automatisch einlesen. Die Datei wird zuerst nach Angebote/<Jahr>/ verschoben:
   nur das Gerät, dem das Verschieben gelingt, liest sie ein (keine doppelten Veranstaltungen bei zwei offenen Geräten). */
/* Abgeschaltet seit v61 (Wunsch Thomas): Angebote liegen in einem eigenen Dropbox-Ordner und werden per Dateiauswahl
   eingelesen („Angebot einlesen“). OFFER_SCAN schaltet das automatische Lesen von Angebote/ wieder ein. */
const OFFER_SCAN = false;
async function scanOffers(manual){
  if(!OFFER_SCAN || !DBX.connected || ekScanning) return;
  ekScanning = true; let found = 0;
  const type = name => ({pdf:'application/pdf', csv:'text/csv', xml:'application/xml'})[name.split('.').pop().toLowerCase()];
  const isOffer = e => e['.tag']==='file' && /\.(pdf|csv|xml)$/i.test(e.name);
  try{
    // 1) Neue Angebote direkt in Angebote/: nach Angebote/<Jahr>/ verschieben, dann einlesen
    const top = await DBX.list(P('Angebote'));
    for(const f of top.filter(isOffer)){
      ekScanMsg = `Angebot „${f.name}“ wird gelesen …`; ekRefresh();
      const target = P(`Angebote/${today().slice(0,4)}/${f.name}`);
      let moved;
      try{ moved = (await DBX.move(f.path_display||f.path_lower, target)).metadata.path_display; }catch(e){ continue; }
      try{ const blob = await DBX.download(moved); await ekFromFile(new File([blob], f.name, {type:type(f.name)}), moved); found++; toast(ekLastMsg); }
      catch(e){ toast(`Angebot ${f.name}: ${e.message}`); }
    }
    // 2) Nur über „Jetzt prüfen“ (vorher wird synchronisiert, damit ein zweites Gerät nichts doppelt anlegt):
    //    Angebote, die direkt in einen Jahresordner gelegt wurden (Angebote/2026/…) und noch zu keiner Veranstaltung gehören.
    //    Nur bestehende Veranstaltungen zählen. Beim Löschen einer Veranstaltung wandert ihr Angebot nach Angebote/<Jahr>/Gelöscht/,
    //    damit es nicht von selbst wiederkommt; wer es wieder in Angebote/ oder Angebote/<Jahr>/ legt, bekommt es neu eingelesen.
    if(manual){
    const known = new Set(live('ekEvents').flatMap(e=>[e.file, ...(e.seen||[])]).map(x=>normText(x||'')).filter(Boolean));
    for(const d of top.filter(e=>e['.tag']==='folder' && /^\d{4}$/.test(e.name))){
      for(const f of (await DBX.list(d.path_display||d.path_lower)).filter(isOffer)){
        if(known.has(normText(f.path_display||f.path_lower))) continue;
        ekScanMsg = `Angebot „${f.name}“ wird gelesen …`; ekRefresh();
        try{ const blob = await DBX.download(f.path_lower); await ekFromFile(new File([blob], f.name, {type:type(f.name)}), f.path_display||f.path_lower); found++; toast(ekLastMsg); }
        catch(e){ toast(`Angebot ${f.name}: ${e.message}`); }
      }
    }
    }
    ekScanMsg = '';
    if(manual && !found) toast(`Keine neuen Angebote im Dropbox-Ordner ${P('Angebote').replace(/^\//,'')}.`);
  }catch(e){ ekScanMsg = 'Angebote konnten nicht geprüft werden: '+e.message; if(manual) toast(ekScanMsg); }
  ekScanning = false; ekRefresh();
}
async function ekReadOffer(file){
  let r;
  try{ r = await readDocument(file, m=>{ ekScanMsg=m; }); }catch(e){ r = {items:[], raw:[], number:'', date:'', party:'', unreadable:e.message}; }
  return {r, off: parseOffer(r.raw||[])};
}
/* Doppelt einlesen verhindern (Wunsch Thomas): Jedes Angebot hat einen Schlüssel (Angebotsnummer, sonst Inhalt).
   Jede Position merkt sich ihr Angebot (offer) und die Menge laut Angebot (oq).
   - Gleiches Angebot noch einmal (Ordner oder Knopf): nichts passiert.
   - Gleiche Nummer, anderer Inhalt (überarbeitetes Angebot): die Positionen dieses Angebots werden ersetzt,
     von Hand getroffene Zuordnungen bleiben (gleicher Text), Positionen von Hand und Listenänderungen bleiben.
   - Angebot gehört schon zu einer anderen Veranstaltung: dort aktualisieren statt eine zweite anzulegen. */
function hashStr(t){ let h=5381; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); }
const ekSig = arr => arr.map(x=>normText(x.desc)+'|'+(Number(x.oq ?? x.qty)||0)).join('\n');
const ekKeyOf = r => r.number ? 'nr:'+normText(r.number) : 'sig:'+hashStr(ekSig(r.items));
function ekLineKey(l){
  if(l.offer) return l.offer;
  const e = ES.ekEvents[l.eventId];   // Positionen aus v47/v48 ohne Schlüssel: gehören zur Angebotsnummer der Veranstaltung
  return l.src==='angebot' && e && e.offerNo ? 'nr:'+normText(e.offerNo) : '';
}
function ekOfferOwner(key, r){
  const l = live('ekLines').find(x=>!x.list && ekLineKey(x)===key && ES.ekEvents[x.eventId] && !ES.ekEvents[x.eventId].deleted);
  if(l) return ES.ekEvents[l.eventId];
  // ältere Veranstaltung ohne Positionen, aber mit derselben Angebotsnummer
  return r.number ? live('ekEvents').find(e=>normText(e.offerNo)===normText(r.number)) || null : null;
}
/* replaceAll: Angebot mit neuer Nummer ersetzt alle bisherigen Angebotspositionen der Veranstaltung (Wunsch Thomas).
   off: Angaben aus dem Angebot (Veranstaltungsdatum) für Korrekturen. */
function ekPutOffer(ev, r, key, opt={}){
  const old = ekLinesOf(ev.id).filter(l=> opt.replaceAll ? !!ekLineKey(l) : ekLineKey(l)===key);
  if(old.length && ekLineKey(old[0])===key && old.every(l=>ekLineKey(l)===key) && ekSig(old)===ekSig(r.items)) return 'same';
  const keep = new Map(old.filter(l=>l.how && !['Regel','exakt','ähnlich','Pauschale',''].includes(l.how)).map(l=>[normText(l.desc), l]));
  const start = old.length ? Math.min(...old.map(l=>l.pos||0))-1 : ekLinesOf(ev.id).reduce((m,l)=>Math.max(m, l.pos||0), 0);
  old.forEach(l=>del('ekLines', l.id));
  r.items.forEach((it,i)=>{ const nl = ekLineFrom(it, r.party||ev.party||'', ev.id, start+i+1); nl.offer = key; nl.oq = nl.qty;
    const k = keep.get(normText(it.desc)); if(k){ nl.articleId = k.articleId; nl.how = k.how; }
    put('ekLines', nl); });
  if(r.number && (opt.replaceAll || !ev.offerNo)) ev.offerNo = r.number;
  if(!ev.party && r.party) ev.party = r.party;
  ev.note = ''; ev.dateMsg = '';
  // Korrektur mit anderem Veranstaltungsdatum: übernehmen (Wunsch Thomas)
  if(old.length && opt.off && opt.off.eventDate && opt.off.eventDate!==ev.date){ ev.dateMsg = ` Datum geändert: ${dDE(ev.date)} → ${dDE(opt.off.eventDate)}.`; ev.date = opt.off.eventDate; }
  if(opt.off && opt.off.from && opt.off.to && (!ev.from || old.length)){ if(old.length && (ev.from!==opt.off.from || ev.to!==opt.off.to) && ev.from) ev.dateMsg = (ev.dateMsg||'') + ` Mietzeitraum jetzt ${dDE(opt.off.from)} – ${dDE(opt.off.to)}.`; ev.from = opt.off.from; ev.to = opt.off.to; }
  if(old.length && rvActive(ev)){ put('ekEvents', ev); rvTake(ev.id); ev.dateMsg = (ev.dateMsg||'') + ' Reservierung angepasst.'; }
  put('ekEvents', ev);
  // Schon aus dem Lager entnommen: Entnahme an den neuen Bedarf anpassen
  ev.retook = false;
  if(old.length && ev.took){ ekTookMv(ev.id).forEach(m=>del('movements', m.id)); ev.took = null; put('ekEvents', ev); ekTake(ev.id, true); ev.retook = true; }
  return old.length ? 'updated' : 'added';
}
const ekOfferMsg = (res, ev, r, n) => res==='same' ? `Angebot${r.number?' '+r.number:''} ist schon eingelesen (${ev.name}). Nichts verdoppelt.`
  : (res==='updated' ? `Angebot${r.number?' '+r.number:''}: Positionen in „${ev.name}“ ersetzt.` : `${n} Positionen aus dem Angebot übernommen.`)
    + (ev.dateMsg||'') + (ev.retook ? ' Entnahme aus dem Lager angepasst.' : '');
/* Angebot in eine (von Hand angelegte) Veranstaltung einlesen: Positionen kommen dazu, Name und Datum bleiben.
   Die Datei bleibt, wo sie ist (keine Kopie in der Dropbox). */
async function ekIntoEvent(file, id){
  const e = ES.ekEvents[id]; if(!e) return;
  const {r, off} = await ekReadOffer(file);
  if(!r.items.length){ toast('Im Angebot wurden keine Positionen erkannt. Bitte von Hand ergänzen.'); return; }
  const key = ekKeyOf(r), owner = ekOfferOwner(key, r);
  if(owner && owner.id!==id){ toast(`Angebot${r.number?' '+r.number:''} gehört schon zur Veranstaltung „${owner.name}“. Nicht doppelt eingelesen.`); return; }
  // Hat die Veranstaltung schon ein anderes Angebot: das neue ersetzt alle Angebotspositionen (Positionen von Hand bleiben)
  const hasOther = ekLinesOf(id).some(l=>ekLineKey(l) && ekLineKey(l)!==key);
  const res = ekPutOffer(e, r, key, {replaceAll: hasOther, off: {...off, eventDate: hasOther || ekLinesOf(id).some(l=>ekLineKey(l)===key) ? off.eventDate : ''}});
  if(res!=='same'){ e.file = file.name; put('ekEvents', e); }   // Original bleibt, wo es liegt; keine Kopie
  persist();
  toast(ekOfferMsg(res, e, r, r.items.length));
}
async function ekFromFile(file, dbxPath){
  const {r, off} = await ekReadOffer(file);
  const key = ekKeyOf(r), owner = r.items.length ? ekOfferOwner(key, r) : null;
  if(owner){ const res = ekPutOffer(owner, r, key, {off});
    // Datei merken, damit derselbe Ablageort beim nächsten Prüfen nicht noch einmal gelesen wird
    if(dbxPath && normText(dbxPath)!==normText(owner.file||'')){ owner.seen = [...new Set([...(owner.seen||[]), dbxPath])]; put('ekEvents', owner); }
    persist(); ekLastMsg = ekOfferMsg(res, owner, r, r.items.length); return owner; }
  const baseName = off.title || r.party || file.name.replace(/\.[^.]+$/,'');
  const ev = put('ekEvents', {id:uid(), name: baseName, date: off.eventDate || r.date || today(), from: off.from||'', to: off.to||'',
    party: r.party||'', offerNo: r.number||'', file: dbxPath||file.name||'', note: r.items.length ? '' : 'Angebot nicht lesbar. Positionen bitte von Hand ergänzen.'});
  if(r.items.length) ekPutOffer(ev, r, key);
  persist(); ekLastMsg = `Angebot eingelesen: ${ev.name}`;
  return ev;
}
function ekRefresh(){ if(view==='einkauf' && !isTyping()) $('#view').innerHTML = vEinkauf(); else if(view==='einkauf'){ const m=$('#ekScanMsg'); if(m) m.textContent=ekScanMsg; } }

      <div class="grid"><label class="f">Name<input id="ek-name" required placeholder="z. B. Sommerfest Firma X"></label>
        <label class="f">Datum<input type="date" id="ek-date" required value="${today()}"></label>
        <label class="f">Kunde (optional)<input id="ek-party"></label></div>
      <div class="row"><button class="btn primary" type="submit">Anlegen</button><button class="btn" type="button" data-act="ekCancelNew">Abbrechen</button></div></form>`:''}
    <div class="panel row spread"><span class="small muted">Angebot (PDF) auswählen, z. B. direkt aus eurem Angebotsordner in der Dropbox. Die App legt die Veranstaltung an. Ist das Angebot schon eingelesen, aktualisiert sie die vorhandene Veranstaltung.</span>
      <button class="btn primary" data-act="ekImportNew">Angebot einlesen</button></div>`;
}
function vEinkauf(){

  const up = evs.filter(e=>(e.date||'')>=today()), past = evs.filter(e=>(e.date||'')<today()).reverse();
  const card = e => { const c=ekCalc(e.id), n=ekLinesOf(e.id).length;
    const pill = c.open ? `<span class="pill warn">${c.open} zuordnen</span>` : c.buyRows.length ? `<span class="pill">${c.buyRows.length} einkaufen</span>` : n ? '<span class="pill ok">alles im Lager</span>' : '<span class="pill">leer</span>';
    return `<button class="item-card" data-act="ekOpen" data-id="${e.id}"><span><b>${esc(e.name)}</b><br><span class="small muted">${dWD(e.date)}${e.party&&e.party!==e.name?' · '+esc(e.party):''}${e.offerNo?' · '+esc(e.offerNo):''} · ${n} Pos.</span></span>${pill}</button>`; };
  return `<div class="stack">
    <div class="row spread"><div><div class="eyebrow">Bedarf &amp; Einkaufslisten</div><h1>Einkauf</h1></div>
