    ${past.length?`<details class="grp"><summary><span class="grp-h">Vergangene</span><span class="small muted num">${past.length}</span></summary><div class="stack" style="gap:8px;padding:10px">${past.map(card).join('')}</div></details>`:''}
  </div>`;

let ekOptCache = null;
function ekOptions(sel){
  if(!ekOptCache){
    const arts = live('articles').sort((a,b)=>(a.category||'~').localeCompare(b.category||'~')||a.name.localeCompare(b.name));
    let og='', h='';
    for(const a of arts){ const c=a.category||'ohne Gruppe'; if(c!==og){ h += (og?'</optgroup>':'')+`<optgroup label="${esc(c)}">`; og=c; }
      h += `<option value="${a.id}">${esc(a.name)}${kindOf(a)==='leistung'?' · Leistung':''}</option>`; }
    ekOptCache = h + (og?'</optgroup>':'');
  }
  return `<option value="" ${!sel?'selected':''} disabled>Lagerartikel wählen …</option><option value="skip" ${sel==='skip'?'selected':''}>— nicht berücksichtigen —</option>` +
    (sel && S.articles[sel] ? ekOptCache.replace(`value="${sel}"`, `value="${sel}" selected`) : ekOptCache);
}
function vEkEvent(){
  const e = ES.ekEvents[ekId];
  if(!e || e.deleted){ view='einkauf'; return vEinkauf(); }
  ekOptCache = null;
  const lines = ekLinesOf(e.id), c = ekCalc(e.id), st = stockMap();
  const lineHtml = l => { const a=S.articles[l.articleId]; const sure=ekSure(l);
    const pill = l.articleId==='skip' ? '<span class="pill">nicht berücksichtigt</span>'
      : !l.articleId || !a ? '<span class="pill warn">zuordnen</span>'
      : l.how==='ähnlich' ? `<button class="btn sm primary" data-act="ekOk" data-id="${l.id}">✓ passt</button>`
      : kindOf(a)==='leistung' && EK_SKIP_UNITS.test(l.unit||'') ? '<span class="pill">Pauschale, kein Einkauf</span>'
      : `<span class="pill ok">${esc(l.how||'zugeordnet')}</span>${kindOf(a)==='leistung'?' <span class="pill">Leistung</span>':''}`;
    return `<div class="ek-line ${sure?'':'need'}">
      <div class="ek-desc">${l.desc?esc(l.desc):'<span class="muted">Position von Hand</span>'} ${pill}</div>
      <label class="f ek-art"><span class="sr">Lagerartikel</span><select data-ekl="articleId" data-id="${l.id}" ${l.articleId?'':'class="need"'}>${ekOptions(l.articleId)}</select></label>
      <label class="f ek-qty"><span class="sr">Menge</span><input data-ekl="qty" data-id="${l.id}" inputmode="decimal" value="${l.qty?fmt(l.qty,3):''}" placeholder="Menge"></label>
      <span class="small muted ek-unit">${esc(a ? uL(a, l.qty) : l.unit)}${a ? `<br>Lager ${fmt(st[a.id]||0,3)}` : ''}</span>
      <button class="btn sm danger ek-del" data-act="ekDelLine" data-id="${l.id}" aria-label="Position entfernen">✕</button></div>`; };
  // Einkaufsliste: berechnete Zeilen mit änderbarer Menge, dazu von Hand ergänzte Positionen
  const shown = c.rows.filter(r=>r.buy>0 || r.addId);

/* Hinweis: Was andere Veranstaltungen von den hier gebrauchten Artikeln schon entnommen bzw. reserviert haben */
function ekOtherTookHtml(id, c){
  const e = ES.ekEvents[id], ids = new Set(c.rows.flatMap(r=>r.famIds||[])), out = [];
  for(const o of live('ekEvents')){ if(o.id===id) continue;
    const per = {}; ekTookMv(o.id).filter(m=>ids.has(m.articleId)).forEach(m=>per[m.articleId]=(per[m.articleId]||0)-Number(m.qty||0));
    if(rvActive(o) && rvOverlap(e, o)) Object.entries(o.rv.items||{}).filter(([a])=>ids.has(a)).forEach(([a,q])=>per[a]=(per[a]||0)+Number(q));
    const parts = Object.entries(per).filter(([,q])=>q>0).map(([a,q])=>`${fmt(q,3)} ${esc(uL(S.articles[a],q))} ${esc(S.articles[a]?.name||'')}`);
    if(parts.length) out.push(`<div class="small muted">Für <b>${esc(o.name)}</b> (${dDE(o.date)}) schon entnommen: ${parts.join(', ')}</div>`);
  }
  return out.join('');
}
/* Einkaufsliste als PDF (jsPDF, Standardschrift mit Umlauten). Spalten: Artikel, Bedarf, Einkaufen, Einheit, Abhaken. */
async function ekPdf(id){
  const e = ES.ekEvents[id], c = ekCalc(id);
  await loadScript(JSPDF);
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
  const W=210, L=15, R=W-15; let y=18;
  const cols = {art:L, need:118, buy:150, unit:166, box:R-5};
  const head = () => { doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(90);
    doc.text('Artikel', cols.art, y); doc.text('Bedarf', cols.need+25, y, {align:'right'}); doc.text('Einkaufen', cols.buy+12, y, {align:'right'}); doc.text('Einheit', cols.unit, y);
    doc.setDrawColor(180); doc.line(L, y+1.5, R, y+1.5); doc.setTextColor(0); y+=6; };
  const need = h => { if(y+h > 282){ doc.addPage(); y=18; head(); } };
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('Einkaufsliste', L, y); y+=8;
  doc.setFontSize(12); doc.text(e.name, L, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text([dWD(e.date), e.party && e.party!==e.name ? e.party : '', e.offerNo ? 'Angebot '+e.offerNo : ''].filter(Boolean).join('  ·  '), L, y); y+=5;
  doc.setTextColor(110); doc.text(`Erstellt ${new Date().toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'})} · Lagerstand berücksichtigt`, L, y); doc.setTextColor(0); y+=4;
  if(c.open){ y+=3; doc.setTextColor(170,90,0); doc.text(`Achtung: ${c.open} Position${c.open>1?'en':''} aus dem Angebot noch nicht zugeordnet, nicht enthalten.`, L, y); doc.setTextColor(0); y+=2; }
  y+=8; head();
  let cat='', sec='';
  for(const r of c.buyRows){
    if(r.sec!==sec){ need(24);
      if(sec){ y+=3; doc.setDrawColor(40); doc.setLineWidth(0.6); doc.line(L, y-4, R, y-4); doc.setLineWidth(0.2); y+=4; }
      sec=r.sec; cat=''; doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(sec==='ware'?'Waren':'Leistungen', L, y); y+=6.5; }
    if(r.cat!==cat){ need(14); cat=r.cat; y+=2; doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(cat, L, y); y+=5.5; }
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const nameLines = doc.splitTextToSize(r.art.name, cols.need - L - 4);
    const h = Math.max(7, nameLines.length*4.6+2.4); need(h);
    doc.text(nameLines, cols.art, y);
    if(r.needText) doc.text(r.needText, cols.need+25, y, {align:'right'});
    doc.setFont('helvetica','bold'); doc.text(fmt(r.buy,3), cols.buy+12, y, {align:'right'}); doc.setFont('helvetica','normal');
    doc.text(r.unit||'', cols.unit, y);
    doc.setDrawColor(60); doc.rect(cols.box, y-3.6, 4.5, 4.5);
    doc.setDrawColor(225); doc.line(L, y+h-5.2, R, y+h-5.2);
    y += h;
  }
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(130); doc.text(`B&B · ${e.name} · Seite ${i} von ${n}`, L, 290); }
  const blob = doc.output('blob');
  const fname = `Einkaufsliste_${e.date}_${e.name.replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_').slice(0,60)}.pdf`;
  const file = new File([blob], fname, {type:'application/pdf'});
  let where = 'PDF erstellt.';
  if(DBX.connected){ try{ await DBX.upload(P('Einkauf/'+fname), blob, 'overwrite'); where = `Abgelegt in Dropbox: Einkauf/${fname}`; }catch(err){ where = 'Dropbox-Ablage fehlgeschlagen: '+err.message; } }
  ekPdfOut = {id, file, url: URL.createObjectURL(blob), where, share: !!(navigator.canShare && navigator.canShare({files:[file]}))};
  return ekPdfOut;
}

/* ===================== Reservierungen ===================== */
/* Leistungen (Geräte, Gläser, Zelte …) einer Veranstaltung für ihren Zeitraum von–bis (Mietzeitraum, sonst Datum).
   Gleiche Bedarfsliste wie Einkauf/Packliste (ekLines), dazu Leistungen aus Produktgruppen.
   „Aus Lager entnehmen“ (e.rv) bucht die Leistungen aus und gibt der Veranstaltung Vorrang; nach Ende des Zeitraums
   ist es automatisch zurück (Rückgabe ist schon beim Entnehmen auf den Tag nach dem Zeitraum gebucht). Buchungen mit fester ID (rv|Veranstaltung|Artikel|out/back), damit zwei
   Geräte nichts doppelt buchen. Konflikt: im Zeitraum mehr gebraucht, als nach den Entnahmen anderer frei ist. */
let rvId = null;
const rvFrom = e => e.from || e.date || '';
const rvTo = e => e.to || e.date || rvFrom(e);
const rvOverlap = (a, b) => rvFrom(a) <= rvTo(b) && rvFrom(b) <= rvTo(a);
const rvDone = e => !!(e && e.rv && (e.rv.back || rvTo(e) < today()));   // Zeitraum vorbei: wieder im Lager
const rvActive = e => !!(e && e.rv && !rvDone(e));
const dayAfter = d => { const x=new Date(d+'T12:00'); x.setDate(x.getDate()+1); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
/* Bedarf an Leistungen je Artikel (ohne Pauschalen/Stunden; Produktgruppen-Leistungen mitgerechnet) */
function rvNeed(id){
  const need = {}, from = {};
  for(const l of ekLinesOf(id)){
    if(!ekSure(l) || l.articleId==='skip') continue;
    const a = S.articles[l.articleId], q = Number(l.qty)||0; if(!(q>0)) continue;
    if(kindOf(a)==='leistung' && !EK_SKIP_UNITS.test(l.unit||'')) need[a.id] = (need[a.id]||0) + q;
    for(const {m, qty} of pgMembers(a.id)) if(kindOf(m)==='leistung'){ need[m.id] = (need[m.id]||0) + q*qty; (from[m.id] = from[m.id]||new Set()).add(a.name); }
  }
  return {need, from};
}
/* Eigenes Lager eines Geräts = Bestand + alles, was gerade für Veranstaltungen draußen ist */
function rvOwned(){
  // Eigener Gerätebestand ohne Reservierungsbuchungen (die stecken als Entnahmen anderer in rvOthers)
  const own = {}, t = today();
  for(const mv of live('movements')) if(!mv.rvId && (!mv.date || mv.date<=t)) own[mv.articleId] = (own[mv.articleId]||0) + Number(mv.qty||0);
  return own;
}
/* Was andere Veranstaltungen im selben Zeitraum schon entnommen haben (Vorrang) bzw. nur geplant haben */
function rvOthers(id){
  const e = ES.ekEvents[id], taken = {}, planned = {}, by = {};
  for(const o of live('ekEvents')){ if(o.id===id || !rvOverlap(e, o)) continue;
    if(rvActive(o)) for(const [a,q] of Object.entries(o.rv.items||{})){ taken[a] = (taken[a]||0) + Number(q||0); (by[a] = by[a]||[]).push({e:o, q:Number(q||0), taken:true}); }
    else if(!o.rv && rvTo(o) >= today()) for(const [a,q] of Object.entries(rvNeed(o.id).need)){ planned[a] = (planned[a]||0) + q; (by[a] = by[a]||[]).push({e:o, q, taken:false}); }
  }
  return {taken, planned, by};
}
function rvCalc(id){
  const e = ES.ekEvents[id], {need, from} = rvNeed(id), own = rvOwned(), o = rvOthers(id);
  const rows = Object.entries(need).map(([aid, q])=>{ const a = S.articles[aid];
    const free = Math.max(0, (own[aid]||0) - (o.taken[aid]||0));
    const mine = e.rv && e.rv.items ? Number(e.rv.items[aid]||0) : 0;
    // Konflikt (rot): andere Veranstaltungen im Zeitraum haben schon entnommen und es reicht deshalb nicht.
    // Zu wenig im Lager insgesamt (orange): Rest über die Einkaufsliste besorgen.
    const conflict = q > free + 1e-9 && (o.taken[aid]||0) > 0;
    return {a, need:q, free, own: Math.max(0, own[aid]||0), mine, conflict, short: !conflict && q > free + 1e-9, tight: !rvActive(e) && q <= free + 1e-9 && q + (o.planned[aid]||0) > free + 1e-9,
      others: o.by[aid]||[], from: from[aid] ? [...from[aid]] : [], cat: a.category||'ohne Gruppe'}; });
  rows.sort((x,y)=>x.cat.localeCompare(y.cat,'de')||x.a.name.localeCompare(y.a.name,'de'));
  const changed = rvActive(e) && rows.some(r=>Math.abs(Math.min(r.need, r.free) - r.mine)>1e-9) || (rvActive(e) && Object.keys(e.rv.items||{}).some(a=>!need[a]));
  return {rows, conflicts: rows.filter(r=>r.conflict), tight: rows.filter(r=>r.tight), changed, open: ekOpenCount(id)};
}
const rvMvId = (id, a, k) => `rv|${id}|${a}|${k}`;
/* Entnahme nur für den Zeitraum (Wunsch Thomas): Abgang am ersten Tag, Rückgabe am Tag nach dem Ende, beide sofort gebucht.
   Der Bestand sinkt damit erst im Zeitraum und ist danach von selbst wieder da. */
function rvTake(id){
  const e = ES.ekEvents[id]; if(!e) return;
  const at = e.rv && !e.rv.back ? e.rv.at : now();
  if(e.rv) rvUntake(id, true);
  const c = rvCalc(id), items = {}, d0 = rvFrom(e), d1 = dayAfter(rvTo(e));
  for(const r of c.rows){ const q = Math.min(r.need, r.free); if(q>0){ items[r.a.id] = q;
    put('movements', {id:rvMvId(id, r.a.id, 'out'), articleId:r.a.id, qty:-q, type:'manual', reason:'Reservierung (Abgang)', date:d0, note:e.name, rvId:id});
    put('movements', {id:rvMvId(id, r.a.id, 'back'), articleId:r.a.id, qty:q, type:'manual', reason:'Reservierung (zurück)', date:d1, note:e.name, rvId:id}); } }
  e.rv = {at, items, v:2}; put('ekEvents', e); persist();
  return c;
}
function rvUntake(id, quiet){
  const e = ES.ekEvents[id]; if(!e || !e.rv) return;
  for(const a of Object.keys(e.rv.items||{})) for(const k of ['out','back']){ const m = S.movements[rvMvId(id,a,k)]; if(m && !m.deleted) del('movements', m.id); }
  e.rv = null; put('ekEvents', e); persist();
  if(!quiet) toast('Entnahme zurückgenommen, Geräte wieder im Lager.');
}
/* Entnahmen aus v54 (sofort gebucht, Rückgabe per Hintergrundlauf) auf Zeitraum-Buchungen umstellen */
function rvAutoReturn(){
  let n = 0;
  for(const e of live('ekEvents')){ if(!e.rv || e.rv.v===2) continue;
    if(e.rv.back){ e.rv = {...e.rv, v:2}; put('ekEvents', e); } else rvTake(e.id);
    n++; }
  if(n) persist();
  return n;
}
function rvStatus(e, c){
  if(c.conflicts.length && !rvDone(e)) return '<span class="pill bad">ACHTUNG Konflikt</span>';
  if(rvDone(e)) return '<span class="pill">zurück im Lager</span>';
  if(e.rv) return rvFrom(e) > today() ? `<span class="pill ok">entnommen ab ${dDE(rvFrom(e)).slice(0,6)}</span>` : '<span class="pill ok">entnommen</span>';
  if(!c.rows.length) return '<span class="pill">keine Leistungen</span>';
  return c.tight.length || c.rows.some(r=>r.short) ? '<span class="pill warn">reserviert, knapp</span>' : '<span class="pill ok">reserviert</span>';
}
const rvSpan = e => rvFrom(e)===rvTo(e) ? dWD(rvFrom(e)) : `${dDE(rvFrom(e))} – ${dDE(rvTo(e))}`;
function vReserv(){
  const evs = live('ekEvents').sort((a,b)=>rvFrom(a).localeCompare(rvFrom(b))||a.name.localeCompare(b.name));
  const up = evs.filter(e=>rvTo(e)>=today()), past = evs.filter(e=>rvTo(e)<today()).reverse();
  const card = e => { const c = rvCalc(e.id);
    return `<button class="item-card ${c.conflicts.length && !rvDone(e)?'bad':''}" data-act="rvOpen" data-id="${e.id}"><span><b>${esc(e.name)}</b><br><span class="small muted">${rvSpan(e)}${e.party&&e.party!==e.name?' · '+esc(e.party):''} · ${c.rows.length} Leistungen</span></span>${rvStatus(e, c)}</button>`; };
  return `<div class="stack">
    <div class="row spread"><div><div class="eyebrow">Geräte &amp; Leistungen</div><h1>Reservierungen</h1></div>
      <button class="btn primary" data-act="ekNew">+ Veranstaltung</button></div>
    ${ekNewAndScanHtml()}
    <div class="stack" style="gap:8px">${up.map(card).join('') || '<div class="panel empty">Keine kommenden Veranstaltungen.</div>'}</div>
    ${past.length?`<details class="grp"><summary><span class="grp-h">Vergangene</span><span class="small muted num">${past.length}</span></summary><div class="stack" style="gap:8px;padding:10px">${past.map(card).join('')}</div></details>`:''}
  </div>`;
}
let rvOptCache = null;
function rvOptions(sel){
  if(!rvOptCache){ let og='', h='';
    for(const a of live('articles').filter(a=>kindOf(a)==='leistung').sort((a,b)=>(a.category||'~').localeCompare(b.category||'~')||a.name.localeCompare(b.name))){
      const c=a.category||'ohne Gruppe'; if(c!==og){ h += (og?'</optgroup>':'')+`<optgroup label="${esc(c)}">`; og=c; } h += `<option value="${a.id}">${esc(a.name)}</option>`; }
    rvOptCache = h + '</optgroup>'; }
  return `<option value="" ${!sel?'selected':''} disabled>Leistung wählen …</option>` + (sel && S.articles[sel] ? rvOptCache.replace(`value="${sel}"`, `value="${sel}" selected`) : rvOptCache);
}
function vRvEvent(){
  const e = ES.ekEvents[rvId];
  if(!e || e.deleted){ view='reserv'; return vReserv(); }
  rvOptCache = null;
  const c = rvCalc(e.id), st = stockMap();
  // Bearbeitbare Zeilen: Bedarfspositionen mit Leistung (oder noch ohne Artikel, von Hand hier angelegt)
  const lines = ekLinesOf(e.id).filter(l=>{ const a=S.articles[l.articleId]; return (a && kindOf(a)==='leistung' && !EK_SKIP_UNITS.test(l.unit||'')) || (!l.articleId && l.src==='reserv'); });
  const row = r => { const l = lines.find(x=>x.articleId===r.a.id);
    return `<div class="rv-row ${r.conflict?'bad':''}">
      <div class="ek-bname"><b>${esc(r.a.name)}</b>${r.from.length?`<br><span class="small muted">aus Produktgruppe ${r.from.map(esc).join(', ')}</span>`:''}</div>
      ${l ? `<input class="ek-bqty" data-ekl="qty" data-id="${l.id}" inputmode="decimal" value="${fmt(r.need,3)}" aria-label="Menge">` : `<span class="ek-bqty num"><b>${fmt(r.need,3)}</b></span>`}
      <span class="small">${esc(uL(r.a, r.need))}<br><span class="muted">frei ${fmt(r.free,3)}</span></span>

      ${r.conflict ? `<div class="rv-alert">ACHTUNG! ${fmt(r.need,3)} gebraucht, nur ${fmt(r.free,3)} frei. ${r.others.filter(x=>x.taken).map(x=>`${fmt(x.q,3)} bei „${esc(x.e.name)}“ (${rvSpan(x.e)}) entnommen`).join(', ')}</div>`

/* ===================== Packliste ===================== */
/* Packliste je Veranstaltung (dieselben Veranstaltungen wie Einkauf): alle Angebotspositionen in voller Menge
   (ohne Pauschalen/Stunden) plus die Artikel ihrer Produktgruppen (Menge je Einheit × Angebotsmenge).
   Von Hand änderbar (ekLines list:'pkset' / 'pkadd'), abhakbar (ekLines list:'pkcheck', feste ID je Zeile, damit
   mehrere Geräte gleichzeitig abhaken können). Bucht nichts. */
let pkId = null, pkPdfOut = null;
function pkCalc(id){
  const map = new Map();
  const add = (a, q, from) => { if(!a || a.deleted || !(q>0)) return; let r = map.get(a.id);
    if(!r){ r = {key:a.id, art:a, qty:0, from:new Set()}; map.set(a.id, r); }
    r.qty = Math.round((r.qty+q)*1000)/1000; if(from) r.from.add(from); };
  for(const l of ekLinesOf(id)){
    if(!ekSure(l) || l.articleId==='skip') continue;
    const a = S.articles[l.articleId], q = Number(l.qty)||0; if(!(q>0)) continue;
    if(!(kindOf(a)==='leistung' && EK_SKIP_UNITS.test(l.unit||''))) add(a, q, null);
    for(const {m, qty} of pgMembers(a.id)) add(m, q*qty, a.name);   // auch bei Pauschalen (z. B. Gastro Equipment)
  }
  const rows = [...map.values()].map(r=>({...r, calc:r.qty}));
  for(const l of ekAllOf(id).filter(x=>x.list==='pkset')){ const r = rows.find(x=>x.key===l.articleId); if(r){ r.qty = Math.max(0, Number(l.qty)||0); r.setId = l.id; } }
  for(const l of ekAllOf(id).filter(x=>x.list==='pkadd').sort((x,y)=>(x.pos||0)-(y.pos||0))){
    const a = S.articles[l.articleId];
    rows.push({key:l.id, art: a || {id:'', name:l.name||''}, qty:Number(l.qty)||0, from:new Set(), addId:l.id, line:l, calc:0}); }
  const checks = {}; ekAllOf(id).filter(x=>x.list==='pkcheck').forEach(x=>checks[x.key]=x);
  rows.forEach(r=>{ const a = r.art.id ? S.articles[r.art.id] : null;
    r.sec = a && kindOf(a)==='leistung' ? 'leistung' : 'ware'; r.cat = r.addId ? 'Zusätzlich' : (a.category||'ohne Gruppe');
    r.unit = r.addId && r.line.unit ? r.line.unit : (a ? uL(a, r.qty) : ''); const ck = checks[r.key];
    // Haken gilt nur für die Menge, die beim Abhaken galt; ändert sich die Menge (z. B. korrigiertes Angebot), neu packen
    r.on = !!(ck && ck.on && (ck.q==null || Math.abs(Number(ck.q)-r.qty)<1e-9)); r.recheck = !!(ck && ck.on && !r.on); });
  rows.sort((x,y)=>(x.sec==='leistung')-(y.sec==='leistung')||(x.cat==='Zusätzlich')-(y.cat==='Zusätzlich')||x.cat.localeCompare(y.cat,'de')||(x.addId?(x.line.pos||0)-(y.line.pos||0):x.art.name.localeCompare(y.art.name,'de')));
  const list = rows.filter(r=>r.qty>0 && (r.art.name||'').trim());
  return {rows, list, removed: rows.filter(r=>r.setId && !r.qty), done: list.filter(r=>r.on).length, open: ekOpenCount(id)};
}
function pkSet(id, artId, qty){
  let l = ekAllOf(id).find(x=>x.list==='pkset' && x.articleId===artId);
  if(!l) l = {id:uid(), eventId:id, list:'pkset', articleId:artId, desc:'', unit:'', how:'manuell', src:'packliste', pos:0};
  l.qty = qty; put('ekLines', l); persist();
}
function pkCheck(id, key, on, qty){
  const cid = 'pk|'+id+'|'+key;   // feste ID: zwei Geräte haken dieselbe Zeile, kein Doppel
  const l = ES.ekLines[cid] || {id:cid, eventId:id, list:'pkcheck', key, desc:'', qty:0, unit:'', articleId:'', how:'', src:'packliste', pos:0};
  l.on = on; l.q = on ? qty : null; l.deleted = false; put('ekLines', l); persist();
}

    ${past.length?`<details class="grp"><summary><span class="grp-h">Vergangene</span><span class="small muted num">${past.length}</span></summary><div class="stack" style="gap:8px;padding:10px">${past.map(card).join('')}</div></details>`:''}

        ${S.articles[r.line.articleId]?'':`<input data-pka="name" data-id="${r.addId}" value="${esc(r.line.name||'')}" placeholder="Was muss mit?">`}</div>
        <input class="ek-bqty" data-pka="qty" data-id="${r.addId}" inputmode="decimal" value="${r.qty?fmt(r.qty,3):''}" placeholder="Menge" aria-label="Menge">

    : `<div class="pk-row ${r.on?'on':''}"><input type="checkbox" data-pkc="${r.key}" ${r.on?'checked':''} aria-label="gepackt">

        <input class="ek-bqty" data-pkq="${r.key}" inputmode="decimal" value="${fmt(r.qty,3)}" aria-label="Menge">
        <span class="ek-bunit small">${esc(r.unit)}</span>
        ${r.setId?`<button class="btn sm" data-act="pkReset" data-id="${r.setId}" aria-label="Zurück zur berechneten Menge">↺</button>`:`<button class="btn sm danger" data-act="pkRemove" data-art="${r.key}" aria-label="Von der Liste nehmen">✕</button>`}</div>`;
  return `<div class="stack">
    <div><a href="#" data-go="packliste" class="back"><span aria-hidden="true">‹</span> Alle Veranstaltungen</a></div>
    <div><div class="eyebrow">${dWD(e.date)}${e.offerNo?' · Angebot '+esc(e.offerNo):''}</div><h1>${esc(e.name)}</h1></div>
    ${c.open?`<div class="note">${c.open} Angebotsposition${c.open>1?'en sind':' ist'} noch nicht zugeordnet und fehlt hier. Zuordnen unter <a href="#" data-act="ekOpen" data-id="${e.id}">Einkauf</a>.</div>`:''}
    <div class="panel stack">

        <button class="btn primary" data-act="pkPdf" ${c.list.length?'':'disabled'}>PDF erstellen</button></div>
      ${groups.length ? groups.map((g,i)=>`${i===0||groups[i-1].sec!==g.sec?`${i?'<hr class="ek-sep">':''}<h3 class="ek-sec">${g.sec==='ware'?'Waren':'Leistungen'}</h3>`:''}
        <div><div class="eyebrow" style="margin:6px 0 4px">${esc(g.cat)}</div><div class="ek-buy">${g.rows.map(row).join('')}</div></div>`).join('')

      <div class="row"><button class="btn sm" data-act="pkAdd">+ Position zur Packliste</button></div>
      ${pkPdfOut && pkPdfOut.id===e.id ? `<div class="row" style="gap:8px"><span class="small muted">${esc(pkPdfOut.where)}</span>

async function pkPdf(id){
  const e = ES.ekEvents[id], c = pkCalc(id);
  await loadScript(JSPDF);
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
  const L=15, R=195; let y=18;
  const cols = {art:L, qty:150, unit:154, box:R-5};
  const head = () => { doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(90);
    doc.text('Artikel', cols.art, y); doc.text('Menge', cols.qty, y, {align:'right'}); doc.text('Einheit', cols.unit, y); doc.text('gepackt', R, y, {align:'right'});
    doc.setDrawColor(180); doc.line(L, y+1.5, R, y+1.5); doc.setTextColor(0); y+=6; };
  const need = h => { if(y+h > 282){ doc.addPage(); y=18; head(); } };
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('Packliste', L, y); y+=8;
  doc.setFontSize(12); doc.text(e.name, L, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text([dWD(e.date), e.party && e.party!==e.name ? e.party : '', e.offerNo ? 'Angebot '+e.offerNo : ''].filter(Boolean).join('  ·  '), L, y); y+=5;
  doc.setTextColor(110); doc.text(`Erstellt ${new Date().toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'})}`, L, y); doc.setTextColor(0); y+=4;
  if(c.open){ y+=3; doc.setTextColor(170,90,0); doc.text(`Achtung: ${c.open} Position${c.open>1?'en':''} aus dem Angebot noch nicht zugeordnet, nicht enthalten.`, L, y); doc.setTextColor(0); y+=2; }
  y+=8; head();
  let cat='', sec='';
  for(const r of c.list){
    if(r.sec!==sec){ need(24);
      if(sec){ y+=3; doc.setDrawColor(40); doc.setLineWidth(0.6); doc.line(L, y-4, R, y-4); doc.setLineWidth(0.2); y+=4; }
      sec=r.sec; cat=''; doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(sec==='ware'?'Waren':'Leistungen', L, y); y+=6.5; }
    if(r.cat!==cat){ need(14); cat=r.cat; y+=2; doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(cat, L, y); y+=5.5; }
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const nameLines = doc.splitTextToSize(r.art.name, cols.qty - L - 22);
    const sub = r.from.size ? doc.splitTextToSize('für '+[...r.from].join(', '), cols.qty - L - 22) : [];
    const h = Math.max(7, nameLines.length*4.6 + sub.length*3.8 + 2.4); need(h);
    doc.text(nameLines, cols.art, y);
    if(sub.length){ doc.setFontSize(8); doc.setTextColor(110); doc.text(sub, cols.art, y + nameLines.length*4.6 - 0.6); doc.setTextColor(0); doc.setFontSize(10); }
    doc.setFont('helvetica','bold'); doc.text(fmt(r.qty,3), cols.qty, y, {align:'right'}); doc.setFont('helvetica','normal');
    doc.text(r.unit||'', cols.unit, y);
    doc.setDrawColor(60); doc.rect(cols.box, y-3.6, 4.5, 4.5);
    if(r.on){ doc.setFont('helvetica','bold'); doc.text('x', cols.box+1.2, y); doc.setFont('helvetica','normal'); }
    doc.setDrawColor(225); doc.line(L, y+h-5.2, R, y+h-5.2);
    y += h;
  }
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(130); doc.text(`B&B · Packliste ${e.name} · Seite ${i} von ${n}`, L, 290); }
  const blob = doc.output('blob');
  const fname = `Packliste_${e.date}_${e.name.replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_').slice(0,60)}.pdf`;
  const file = new File([blob], fname, {type:'application/pdf'});
  let where = 'PDF erstellt.';
  if(DBX.connected){ try{ await DBX.upload(P('Packlisten/'+fname), blob, 'overwrite'); where = `Abgelegt in Dropbox: Packlisten/${fname}`; }catch(err){ where = 'Dropbox-Ablage fehlgeschlagen: '+err.message; } }
  pkPdfOut = {id, file, url: URL.createObjectURL(blob), where, share: !!(navigator.canShare && navigator.canShare({files:[file]}))};
}

/* ===================== Personal ===================== */
const ROLES = {gastro:'Gastronomie', technik:'Technik', aufbau:'Aufbauhelfer', abbau:'Abbauhelfer'};
const ROLE_SHORT = {gastro:'Gastro', technik:'Technik', aufbau:'Aufbau', abbau:'Abbau'};
/* Kategorien legt jedes Event selbst fest (ev.roles = [{id, name}]); ROLES sind nur Vorschläge und die Rollen der Personen.
   Vorschläge behalten ihren Schlüssel als id, damit Personen-Rollen passen; eigene Kategorien bekommen eine neue id.
   Ältere Events ohne roles haben die vier Vorschläge. */
const rolesOf = ev => ev && ev.roles ? ev.roles : Object.entries(ROLES).map(([id,name])=>({id,name}));
/* Kategorien eines Tages: day.cats (ids) wählt aus den Kategorien des Events aus; fehlt es, gelten alle */
const rolesOfDay = (ev, day) => rolesOf(ev).filter(r=>!day || !day.cats || day.cats.includes(r.id));
const roleName = (ev, r) => (rolesOf(ev).find(x=>x.id===r)||{}).name || ROLES[r] || r;
const STATUS = {angefragt:'angefragt', bestaetigt:'bestätigt', abgesagt:'abgesagt'};
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const wdOf = s => { const [y,m,d]=s.split('-').map(Number); return WD[new Date(y,m-1,d).getDay()]; };
const dWD = s => s ? wdOf(s)+', '+dDE(s) : '';
const dShort = s => s ? `${wdOf(s)}, ${s.slice(8,10)}.${s.slice(5,7)}.` : '';
const tSpan = (a,b) => a&&b ? `${a}–${b}` : (a||b||'');
const mins = t => { const m=/^(\d{1,2}):(\d{2})/.exec(t||''); return m ? Number(m[1])*60+Number(m[2]) : null; };
/* Dauer in Minuten, über Mitternacht gerechnet (z. B. 18:00–02:00) */
function dur(a,b){ const x=mins(a), y=mins(b); return x==null||y==null ? null : (y-x+1440)%1440; }
const hm = m => `${Math.floor(Math.abs(m)/60)}:${String(Math.abs(m)%60).padStart(2,'0')}`;
const hmSigned = m => (m>0?'+':m<0?'−':'±')+hm(m);
function addDays(s, n){ const [y,m,d]=s.split('-').map(Number); const x=new Date(y,m-1,d+n);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
const dayDiff = (a,b) => Math.round((Date.UTC(...b.split('-').map((x,i)=>i===1?x-1:+x)) - Date.UTC(...a.split('-').map((x,i)=>i===1?x-1:+x)))/864e5);
function dateRange(from, to){ const out=[]; if(!from) return out; to = to && to>from ? to : from;
  for(let s=from; s<=to && out.length<31; s=addDays(s,1)) out.push(s); return out; }
let pTile = null;   // aufgeklappte Rollen-Kachel im Event
let pSortTiles = false;   // Kategorien eines Events sortieren
let pEventId = null, pDayId = null, pEditEvent = false, pAddEvent = false, pEditPerson = null, pPastOpen = {}, pq = null;   // pPastOpen: aufgeklappte vergangene Jahre

/* Ein Event hat einen oder mehrere Tage (Unter-Events) mit eigenen Zeiten und eigenem Bedarf:
   days: [{id, date, start, end, need}]. Zusätzlich stehen date/dateEnd/start/end des ersten Tages am Event
   (für Listen und die spätere Material-Reservierung). Events ohne days gelten als ein Tag mit der id des Events. */
function daysOf(ev){
  if(ev.days && ev.days.length) return [...ev.days].sort((a,b)=>a.date.localeCompare(b.date));
  return [{id:ev.id, date:ev.date, start:ev.start||'', end:ev.end||'', need:ev.need||{}}];
}
const dayOf = (ev, a) => { const ds=daysOf(ev); return ds.find(d=>d.id===a.dayId) || ds[0]; };
const evFrom = ev => daysOf(ev)[0].date;
const evTo = ev => { const ds=daysOf(ev); return ds[ds.length-1].date; };
const asgOf = evId => live('assignments').filter(a=>a.eventId===evId);
const asgOfDay = (ev, day) => asgOf(ev.id).filter(a=>dayOf(ev,a).id===day.id);
const byDate = (a,b) => evFrom(a).localeCompare(evFrom(b)) || (daysOf(a)[0].start||'').localeCompare(daysOf(b)[0].start||'');
const personName = id => PS.persons[id] ? PS.persons[id].name : '(gelöscht)';
function evWhen(ev){
  const ds = daysOf(ev), d = ds[0];
  return ds.length>1 ? `${dShort(d.date)} – ${dWD(ds[ds.length-1].date)} · ${ds.length} Tage` : dWD(d.date)+(d.start?' · '+tSpan(d.start,d.end)+' Uhr':'');
}
/* Jede Rolle hat pro Tag eigene Zeiten (day.times[rolle] = {start,end}); fehlen sie, gilt die Zeit des Tages */
function roleTime(day, r){ const t=(day.times||{})[r]; return t && (t.start||t.end) ? t : {start:day.start||'', end:day.end||''}; }
const dayName = (day, i) => day.label || `Tag ${i+1}`;
/* Zeit des Tages = frühester Beginn bis spätestes Ende aller Rollen (über Mitternacht gerechnet) */
function deriveDayTimes(day){
  let s=null, e=null, sTxt='', eTxt='';
  for(const r of Object.keys(day.times||{})){ const t=day.times[r]; if(!t || !t.start) continue;
    const a=mins(t.start), b=a+(t.end ? dur(t.start,t.end) : 0);
    if(s==null || a<s){ s=a; sTxt=t.start; } if(t.end && (e==null || b>e)){ e=b; eTxt=t.end; } }
  day.start=sTxt; day.end=eTxt;
}
/* Der sinnvollste Tag zum Anzeigen: heute oder der nächste, sonst der erste */
const nextDay = ev => { const ds=daysOf(ev); return ds.find(d=>d.date>=today()) || ds[0]; };

/* Ampel: rot = Plätze offen (bestätigt + angefragt unter Bedarf), gelb = besetzt, aber jemand erst angefragt, grün = alles bestätigt */
function dayState(ev, day){
  const as = asgOfDay(ev, day), need = day.need||{};
  let open = 0;
  for(const {id:r} of rolesOfDay(ev, day)) open += Math.max(0, (Number(need[r])||0) - as.filter(a=>a.role===r && a.status!=='abgesagt').length);
  const req = as.filter(a=>a.status==='angefragt').length;
  const missingIst = day.date<today() ? as.filter(a=>a.status==='bestaetigt' && !(a.actualStart && a.actualEnd)).length : 0;
  return {open, req, missingIst, amp: open ? 'red' : req ? 'yellow' : 'green'};
}
/* Für das ganze Event zählen bei laufenden Events nur die kommenden Tage */
function evState(ev){
  const ds = daysOf(ev), rel = ds.filter(d=>d.date>=today()), use = rel.length ? rel : ds;
  let open=0, req=0, missingIst=0;
  for(const d of use){ const s=dayState(ev,d); open+=s.open; req+=s.req; }
  for(const d of ds) missingIst += dayState(ev,d).missingIst;
  return {open, req, missingIst, amp: open ? 'red' : req ? 'yellow' : 'green'};
}
/* Andere Events am selben Tag, in denen die Person angefragt oder bestätigt ist */
function conflicts(personId, date, eventId){
  const out = [];
  for(const a of live('assignments')){
    if(a.personId!==personId || a.eventId===eventId || a.status==='abgesagt') continue;
    const ev = PS.events[a.eventId]; if(!ev || ev.deleted) continue;
    const d = dayOf(ev, a);
    if(d.date===date) out.push({ev, day:d, a});
  }
  return out;
}
const conflictTxt = list => list.map(c=>`${esc(c.ev.name)} (${tSpan(c.a.planStart,c.a.planEnd)||'ganztags'})`).join(', ');

        const st=t.start||t.end ? t : (d.start||d.end) && n ? {start:d.start,end:d.end} : peMain;

      <div class="chips pd-add">${peRoles.filter(x=>d.cats && !d.cats.includes(x.id)).map(x=>`<button type="button" data-act="peDayAdd" data-r="${x.id}" data-date="${d.date}">+ ${esc(x.name||'…')}</button>`).join('')}
        <button type="button" data-act="peDayNew" data-date="${d.date}">+ Kategorie nur für diesen Tag</button></div>
    </fieldset>`).join('') + (multi ? `<button class="btn sm" type="button" data-act="peCopyDay1">Bedarf und Zeiten von Tag 1 auf alle Tage übertragen</button>` : '');

function peCollect(){
  if(!document.querySelector('#pe-days .pday')) return dateRange($('#pe-from').value, $('#pe-to').value).map(date=>({id:'', date, label:'', need:{}, times:{}, start:'', end:''}));
  return [...document.querySelectorAll('#pe-days .pday')].map(f=>{
    const need = {}, times = {};
    f.querySelectorAll('.prole[data-r]').forEach(row=>{ const r=row.dataset.r, n=parseInt(row.querySelector('.pd-need').value,10);
      const start=row.querySelector('.pd-start').value, end=row.querySelector('.pd-end').value;
      if(n>0) need[r]=n; if(start||end) times[r]={start,end}; });
    const cats = [...f.querySelectorAll('.prole[data-r]')].map(row=>row.dataset.r);
    const d = {id:f.dataset.id, date:f.dataset.date, label:f.querySelector('.pd-label').value.trim(), cats, need, times};
    deriveDayTimes(d); return d;
  });
}
/* Zeitraum geändert: gleiche Anzahl Tage = Event verschoben (Tage behalten ihre Einträge der Reihe nach), sonst nach Datum zuordnen */
function peRebuild(changed){
  const fi = $('#pe-from'), from = fi.value; let to = $('#pe-to').value;
  // „Von“ verschoben: „Bis“ wandert mit, die Länge des Events bleibt
  if(changed==='pe-from' && fi.dataset.prev && from && to){ to = addDays(to, dayDiff(fi.dataset.prev, from)); $('#pe-to').value = to; }
  fi.dataset.prev = from;
  if(to && from && to<from){ $('#pe-to').value=''; to=''; toast('„Bis“ liegt vor „Von“, bitte prüfen.'); }
  const dates = dateRange(from, to), cur = peCollect();
  const days = dates.length===cur.length ? cur.map((d,i)=>({...d, date:dates[i]}))
    : dates.map(date=>cur.find(d=>d.date===date) || {id:'', date, label:'', start:'', end:'', need:{}, times:{}});
  $('#pe-days').innerHTML = peDaysHtml(days);
}

    <div class="row save-bar">${ev.id?'':'<button class="btn" type="button" data-act="peOffer">Angebot einlesen</button>'}<button class="btn primary" type="submit">${ev.id?'Speichern':'Anlegen'}</button>

function savePEvent(id){
  peReadCats();
  const name = $('#pe-name').value.trim(), days = peCollect();
  if(!name || !days.length){ toast('Bitte Name und Datum angeben.'); return; }
  const roles = peRoles.map(r=>({id:r.id, name:r.name.trim()}));
  if(!roles.length){ toast('Bitte mindestens eine Kategorie wählen.'); return; }
  if(roles.some(r=>!r.name)){ toast('Bitte jeder Kategorie einen Namen geben.'); return; }
  const ev = id ? PS.events[id] : {id:uid()};
  if(id && !foreignChangeOk(ev, pEditStamp, 'Dieses Event')) return;
  // Kategorien, die wegfallen, dürfen keine Einsätze mehr haben
  if(id){ const gone = asgOf(id).filter(a=>!roles.some(r=>r.id===a.role));
    if(gone.length){ toast(`In „${roleName(ev,gone[0].role)}“ sind noch Personen eingeplant. Erst dort entfernen.`); return; }
    // Kategorie an einem Tag entfernt, an dem noch jemand eingeplant ist
    const offDay = asgOf(id).find(a=>{ const nd=days.find(d=>d.id===dayOf(ev,a).id); return nd && nd.cats && !nd.cats.includes(a.role); });
    if(offDay){ toast(`Am ${dWD(dayOf(ev,offDay).date)} sind in „${roleName(ev,offDay.role)}“ noch Personen eingeplant. Erst dort entfernen.`); return; } }
  const oldDays = id ? daysOf(ev) : [];
  days.forEach(d=>{ if(!d.id) d.id=uid(); });
  // Tage, die wegfallen, dürfen keine Einsätze mehr haben
  for(const od of oldDays){
    if(days.some(d=>d.id===od.id)) continue;
    const n = asgOfDay(ev, od).length;
    if(n){ toast(`Am ${dWD(od.date)} ${n===1?'ist noch 1 Person':`sind noch ${n} Personen`} eingeplant. Erst dort entfernen.`); return; }
  }
  if(id) asgOf(id).forEach(a=>{
    const od = dayOf(ev, a), nd = days.find(d=>d.id===od.id);
    if(!a.dayId){ a.dayId = od.id; put('assignments',a); }
    // Einsätze ohne Schicht ziehen mit, solange ihre Planzeit noch der alten Zeit ihrer Rolle entspricht
    if(nd && !a.shiftId){ const o=roleTime(od,a.role), n=roleTime(nd,a.role);
      if(a.planStart===o.start && a.planEnd===o.end && (n.start!==o.start || n.end!==o.end)){ a.planStart=n.start; a.planEnd=n.end; put('assignments',a); } }
  });
  Object.assign(ev, {name, roles, mainStart:peMain.start, mainEnd:peMain.end, days, date:days[0].date, dateEnd:days[days.length-1].date, start:days[0].start, end:days[0].end});
  delete ev.need;
  put('events',ev);
  persist(); pAddEvent=false; pEditEvent=false; peRoles=null; pEventId=ev.id; pDayId=null; view='pEvent'; render(); window.scrollTo(0,0); toast(id?'Event gespeichert':'Event angelegt');
}

function vPersonal(){
  const t = today();
  const evs = live('events').sort(byDate);
  const up = evs.filter(e=>evTo(e)>=t), past = evs.filter(e=>evTo(e)<t).reverse();
  const row = (ev, isPast) => {
    const s = evState(ev);
    const pill = isPast ? (s.missingIst ? '<span class="pill warn">Ist-Zeiten fehlen</span>' : '')
      : s.open ? `<span class="pill bad">${s.open} offen</span>` : s.req ? `<span class="pill warn">${s.req} angefragt</span>` : '<span class="pill ok">komplett</span>';
    return `<div class="item ${isPast?'':'amp-'+s.amp}"><button class="head" data-act="pOpenEvent" data-id="${ev.id}">
      <span><span class="name">${esc(ev.name)}</span><br><span class="small muted">${evWhen(ev)}</span></span>
      ${pill}<span class="muted" aria-hidden="true">›</span></button></div>`;
  };
  // Nach Jahr des ersten Event-Tages gruppieren; ein Jahr entsteht, sobald ein Event darin liegt
  const byYear = list => { const m=new Map(); list.forEach(e=>{ const y=evFrom(e).slice(0,4); if(!m.has(y)) m.set(y,[]); m.get(y).push(e); }); return [...m]; };
  const upYears = byYear(up), pastYears = byYear(past);
  return `<div class="stack">
    <div class="row spread"><div><div class="eyebrow">Personal</div><h1>Events</h1></div>
      <button class="btn primary" data-act="pAddEvent">+ Event</button></div>
    ${pAddEvent ? eventFormHtml({}) : ''}
    ${up.length ? upYears.map(([y,list])=>{ const red=list.filter(e=>evState(e).open).length;
        return `<section class="year"><div class="row spread year-h"><h2>${y}</h2><span class="small muted">${list.length} Event${list.length>1?'s':''}${red?` · <span style="color:var(--bad)">${red} mit offenen Plätzen</span>`:''}</span></div>
          <div class="list">${list.map(e=>row(e,false)).join('')}</div></section>`; }).join('')
      : `<div class="panel empty">Keine anstehenden Events. Mit „+ Event“ anlegen.</div>`}
    ${pastYears.length ? `<div class="stack" style="gap:8px;margin-top:10px"><div class="eyebrow">Vergangen</div>
      ${pastYears.map(([y,list])=>{ const open=!!pPastOpen[y], miss=list.filter(e=>evState(e).missingIst).length;
        return `<button class="btn" data-act="pPastToggle" data-y="${y}" aria-expanded="${open}" style="justify-content:space-between">
          <span><b>${y}</b> · ${list.length} Event${list.length>1?'s':''}${miss?` · <span style="color:var(--warn)">${miss}× Ist-Zeiten fehlen</span>`:''}</span><span aria-hidden="true">${open?'▴':'▾'}</span></button>
          ${open ? `<div class="list">${list.map(e=>row(e,true)).join('')}</div>` : ''}`; }).join('')}</div>` : ''}
  </div>`;
}

/* Abweichung Ist zu Plan, z. B. „+0:45“ */

/* Geöffnete „Ändern“-Bereiche bleiben beim Neuzeichnen offen; Planzeiten werden ohne Neuzeichnen gespeichert

          <label class="f">Kategorie<select data-pa="role" data-id="${a.id}">${rolesOf(ev).filter(x=>x.id===a.role || rolesOfDay(ev,day).includes(x)).map(({id:r,name:l})=>`<option value="${r}" ${a.role===r?'selected':''}>${esc(l)}</option>`).join('')}</select></label>

          <label class="f">Plan Beginn<input type="time" data-pa="planStart" data-id="${a.id}" value="${esc(a.planStart||'')}"></label>

function vPEvent(){
  const ev = PS.events[pEventId];
  if(!ev || ev.deleted){ view='personal'; return vPersonal(); }
  const days = daysOf(ev);
  const day = days.find(d=>d.id===pDayId) || nextDay(ev); pDayId = day.id;
  const multi = days.length>1, di = days.indexOf(day);
  const as = asgOfDay(ev, day), need = day.need||{}, d = dur(day.start, day.end);
  const order = {bestaetigt:0, angefragt:1, abgesagt:2};
  const roles = rolesOf(ev).map(x=>x.id).filter(r=>(ev.roles && rolesOfDay(ev,day).some(x=>x.id===r)) || (Number(need[r])||0)>0 || as.some(a=>a.role===r));
  const s = dayState(ev, day);
  const shifts = ev.shifts||[];
  const dayLine = `${dWD(day.date)}${day.start?' · '+tSpan(day.start,day.end)+' Uhr':''}${d!=null&&day.end?' · '+hm(d)+' Std.':''}`;

  let d = String(s||'').replace(/[^\d+]/g,'');
  if(d.startsWith('+')) d=d.slice(1); else if(d.startsWith('00')) d=d.slice(2); else if(d.startsWith('0')) d='49'+d.slice(1);

async function waShare(a, key='wa'){
  if(key==='wa2' && !(a.actualStart && a.actualEnd)){ toast('Erst Ist Beginn und Ist Ende eintragen.'); return; }
  const text = waText(a, key), tel = waPhone(PS.persons[a.personId]?.phone);

/* ===================== Zeitstrahl ===================== */
/* Pro Kategorie: Bedarfszeitraum und wie viele Bestätigte (mit Planzeit) zu jeder Zeit da sind.
   Grün = Bedarf gedeckt, Rot = zu wenige. Darunter die einzelnen Personen als Balken. */
const TL_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h7M5 8h9M2 12h5"/></svg>';
let tlDayId = null;
function tlOpen(){ tlDayId = pDayId; renderTimeline(); }
function tlClose(){ tlDayId = null; $('#qbRoot').innerHTML=''; }
/* Zeitachse eines Tages: Minuten ab dem frühesten Bedarfsbeginn; Zeiten nach Mitternacht laufen weiter (26:00 = 02:00) */
function dayAxis(ev, day){
  const as = asgOfDay(ev, day).filter(a=>a.status==='bestaetigt');
  const need0 = rolesOfDay(ev, day).map(r=>mins(roleTime(day,r.id).start)).filter(x=>x!=null), asg0 = as.map(a=>mins(a.planStart)).filter(x=>x!=null);
  const base = need0.length ? Math.min(...need0) : asg0.length ? Math.min(...asg0) : 0;
  // Eine Zeit kann am Tag selbst oder (nach Mitternacht) am Folgetag liegen. Gewählt wird die Lage, die am besten
  // zur Bedarfszeit (ref) passt; ohne ref die näher am Tagesbeginn. Bedarfszeiten selbst beginnen nie vor base.
  const span = (s,e,ref) => { if(!s || !e) return null;
    const d = dur(s,e)||0, a0 = ((mins(s)-base)%1440+1440)%1440;
    if(!ref) return [a0, a0+d];
    const ov = c => Math.max(0, Math.min(c+d, ref[1]) - Math.max(c, ref[0]));
    const c = [a0, a0-1440].sort((x,y)=>ov(y)-ov(x) || Math.abs(x-ref[0])-Math.abs(y-ref[0]))[0];
    return [c, c+d]; };
  const clock = m => { const x=((base+m)%1440+1440)%1440; return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`; };
  // Gesamtfenster des Tages (alle Bedarfszeiten) als Bezug für Kategorien ohne eigene Zeit
  const wins = rolesOfDay(ev, day).map(r=>{ const t=roleTime(day,r.id); return span(t.start,t.end); }).filter(Boolean);
  const dayWin = wins.length ? [Math.min(...wins.map(x=>x[0])), Math.max(...wins.map(x=>x[1]))] : null;
  return {as, span, clock, dayWin};
}
/* Abdeckung einer Kategorie über die Bedarfszeit (bestätigte Personen mit Planzeit):
   Abschnitte mit Anzahl; state = bad (irgendwann zu wenige), over (irgendwann zu viele, auch kurz), ok (durchgehend genau) */
function roleCoverage(ev, day, r, ax=dayAxis(ev, day)){
  const n = Number((day.need||{})[r])||0, t = roleTime(day,r), w = ax.span(t.start,t.end);
  const mine = ax.as.filter(a=>a.role===r), ppl = mine.map(a=>({a, x:ax.span(a.planStart,a.planEnd, w || ax.dayWin)})).filter(o=>o.x);
  const pts = new Set(); if(w){ pts.add(w[0]); pts.add(w[1]); } ppl.forEach(o=>{ pts.add(o.x[0]); pts.add(o.x[1]); });
  const ps = [...pts].sort((x,y)=>x-y), segs = [];
  for(let i=0;i<ps.length-1;i++){
    const x=ps[i], y=ps[i+1]; if(y<=x) continue;
    const cnt = ppl.filter(o=>o.x[0]<=x && o.x[1]>=y).length, inW = w && n && w[0]<=x && y<=w[1];
    const cls = inW ? (cnt<n ? 'bad' : cnt>n ? 'over' : 'ok') : cnt ? 'extra' : '';
    const last = segs[segs.length-1];
    if(last && last.cls===cls && last.cnt===cnt && last.y===x) last.y=y; else segs.push({x, y, cnt, cls});
  }
  const c = mine.length;
  const state = !n ? '' : (!w || ppl.length<c) ? (c<n ? 'bad' : c>n ? 'over' : 'ok')
    : segs.some(g=>g.cls==='bad') ? 'bad' : segs.some(g=>g.cls==='over') ? 'over' : 'ok';
  return {n, t, w, ppl, segs, state};
}
function renderTimeline(){
  const ev = PS.events[pEventId]; if(!ev || tlDayId==null) return;
  const days = daysOf(ev), day = days.find(d=>d.id===tlDayId) || days[0];
  const ax = dayAxis(ev, day), as = ax.as, clock = ax.clock;
  const roles = rolesOfDay(ev, day).filter(r=>(Number((day.need||{})[r.id])||0)>0 || as.some(a=>a.role===r.id));
  const covs = roles.map(r=>roleCoverage(ev, day, r.id, ax));
  const all = [];
  covs.forEach(c=>{ if(c.w) all.push(...c.w); c.ppl.forEach(o=>all.push(...o.x)); });
  const lo = all.length ? Math.floor(Math.min(...all)/60)*60 : 0, hi = all.length ? Math.ceil(Math.max(...all)/60)*60 : 60;
  const W = Math.max(60, hi-lo), pct = m => ((m-lo)/W*100).toFixed(2)+'%', wid = (a,b) => ((b-a)/W*100).toFixed(2)+'%';
  const step = W>12*60 ? 120 : 60;
  const axis = []; for(let m=lo; m<=hi; m+=step) axis.push(`<span style="left:${pct(m)}">${clock(m).slice(0,2)}</span>`);
  const rows = roles.map((r,ri)=>{
    const {n, t, w, ppl, segs} = covs[ri];
    const list = cls => segs.filter(g=>g.cls===cls).map(g=>`${clock(g.x)}–${clock(g.y)}: ${g.cnt} von ${n}`).join(' · ');
    const gaps = list('bad'), overs = list('over');
    const verdict = !n ? '<span class="muted">Kein Bedarf eingetragen</span>' : !w ? '<span class="muted">Keine Bedarfszeit eingetragen</span>'
      : (gaps ? `<span class="tl-bad">⚠ Zu wenige: ${gaps}</span>` : '') + (gaps && overs ? '<br>' : '') + (overs ? `<span class="tl-over">Überbelegt: ${overs}</span>` : '')
        || `<span class="tl-ok">✓ Durchgehend genau ${n} bestätigt</span>`;
    return `<div class="tl-row">
      <div class="row spread" style="align-items:baseline"><b>${esc(r.name)}</b><span class="small muted">Bedarf ${n||'–'}${w?' · '+tSpan(t.start,t.end):''}</span></div>
      <div class="tl-bar">${w&&n?`<i class="tl-win" style="left:${pct(w[0])};width:${wid(w[0],w[1])}"></i>`:''}${segs.filter(g=>g.cls).map(g=>`<i class="tl-seg ${g.cls}" style="left:${pct(g.x)};width:${wid(g.x,g.y)}" title="${clock(g.x)}–${clock(g.y)}: ${g.cnt}">${(g.y-g.x)/W>.06?g.cnt:''}</i>`).join('')}</div>

/* Ablauf: Event (oder neu) → Tag → Person → Rolle → geplante Zeit → Status „angefragt“ */
function pqOpen(eventId, role, dayId){
  pq = {eventId:'', dayId:'', newEv:null, personId:'', q:'', role:role||'', shiftId:'', planStart:'', planEnd:'', rate:'', payType:'hour'};
  const ev = PS.events[eventId];
  if(ev && !ev.deleted){ pq.eventId=eventId; pq.dayId=(daysOf(ev).find(d=>d.id===dayId)||nextDay(ev)).id; pqTimes(); }
  renderPQ(); setTimeout(()=>{ const f=$('#pq-q'); if(f) f.focus(); }, 30);
}
function pqClose(){ pq=null; $('#qbRoot').innerHTML=''; }
const pqDay = () => { const ev=PS.events[pq.eventId]; return ev ? (daysOf(ev).find(d=>d.id===pq.dayId) || daysOf(ev)[0]) : null; };
function pqTimes(){
  const ev = PS.events[pq.eventId]; if(!ev) return;
  const sh = (ev.shifts||[]).find(s=>s.id===pq.shiftId) || roleTime(pqDay(), pq.role);
  pq.planStart = sh.start||''; pq.planEnd = sh.end||'';
}
function pqDefaultRole(){
  const ev = PS.events[pq.eventId], p = PS.persons[pq.personId]; if(!ev) return '';
  const day = pqDay(), as = asgOfDay(ev, day), need = day.need||{};
  const open = r => (Number(need[r])||0) > as.filter(a=>a.role===r && a.status!=='abgesagt').length;
  const cats = rolesOfDay(ev, day).map(x=>x.id);
  const mine = (p && p.roles || []).filter(r=>cats.includes(r));
  return mine.find(open) || mine[0] || cats.find(open) || '';
}
function pqPersonList(){

  let h = ps.slice(0, q?20:12).map(p=>{

function pqCreateEv(){

/* Uhrzeiten am iPhone: statt Drehrad Zifferntastatur, „1430“ wird zu „14:30“, danach weiter zum nächsten Zeitfeld.
   Am Rechner bleibt das normale Zeitfeld. */
const TOUCH = matchMedia('(pointer: coarse)').matches;
function normTime(v){
  v = String(v||'').trim(); if(!v) return '';
  let h, m; const c = v.match(/^(\d{1,2})\D+(\d{1,2})$/);
  if(c){ h=c[1]; m=c[2].padEnd(2,'0'); }
  else { const d=v.replace(/\D/g,''); if(!d || d.length>4) return null;
    if(d.length<=2){ h=d; m='0'; } else if(d.length===3){ h=d[0]; m=d.slice(1); } else { h=d.slice(0,2); m=d.slice(2); } }
  h=Number(h); m=Number(m); if(h===24 && m===0) h=0;
  return h<=23 && m<=59 ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}` : null;
}
function touchTimes(root){
  root.querySelectorAll('input[type=time]').forEach(i=>{ i.type='text'; i.inputMode='numeric'; i.autocomplete='off'; i.placeholder='hh:mm'; i.maxLength=5; i.classList.add('tm'); });
}
if(TOUCH){
  touchTimes(document);
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) touchTimes(n); }))).observe(document.body, {childList:true, subtree:true});
  document.addEventListener('input', e=>{ const t=e.target; if(!t.classList || !t.classList.contains('tm')) return;
    const d=t.value.replace(/\D/g,'');
    if(d.length===4 && !t.value.includes(':')){ const v=normTime(d); if(!v) return; t.value=v;
      // erst speichern (kann neu zeichnen), dann das nächste Zeitfeld an gleicher Stelle suchen
      const idx=[...document.querySelectorAll('input.tm')].indexOf(t);
      t.dispatchEvent(new Event('change',{bubbles:true})); touchTimes(document);
      document.querySelectorAll('input.tm')[idx+1]?.focus(); } }, true);
  // vor allen anderen Handlern normalisieren
  document.addEventListener('change', e=>{ const t=e.target; if(!t.classList || !t.classList.contains('tm')) return;
    const v=normTime(t.value); if(v===null){ toast('Uhrzeit bitte als hh:mm, z. B. 1430 für 14:30.'); t.value=''; } else t.value=v; }, true);
}

function arm(el){ if(el.dataset.armed) return true; el.dataset.armed='1'; el.dataset.label=el.textContent; el.textContent=el.dataset.confirm;

    case 'qbReason': QB.reason=el.dataset.r; renderQB(); break;

    case 'pqClose': pqClose(); break;

    case 'pqPickEv': pq.eventId=id; pq.dayId=nextDay(PS.events[id]).id; pq.shiftId=''; pqTimes(); if(pq.personId && !pq.role) pq.role=pqDefaultRole(); renderPQ(); $('#pq-q')?.focus(); break;

    case 'pqCreateEv': pqCreateEv(); break;
    case 'pqDay': pq.dayId=id; if(pq.role && !rolesOfDay(PS.events[pq.eventId], pqDay()).some(x=>x.id===pq.role)) pq.role=pq.personId?pqDefaultRole():''; pqTimes(); if(pq.personId) pq.role=pq.role||pqDefaultRole(); renderPQ(); break;
    case 'pqPickP': pq.personId=id; if(!pq.role){ pq.role=pqDefaultRole(); pqTimes(); } renderPQ(); break;
    case 'pqChangeP': pq.personId=''; renderPQ(); $('#pq-q')?.focus(); break;
    case 'pqNewP': { const nm=pq.q.trim(); const p=put('persons',{id:uid(), name:nm, phone:'', roles:ROLES[pq.role]?[pq.role]:[], note:''}); persist();
      pq.personId=p.id; if(!pq.role) pq.role=pqDefaultRole(); renderPQ(); toast(`„${nm}“ angelegt. Telefon und Rollen unter Personen ergänzen.`); break; }
    case 'pqRole': pq.role=el.dataset.r; pqTimes(); renderPQ(); break;
    case 'pqShift': pq.shiftId=id||''; pqTimes(); renderPQ(); break;
    case 'pqBook': pqBook(); break;

document.addEventListener('input', e=>{

    if(t.id==='qb-q'){ QB.q=t.value; $('#qb-list').innerHTML=qbListHtml(); return; }
    if(t.id==='qb-qty'){ QB.qty=parseNum(t.value); if(isNaN(QB.qty)) QB.qty=0; const b=document.querySelector('[data-act=qbBook]'); const a=S.articles[QB.articleId];
      if(b&&a) b.innerHTML=qbLabel(a); return; }

  }
  if(t.dataset.tpl){ const key=t.dataset.tpl; $('#prev-'+key).textContent=waFill(t.value||WA_TPL[key].def, WA_SAMPLE); return; }

  if(pq){
    if(t.id==='pq-q'){ pq.q=t.value; $('#pq-list').innerHTML=pqPersonList(); return; }
    if(t.id==='pq-start'){ pq.planStart=t.value; return; }
    if(t.id==='pq-end'){ pq.planEnd=t.value; return; }
    if(t.id==='pq-rate'){ pq.rate=t.value; return; }
    if(/^pq-ev-/.test(t.id) && pq.newEv){ pq.newEv[t.id.slice(6)]=t.value; return; }
  }
  if(t.id==='search' || t.id==='invq'){ if(t.id==='search') search=t.value; else invQ=t.value; const id=t.id, pos=t.selectionStart; render(); const s=$('#'+id); if(s){ s.focus(); s.setSelectionRange(pos,pos); } return; }
  if(t.dataset.inv){ invCounts[t.dataset.inv]=t.value; const soll=stockMap()[t.dataset.inv]||0; const d=parseNum(t.value)-soll; const cell=$('#diff-'+t.dataset.inv);
    cell.innerHTML = t.value===''||isNaN(d) ? '' : `<b class="${d>=0?'plus':'minus'}">${d>0?'+':''}${fmt(d,3)}</b>`;
    const g=t.closest('details.grp'); if(g){ const n=g.querySelector('.grp-n'); if(n) n.textContent=invCnt(GRP.inv[g.dataset.g]||[]); }
    const c=Object.values(invCounts).filter(v=>v!==''&&v!=null).length, b=document.querySelector('[data-act=bookInv]'); if(b) b.textContent='Differenzen buchen'+(c?` (${c} gezählt)`:'');
    return; }
  if(t.dataset.h && IMP){ IMP[t.dataset.h]=t.value; return; }
  if(t.dataset.li!==undefined && IMP){
    const l=IMP.items[+t.dataset.li], k=t.dataset.k;
    if(k==='on') return;
    l[k] = ['qty','price','factor'].includes(k) ? parseNum(t.value) : t.value;
    if(k==='qty'||k==='price'){ l.total=(Number(l.qty)||0)*(Number(l.price)||0); }
    const a=S.articles[l.articleId]; const n=(Number(l.qty)||0)*(Number(l.factor)||1); const unit=a?uL(a,n):(l.unit||'');
    const r=$('#res-'+t.dataset.li); if(r) r.textContent=`${IMP.dir==='in'?'+':'−'} ${fmt(n)} ${unit}`;
  }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.xl!==undefined && XL){ XL.rows[+t.dataset.xl].on=t.checked; render(); return; }
  if(t.id==='onlyLow'){ onlyLow=t.checked; render(); return; }
  if(t.id==='hideSvc'){ hideSvc=t.checked; render(); return; }
  if(t.id==='mvFilter'){ mvFilter=t.value; render(); return; }
  if(t.id==='cfg-own'){ CFG.ownName=t.value.trim(); saveCfg(); return; }
  if(t.id==='cfg-auto'){ CFG.autoBook=t.checked; saveCfg(); return; }
  if(t.id==='pe-from' || t.id==='pe-to'){ peRebuild(t.id); return; }
  if(t.id==='pe-mstart' || t.id==='pe-mend'){
    // Neue Hauptzeit in alle Felder, die leer sind oder noch auf der alten Hauptzeit stehen
    const k = t.id==='pe-mstart' ? 'start' : 'end', old = peMain[k];
    document.querySelectorAll(`#pe-days .pd-${k}`).forEach(i=>{ if(!i.value || i.value===old) i.value=t.value; });
    peMain[k] = t.value; return; }
  if(t.id==='pq-paytype' && pq){ pq.payType=t.value; return; }
  if(t.dataset.pay){ const a=PS.assignments[t.dataset.id];
    if(t.dataset.pay==='rate'){ const n=parseNum(t.value); a.rate = t.value.trim()==='' ? 0 : (isNaN(n) ? payOf(a).rate : n); t.value = a.rate ? fmt(a.rate) : ''; }
    else a.payType=t.value;
    document.querySelectorAll(`[data-pay][data-id="${a.id}"]`).forEach(x=>{ if(x!==t) x.value = x.dataset.pay==='rate' ? (a.rate?fmt(a.rate):'') : (a.payType||'hour'); });
    put('assignments',a); persist(); return; }
  if(t.dataset.pa==='actualStart' || t.dataset.pa==='actualEnd'){ const a=PS.assignments[t.dataset.id]; a[t.dataset.pa]=t.value; put('assignments',a); persist();
    const df=istDiff(a), el=$('#ist-d-'+a.id); if(el){ el.textContent=df!=null?hmSigned(df):''; el.className='res '+(df>0?'minus':df<0?'plus':''); }
    return; }
  if(t.dataset.pa==='planStart' || t.dataset.pa==='planEnd'){ const a=PS.assignments[t.dataset.id]; a[t.dataset.pa]=t.value; put('assignments',a); persist();
    const pd=dur(a.planStart,a.planEnd), el=$('#plan-'+a.id); if(el) el.textContent=`Plan ${tSpan(a.planStart,a.planEnd)||'–'}${pd!=null?` (${hm(pd)} Std.)`:''}`;
    pEditDirty=true; return; }
  if(t.dataset.pa){ const a=PS.assignments[t.dataset.id], k=t.dataset.pa; a[k]=t.value;
    if(k==='shiftId' || (k==='dayId' && !a.shiftId)){ const ev=PS.events[a.eventId]; const sh=(ev.shifts||[]).find(x=>x.id===a.shiftId)||dayOf(ev,a); a.planStart=sh.start||''; a.planEnd=sh.end||''; }
    if(k==='dayId') pDayId=t.value;
    put('assignments',a); persist(); render(); return; }
  if(t.dataset.shift){ const ev=PS.events[pEventId]; const sh=(ev.shifts||[]).find(x=>x.id===t.dataset.id); if(!sh) return;
    const old={start:sh.start, end:sh.end}; sh[t.dataset.shift]=t.value.trim(); put('events',ev);
    // Einsätze dieser Schicht ziehen mit, solange ihre Planzeit noch der alten Schichtzeit entspricht
    asgOf(ev.id).filter(a=>a.shiftId===sh.id && a.planStart===old.start && a.planEnd===old.end).forEach(a=>{ a.planStart=sh.start; a.planEnd=sh.end; put('assignments',a); });
    persist(); return; }
  if(t.dataset.ekl){ const l=ES.ekLines[t.dataset.id]; if(!l) return;
    if(t.dataset.ekl==='qty'){ const n=parseNum(t.value); l.qty = isNaN(n) ? 0 : n; }
    else { l.articleId=t.value; l.how = t.value==='skip' ? 'nicht berücksichtigt' : 'manuell'; ekLearn(l); }
    put('ekLines',l); persist(); const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.dataset.pkc){ const r=pkCalc(pkId).rows.find(x=>x.key===t.dataset.pkc); pkCheck(pkId, t.dataset.pkc, t.checked, r ? r.qty : null); const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.dataset.pkq){ const v=t.value.trim();
    if(v===''){ const l=ekAllOf(pkId).find(x=>x.list==='pkset' && x.articleId===t.dataset.pkq); if(l){ del('ekLines',l.id); persist(); } }
    else { const n=parseNum(v); if(isNaN(n)){ t.value=''; return; } pkSet(pkId, t.dataset.pkq, n); }
    const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.dataset.pka){ const l=ES.ekLines[t.dataset.id]; if(!l) return; const k=t.dataset.pka;
    if(k==='qty'){ const n=parseNum(t.value); l.qty = isNaN(n) ? 0 : n; } else l[k]=t.value.trim();
    put('ekLines',l); persist(); if(k==='articleId'||k==='qty'){ const y=scrollY; render(); scrollTo(0,y); } return; }
  if(t.dataset.pgq){ const a=S.articles[t.dataset.id]; const n=parseNum(t.value); if(!(n>0)){ t.value=fmt(a.groups[t.dataset.pgq],3); return; }
    a.groups={...a.groups, [t.dataset.pgq]:n}; put('articles',a); persist(); return; }
  if(t.dataset.ekbuy!==undefined && t.dataset.ekbuy){ const v=t.value.trim();
    if(v===''){ const l=ekListOf(ekId).find(x=>x.list==='set' && x.articleId===t.dataset.ekbuy); if(l){ del('ekLines',l.id); persist(); } }
    else { const n=parseNum(v); if(isNaN(n)){ t.value=''; return; } ekSetBuy(ekId, t.dataset.ekbuy, n); }
    const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.dataset.eka){ const l=ES.ekLines[t.dataset.id]; if(!l) return; const k=t.dataset.eka;
    if(k==='qty'){ const n=parseNum(t.value); l.qty = isNaN(n) ? 0 : n; } else l[k]=t.value.trim();
    if(k==='articleId' && S.articles[l.articleId] && !l.unit) l.unit='';
    put('ekLines',l); persist(); if(k==='articleId'||k==='qty'){ const y=scrollY; render(); scrollTo(0,y); } return; }
  if(t.dataset.eke){ const e=ES.ekEvents[view==='rvEvent' ? rvId : ekId]; if(!e) return; const v=t.value.trim(); if(t.dataset.eke!=='party' && !v){ t.value=e[t.dataset.eke]; return; }
    e[t.dataset.eke]=v; put('ekEvents',e);
    if(['date','from','to'].includes(t.dataset.eke) && rvActive(e)){ rvTake(e.id); toast('Zeitraum geändert: Entnahme auf den neuen Zeitraum umgebucht.'); }
    persist(); if(t.dataset.eke!=='party'){ const y=scrollY; render(); scrollTo(0,y); } return; }
  if(t.dataset.edit){ const a=S.articles[t.dataset.id]; const k=t.dataset.edit;
    if(k==='name' && !t.value.trim()){ t.value=a.name; return; }
    a[k] = ['min','lastPrice'].includes(k) ? (parseNum(t.value)||0) : k==='desc' ? t.value.replace(/\s+$/,'') : t.value.trim(); put('articles',a); persist();
    // Gruppe/Typ/Name geändert: neu einsortieren, Gruppe des offenen Artikels bleibt offen
    if(['name','category','kind'].includes(k)){ bOpen.add(grpKey(a)); render(); }
    return; }
  if(t.dataset.li!==undefined && IMP){
    const l=IMP.items[+t.dataset.li], k=t.dataset.k;
    if(k==='on'){ l.on=t.checked; render(); return; }
    if(k==='articleId'){ l.articleId=t.value; applyKind(l, IMP.dir); render(); }
  }
});
/* Gruppen in Bestand/Inventur: offen-Zustand merken, Inhalt erst beim ersten Aufklappen erzeugen (394 Artikel, iPhone) */
document.addEventListener('toggle', e=>{
  const d=e.target; if(!d.matches || !d.matches('details.grp') || d.dataset.forced) return;
  const set = d.dataset.set==='inv' ? invOpen : bOpen, k=d.dataset.g;
  if(d.open){ set.add(k); const b=d.querySelector('.grp-body'); if(b && !b.firstElementChild) b.innerHTML=(d.dataset.set==='inv'?invRows:bItems)(GRP[d.dataset.set][k]||[]); }
  else set.delete(k);
}, true);
document.addEventListener('submit', e=>{
  if(e.target.id==='pEventForm'){ e.preventDefault(); savePEvent(e.target.dataset.id); return; }
  if(e.target.id==='pPersonForm'){ e.preventDefault(); savePPerson(e.target.dataset.id); return; }
  if(e.target.id==='ekForm'){ e.preventDefault(); const name=$('#ek-name').value.trim(); if(!name) return;
    const ev=put('ekEvents',{id:uid(), name, date:$('#ek-date').value||today(), party:$('#ek-party').value.trim(), offerNo:'', file:'', note:''});
    ekAdding=false; persist(); if(view==='reserv'){ rvId=ev.id; view='rvEvent'; } else { ekId=ev.id; view='ekEvent'; } render(); window.scrollTo(0,0); return; }
  if(e.target.id!=='artForm') return; e.preventDefault();
  const name=$('#na-name').value.trim(); if(!name) return;
  const a = put('articles',{id:uid(), name, unit:$('#na-unit').value.trim(), unitPl:$('#na-unitpl').value.trim(), kind:$('#na-kind').value, desc:$('#na-desc').value.trim(), alias:'',
    category:$('#na-cat').value.trim(), min:parseNum($('#na-min').value)||0, lastPrice:0});
  bOpen.add(grpKey(a)); openArt=a.id;
  const start=parseNum($('#na-start').value); if(start>0) put('movements',{id:uid(), articleId:a.id, qty:start, type:'manual', date:today(), note:'Anfangsbestand'});
  addingArt=false; persist(); render(); toast('Artikel angelegt');
});
function savePPerson(id){
  const name=$('#pp-name').value.trim(); if(!name) return;
  const p = id ? PS.persons[id] : {id:uid()};
  if(id && !foreignChangeOk(p, pPersonStamp, 'Diese Person')) return;
  Object.assign(p, {name, phone:$('#pp-phone').value.trim(), roles:Object.keys(ROLES).filter(r=>$('#pp-role-'+r).checked),
    note:$('#pp-note').value.trim()});
  put('persons',p); persist(); pEditPerson=null; render(); toast(id?'Gespeichert':'Person angelegt');
}
$('#filepick').addEventListener('change', e=>{ const f=e.target.files[0]; e.target.value=''; if(f) importFile(f, dir, null); });
$('#xlspick').addEventListener('change', e=>{ const f=e.target.files[0]; e.target.value=''; if(f) loadXl(f); });
$('#jsonpick').addEventListener('change', async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const d=JSON.parse(await f.text()); S=merge(S,d); persist(); render(); toast('Sicherung eingespielt'); }catch(err){ toast('Datei ist keine gültige Sicherung.'); } });
function bindDrop(){
  const d=$('#drop'); if(!d) return;
  d.addEventListener('dragover', e=>{ e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', ()=>d.classList.remove('over'));
  d.addEventListener('drop', e=>{ e.preventDefault(); d.classList.remove('over'); const f=e.dataTransfer.files[0]; if(f) importFile(f, dir, null); });
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && DBX.connected){ sync(); scanInbox(false); scanOffers(); } });

render();
/* Offline: App-Dateien und Bibliotheken lokal speichern (nur über https) */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // Bibliotheken für Belege vorab laden, damit auch offline gelesen werden kann
    navigator.serviceWorker.ready.then(r=>r.active && r.active.postMessage({type:'warm', urls:[PDFJS, PDFJS_W, TESS]}));
  }).catch(()=>{});
}
window.addEventListener('online', ()=>{ if(DBX.connected){ sync(); scanInbox(false); } });
window.addEventListener('offline', ()=>setSync(DBX.connected?'err':'off', 'Keine Internetverbindung. Buchungen werden gespeichert und später synchronisiert.'));
if(DBX.connected){ setSync('busy'); sync().then(()=>{ scanInbox(true); scanOffers(); }); } else setSync('off');
</script>
